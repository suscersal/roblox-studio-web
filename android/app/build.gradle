plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.suscersal.rsw'
    compileSdk 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.suscersal.rsw"
        minSdk 26
        targetSdk 34

        // The version comes from CI (see .github/workflows/build-and-release.yml).
        // Locally, if the ANDROID_VERSION_CODE variable is absent, versionCode
        // is taken from the file android/.local_version_code and increased by 1 on
        // every build. This is needed so that OtaUpdater.invalidateHotpatchIfAppWasUpdated()
        // sees the versionCode growth and erases the old downloaded hotpatch itself —
        // otherwise it keeps overriding fresh edits in app.py/index.html
        // even after reinstalling the APK (see bridge_launcher.py: hotpatch
        // is always at the start of sys.path if the folder exists).
        def localVersionFile = file("${rootProject.projectDir}/.local_version_code")
        def verCode = System.getenv("ANDROID_VERSION_CODE")?.toInteger()
        if (verCode == null) {
            def prev = localVersionFile.exists() ? localVersionFile.text.trim().toInteger() : 1
            verCode = prev + 1
            localVersionFile.text = verCode.toString()
        }
        def verName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
        versionCode verCode
        versionName verName

        // arm64-v8a covers the vast majority of current devices
        // and noticeably speeds up the build compared with multi-ABI.
        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.11"
        }
    }

    // A permanent signature — so that the APK can be updated over the old
    // version, not only reinstalled. The key is supplied in CI from a
    // GitHub Secret (see the workflow), locally, when the variables are absent,
    // the ordinary Android Studio/Gradle debug key is used.
    def hasCustomSigning = System.getenv("ANDROID_KEYSTORE_PATH") != null

    if (hasCustomSigning) {
        signingConfigs {
            custom {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasCustomSigning) {
                signingConfig signingConfigs.custom
            }
        }
        release {
            minifyEnabled false
            if (hasCustomSigning) {
                signingConfig signingConfigs.custom
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // app.py / rbxl_parser.py / index.html / icons.txt lie here.
    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }
}

chaquopy {
    defaultConfig {
        pip {
            // rbxl_parser.py uses only the standard library —
            // the app's only external dependency is Flask.
            install "flask"
            install "zstandard"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
