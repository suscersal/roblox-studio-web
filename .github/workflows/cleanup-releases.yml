name: Cleanup old releases

on:
  # Once a week: Monday, 03:00 UTC
  schedule:
    - cron: '0 3 * * 1'
  # Manual run; dry-run by default, so that you can look at the list first
  workflow_dispatch:
    inputs:
      keep:
        description: 'How many recent releases to keep (minimum 5)'
        required: false
        default: '5'
      apply:
        description: 'Actually delete (false = dry run only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: cleanup-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a schedule the inputs are empty -> keep=5 and deletion is on.
      # On a manual run we delete only if the apply checkbox is ticked.
      - name: Delete old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ inputs.keep || '5' }}
          APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
        run: |
          set -euo pipefail
          ARGS=(--repo "${{ github.repository }}" --keep "$KEEP")
          if [[ "$APPLY" == "true" ]]; then
            ARGS+=(--apply)
          fi
          python3 .github/scripts/cleanup-releases.py "${ARGS[@]}"
