name: Build and release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'app.py'
      - 'rbxl_parser.py'
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'assistant.js'
      - 'collab.js'
      - 'cloud.js'
      - 'icons.txt'
      - 'icons/**'
      - 'scripts/**'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # We determine which files changed in this push: if it is ONLY
  # "hot" files (pure Python + index.html — they need no compilation),
  # we don't run the full APK build at all, but publish a light
  # OTA update instead (see publish-hot-update). If anything else changed
  # (icons, Kotlin, gradle, the manifest, the workflow) — we build the APK as usual.
  #
  # IMPORTANT: icons.txt and icons/ are deliberately NOT considered "hot" — uploading
  # icons as separate OTA assets too easily runs into the
  # GitHub Releases API limits (a secondary rate limit, "temporarily blocked"), while
  # there is little sense in partially downloading icons alone. So any
  # icon change always goes through a full APK rebuild.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      hot_only: ${{ steps.filter.outputs.hot_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        run: |
          set -euo pipefail

          # For a manual run or the very first push there is nothing to compare with —
          # we treat this as "not only hot" files, i.e. we build everything.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]] || \
             [[ -z "${{ github.event.before }}" ]]; then
            echo "hot_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # Files that NEVER require a full build (documentation, README, etc.)
          IGNORE_REGEX='^(README\.md|\.github/.*\.md|docs/.*|\.gitignore|LICENSE)$'

          # "Hot" paths — what goes into scripts/sync-android-python.sh
          # and doesn't require rebuilding native code. icons.txt/icons/ are not
          # included — see the explanation above the job.
          HOT_REGEX='^(app\.py|rbxl_parser\.py|index\.html|style\.css|script\.js|assistant\.js|collab\.js|cloud\.js)$'

          # We remove from the change list files that don't affect the build at all
          NON_IGNORED=$(echo "$CHANGED" | grep -Ev "$IGNORE_REGEX" || true)

          if [[ -z "$NON_IGNORED" ]]; then
            # ONLY ignored files changed (README etc.) —
            # we don't run anything at all, not even a hot-update.
            echo "hot_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NON_HOT=$(echo "$NON_IGNORED" | grep -Ev "$HOT_REGEX" || true)

          if [[ -z "$NON_HOT" ]]; then
            echo "hot_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "hot_only=false" >> "$GITHUB_OUTPUT"
          fi

  # A single place where the release tag and version are computed — so that in all
  # jobs (build/hot-update) they are the same.
  resolve-tag:
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - name: Compute version
        id: version
        run: |
          echo "tag=v1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: [detect-changes, resolve-tag]
    if: needs.detect-changes.outputs.hot_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # app.py / rbxl_parser.py / index.html / icons.txt / icons/ live in
      # the repository root, while Chaquopy expects them in android/app/src/main/python —
      # we synchronize before the build so as not to duplicate files by hand.
      - name: Sync Python sources into the Android project
        run: bash scripts/sync-android-python.sh

      # android-actions/setup-android@v3 tries to install the "tools" package
      # (the old monolithic Android SDK Tools) — Google removed it entirely
      # from the SDK Manager repository, sdkmanager honestly answers
      # "Failed to find package 'tools'" and the action fails even before the build.
      # We install the SDK manually through bare cmdline-tools, requesting only
      # what Gradle really needs (platform-tools + the platform/build-tools
      # versions from android/app/build.gradle) — without the legacy "tools" package,
      # which isn't needed here (it is for avdmanager/the emulator, and a debug
      # APK build doesn't require it).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # `yes | sdkmanager --licenses` — sdkmanager closes stdin itself
          # without reading the whole infinite yes stream; yes gets SIGPIPE and
          # exits with a nonzero code, and set -o pipefail counts this as a
          # failure of the whole pipeline, although sdkmanager accepted the licenses
          # fine even before that. "|| true" — mutes exactly this (not the license
          # check itself: if sdkmanager really fails to run,
          # the next sdkmanager call with packages will fail by itself, honestly).
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # The repository has no committed gradlew — instead of generating it with
      # the runner's system Gradle (it may be version 9.x, incompatible
      # with the old AGP/Kotlin plugin — it fails on org.gradle.util.VersionNumber)
      # we install the needed version via the official action and call `gradle`
      # directly, without the wrapper.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Optional: if ANDROID_KEYSTORE_BASE64 is set in the repository secrets,
      # all builds (debug and release) are signed with the same key —
      # then the APK can be installed over the previous version without uninstalling.
      # Without the secret the build still passes, just with a temporary debug key.
      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build debug APK
        env:
          ANDROID_VERSION_CODE: ${{ needs.resolve-tag.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ needs.resolve-tag.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/android/app/release.keystore', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-studio-web-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: RbxStudio ${{ needs.resolve-tag.outputs.tag }} (v${{ needs.resolve-tag.outputs.version_name }})
          # Automatically assembles the release description from commits/PRs since the
          # previous release (the change list is generated by GitHub itself) — the same
          # approach as in maxclient.
          generate_release_notes: true
          # IMPORTANT: this must be the only kind of release that is NOT
          # marked prerelease — so /releases/latest and
          # releases/latest/download/app-debug.apk always point to a
          # release that surely has an APK. The hot-update releases below are deliberately
          # marked prerelease: true so as not to capture this status.
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk

  # ---------- Light OTA update: only when "hot" files changed ----------
  # No compilation — we just publish the changed Python/HTML as
  # assets of a new release. The app on the device picks them up by itself
  # (see OtaUpdater.kt) without reinstalling the APK. Icons don't get here —
  # see the explanation in detect-changes.
  publish-hot-update:
    needs: [detect-changes, resolve-tag]
    if: needs.detect-changes.outputs.hot_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Python sources into the Android project
        run: bash scripts/sync-android-python.sh

      - name: Generate OTA manifest
        run: bash scripts/generate-ota-manifest.sh "${{ needs.resolve-tag.outputs.version_name }}"

      - name: Publish hot-update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hot-${{ github.run_number }}
          name: "RbxStudio — hot update ${{ needs.resolve-tag.outputs.version_name }}"
          body: |
            Python/HTML update only (app.py, rbxl_parser.py,
            index.html), with no changes to native Android code and no
            icons. A full APK rebuild was not run for this.
          generate_release_notes: false
          # CRITICAL: we don't let this release become the "latest release" — otherwise
          # releases/latest/download/app-debug.apk would start pointing to a
          # release without an APK. OtaUpdater.kt therefore looks at /releases
          # (the full list, including prereleases), not at /releases/latest.
          prerelease: true
          files: |
            ota/*.py
            ota/*.html
            ota/*.json
            ota/*.css
            ota/*.js
