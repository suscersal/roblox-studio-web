name: Build and release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'app.py'
      - 'rbxl_parser.py'
      - 'index.html'
      - 'icons.txt'
      - 'icons/**'
      - 'scripts/**'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Определяем, какие файлы поменялись в этом пуше: если это ТОЛЬКО
  # "горячие" файлы (чистый Python + index.html — не требуют компиляции),
  # то полную сборку APK не запускаем вообще, а вместо неё публикуем лёгкое
  # OTA-обновление (см. publish-hot-update). Если поменялось что-то ещё
  # (иконки, Kotlin, gradle, манифест, воркфлоу) — собираем APK как обычно.
  #
  # ВАЖНО: icons.txt и icons/ намеренно НЕ считаются "горячими" — заливать
  # иконки как отдельные OTA-ассеты слишком легко упирается в лимиты
  # GitHub Releases API (secondary rate limit, "temporarily blocked"), а
  # смысла в частичной докачке одних иконок немного. Поэтому любое
  # изменение иконок всегда идёт через полную пересборку APK.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      hot_only: ${{ steps.filter.outputs.hot_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        run: |
          set -euo pipefail

          # Для ручного запуска или самого первого пуша сравнивать не с чем —
          # считаем это "не только горячими" файлами, т.е. собираем всё.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]] || \
             [[ -z "${{ github.event.before }}" ]]; then
            echo "hot_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # Файлы, которые НИКОГДА не требуют полной сборки (документация, README и т.п.)
          IGNORE_REGEX='^(README\.md|\.github/.*\.md|docs/.*|\.gitignore|LICENSE)$'

          # "Горячие" пути — то, что попадает в scripts/sync-android-python.sh
          # и не требует пересборки нативного кода. icons.txt/icons/ сюда
          # не входят — см. пояснение над job'ом.
          HOT_REGEX='^(app\.py|rbxl_parser\.py|index\.html)$'

          # Убираем из списка изменений файлы, которые вообще не влияют на сборку
          NON_IGNORED=$(echo "$CHANGED" | grep -Ev "$IGNORE_REGEX" || true)

          if [[ -z "$NON_IGNORED" ]]; then
            # Изменились ТОЛЬКО игнорируемые файлы (README и т.п.) —
            # не запускаем вообще ничего, даже hot-update.
            echo "hot_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NON_HOT=$(echo "$NON_IGNORED" | grep -Ev "$HOT_REGEX" || true)

          if [[ -z "$NON_HOT" ]]; then
            echo "hot_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "hot_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Единая точка, где вычисляется тег релиза и версия — чтобы во всех
  # job'ах (build/hot-update) они были одинаковыми.
  resolve-tag:
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - name: Compute version
        id: version
        run: |
          echo "tag=v1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: [detect-changes, resolve-tag]
    if: needs.detect-changes.outputs.hot_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # app.py / rbxl_parser.py / index.html / icons.txt / icons/ живут в
      # корне репозитория, а Chaquopy ждёт их в android/app/src/main/python —
      # синхронизируем перед сборкой, чтобы не дублировать файлы вручную.
      - name: Sync Python sources into the Android project
        run: bash scripts/sync-android-python.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # В репозитории нет закоммиченного gradlew — вместо генерации его
      # системным Gradle рантера (там может стоять версия 9.x, несовместимая
      # со старым AGP/Kotlin-плагином — падает на org.gradle.util.VersionNumber)
      # ставим нужную версию через официальный action и вызываем `gradle`
      # напрямую, без wrapper.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Опционально: если в секретах репозитория задан ANDROID_KEYSTORE_BASE64,
      # все сборки (debug и release) подписываются одним и тем же ключом —
      # тогда APK можно ставить поверх предыдущей версии без удаления.
      # Без секрета сборка всё равно пройдёт, просто временным debug-ключом.
      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build debug APK
        env:
          ANDROID_VERSION_CODE: ${{ needs.resolve-tag.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ needs.resolve-tag.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/android/app/release.keystore', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-studio-web-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: RbxStudio ${{ needs.resolve-tag.outputs.tag }} (v${{ needs.resolve-tag.outputs.version_name }})
          # Автоматически собирает описание релиза из коммитов/PR со времени
          # прошлого релиза (список изменений генерирует сам GitHub) — тот
          # же подход, что и в maxclient.
          generate_release_notes: true
          # ВАЖНО: это должен быть единственный тип релиза, который НЕ
          # помечен prerelease — так /releases/latest и
          # releases/latest/download/app-debug.apk всегда указывают на
          # релиз, где точно есть APK. Hot-update релизы ниже специально
          # помечены prerelease: true, чтобы не перехватывать этот статус.
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk

  # ---------- Лёгкое OTA-обновление: только когда менялись "горячие" файлы ----------
  # Никакой компиляции — просто публикуем изменившиеся Python/HTML как
  # ассеты нового релиза. Приложение на устройстве само их подтянет
  # (см. OtaUpdater.kt) без переустановки APK. Иконки сюда не попадают —
  # см. пояснение в detect-changes.
  publish-hot-update:
    needs: [detect-changes, resolve-tag]
    if: needs.detect-changes.outputs.hot_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Python sources into the Android project
        run: bash scripts/sync-android-python.sh

      - name: Generate OTA manifest
        run: bash scripts/generate-ota-manifest.sh "${{ needs.resolve-tag.outputs.version_name }}"

      - name: Publish hot-update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hot-${{ github.run_number }}
          name: "RbxStudio — hot update ${{ needs.resolve-tag.outputs.version_name }}"
          body: |
            Только обновление Python/HTML (app.py, rbxl_parser.py,
            index.html), без изменений в нативном Android-коде и без
            иконок. Полная пересборка APK для этого не запускалась.
          generate_release_notes: false
          # КРИТИЧНО: не даём этому релизу стать "latest release" — иначе
          # releases/latest/download/app-debug.apk начнёт указывать на
          # релиз без APK. OtaUpdater.kt поэтому смотрит на /releases
          # (полный список, включая prerelease), а не на /releases/latest.
          prerelease: true
          files: |
            ota/*.py
            ota/*.html
            ota/*.json
