name: Build and release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'app.py'
      - 'rbxl_parser.py'
      - 'index.html'
      - 'icons.txt'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # app.py / rbxl_parser.py / index.html / icons.txt живут в корне
      # репозитория, а Chaquopy ждёт их в android/app/src/main/python —
      # синхронизируем перед сборкой, чтобы не дублировать файлы вручную.
      - name: Sync Python sources into the Android project
        run: |
          mkdir -p android/app/src/main/python
          cp app.py rbxl_parser.py index.html icons.txt android/app/src/main/python/
          if [ -d icons ]; then
            mkdir -p android/app/src/main/python/icons
            cp -r icons/. android/app/src/main/python/icons/
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # В репозитории нет закоммиченного gradlew — вместо генерации его
      # системным Gradle рантера (там может стоять версия 9.x, несовместимая
      # со старым AGP/Kotlin-плагином — падает на org.gradle.util.VersionNumber)
      # ставим нужную версию через официальный action и вызываем `gradle`
      # напрямую, без wrapper.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Версия растёт с каждым запуском CI: 1.0 -> 1.1 -> 1.2 ...
      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Опционально: если в секретах репозитория задан ANDROID_KEYSTORE_BASE64,
      # все сборки (debug и release) подписываются одним и тем же ключом —
      # тогда APK можно ставить поверх предыдущей версии без удаления.
      # Без секрета сборка всё равно пройдёт, просто временным debug-ключом.
      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build debug APK
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/android/app/release.keystore', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-studio-web-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
