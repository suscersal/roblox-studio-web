                    body: JSON.stringify({
                        session: luaLogSessionId, time: luaTimestamp(), level,
                        source: source || sideCls || '', text: trace ? text + '\n' + trace : text,
                    }),
                }).catch(() => { /* нет сети/сервера — молча пропускаем, панель Output и так работает */ });
            }
        }

        function clearLuaOutput() {
            luaOutputLines = [];
            renderLuaOutput();
        }

        function renderLuaOutput() {
            const el = document.getElementById('output-content');
            if (!el) return;
            const filterSel = document.getElementById('output-filter');
            const filter = filterSel ? filterSel.value : 'all';
            // filter — 'all' | 'Script' (Server) | 'LocalScript' (Client). Строки без
            // sideCls (системные сообщения — ошибка загрузки fengari, ошибка
            // прелюдии и т.п.) показываются при ЛЮБОМ фильтре — иначе они бы просто
            // пропадали, а это как раз то немногое, что видно ДО того, как вообще
            // стало понятно, сервер это или клиент.
            const lines = filter === 'all' ? luaOutputLines : luaOutputLines.filter(l => !l.sideCls || l.sideCls === filter);
            if (!lines.length) {
                el.innerHTML = '<span style="color:#6b7280;">(no output)</span>';
                return;
            }
            const colors = { error: '#f87171', warn: '#facc15', print: '#e5e7eb' };
            const icons = { error: '⛔', warn: '⚠️', print: '' };
            el.innerHTML = lines.slice(-200).map(l => {
                const sideBadge = SCRIPT_BADGES[l.sideCls];
                const head = '<span style="color:#6b7280">' + l.time + '</span> ' +
                    (sideBadge ? '<span style="color:' + sideBadge.color + '" title="' + sideBadge.label + '">' + sideBadge.icon + '</span> ' : '') +
                    (l.source ? '<span style="color:#60a5fa">[' + esc(l.source) + ']</span> ' : '') +
                    (icons[l.level] || '');
                const trace = l.trace
                    ? '<div style="color:#9ca3af;padding-left:14px;white-space:pre-wrap;">' + esc(l.trace) + '</div>'
                    : '';
                return '<div style="color:' + (colors[l.level] || '#e5e7eb') + ';margin-bottom:2px;">' +
                    head + esc(l.text) + '</div>' + trace;
            }).join('');
            el.scrollTop = el.scrollHeight;
        }


        // ---- Мост к объектам сцены: только числа/строки/булевы, см. коммент выше ----
        function luaPositionOfRef(ref) {
            const body = physicsBodies[ref];
            if (body) return { x: body.position.x, y: body.position.y, z: body.position.z };
            const p = loadedObjPos[ref];
            if (p) return p;
            const mesh = sceneObjs[ref];
            if (mesh) {
                const pos = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
                mesh.matrix.decompose(pos, q, sc);
                return { x: pos.x, y: pos.y, z: pos.z };
            }
            return { x: 0, y: 0, z: 0 };
        }
        function luaSetPositionOfRef(ref, x, y, z) {
            const body = physicsBodies[ref];
            if (body) body.position.set(x, y, z);
            if (loadedObjPos[ref]) loadedObjPos[ref] = { x, y, z };
            const mesh = sceneObjs[ref];
            if (mesh) {
                const pos = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
                mesh.matrix.decompose(pos, q, sc);
                mesh.matrix.compose(new THREE.Vector3(x, y, z), q, sc);
            }
        }
        // Camera — особый случай: реально двигаем THREE-камеру Play-режима
        // (позиция + lookAt), у неё нет меша в sceneObjs. Вынесено в общую
        // функцию, чтобы ОДИН и тот же код применял CFrame и при разовом
        // присваивании (__set_prop), и покадрово при интерполяции Tween'а
        // (см. updateTweens) — раньше второго пути не было вообще, отсюда
        // "телепорт камеры": TweenService на составных свойствах (CFrame —
        // таблица) не анимировал ничего покадрово, а применял итоговое
        // значение мгновенно в момент завершения tween'а.
        function applyCFrameValue(ref, x, y, z, lx, ly, lz) {
            if (luaByRef[ref] && luaByRef[ref].cls === 'Camera' && typeof camera !== 'undefined') {
                camera.position.set(x, y, z);
                camera.lookAt(x + lx, y + ly, z + lz);
            } else {
                luaSetPositionOfRef(ref, x, y, z);
            }
        }
        // rbxassetid://12345 (или голое число) -> локальный проксирующий
        // URL, который браузер реально может открыть как <img>/<audio>
        // src (см. /api/asset-proxy в app.py). Используется и для
        // ImageLabel.Image, и для Sound.SoundId (см. getOrCreateSoundEl).
        function rbxAssetIdToProxyUrl(idStr) {
            const m = /\d+/.exec(String(idStr || ''));
            if (!m) return null;
            return '/api/asset-proxy?id=' + m[0];
        }

        // Настоящий звуковой движок поверх Sound-инстансов. Раньше
        // Sound:Play()/:Stop()/:Pause() были голыми no-op-заглушками "у
        // движка нет реального аудио-плеера" (см. комментарий в
        // InstanceMT.__index) — для ритм-игры (FNF), где вся суть в
        // синхронизации с музыкой, это означало полную тишину. Каждому
        // Sound-рефу соответствует один настоящий HTMLAudioElement;
        // SoundId/Volume/Looped/PlaybackSpeed синхронизируются в
        // luaSetGenericProp, сама игра дёргает Play/Stop/Pause через
        // __sound_control (см. installLuaBridge и правку в
        // InstanceMT.__index).
        let soundElByRef = {};
        function getOrCreateSoundEl(ref) {
            if (!soundElByRef[ref]) {
                const a = new Audio();
                a.preload = 'auto';
                // Sound.Ended — реальный сигнал Roblox, на который
                // SongMenuScript/Main.lua вешается через
                // sound.Ended:Connect(...), чтобы, например, вернуться в
                // меню, когда трек доиграл сам. Раньше "Ended" не было
                // даже в списке распознаваемых имён событий в
                // InstanceMT.__index (см. makeEvent) — sound.Ended сам по
                // себе возвращал nil, и падение было ещё ДО :Connect,
                // прямо на чтении поля.
                a.addEventListener('ended', () => fireLuaSignal(ref, 'Ended', []));
                // Loaded — раньше нечем было понять, что звук вообще готов
                // играть (SongMenuScript ждёт этого перед стартом превью),
                // sound.Loaded:Connect(...) молча никогда не срабатывал.
                // canplaythrough — честный аналог "метаданные+буфер готовы",
                // а не 'loadedmetadata' (тогда играть ещё рано).
                a.addEventListener('canplaythrough', () => fireLuaSignal(ref, 'Loaded', []), { once: true });
                // DidLoop — родное 'ended' у зацикленного <audio> (loop=true)
                // браузером вообще не шлётся, он просто молча прыгает на
                // начало сам. Ловим момент прыжка по времени (currentTime
                // резко упал, хотя явного Sound:Stop()/перемотки не было).
                let _lastT = 0;
                a.addEventListener('timeupdate', () => {
                    if (a.loop && a.currentTime < _lastT - 0.5) fireLuaSignal(ref, 'DidLoop', []);
                    _lastT = a.currentTime;
                });
                // Раньше ошибка загрузки звука (плохой/просроченный
                // ROBLOX_API_KEY, сеть, ассет недоступен) проходила
                // молча — Sound просто никогда не начинал звучать, без
                // единой подсказки почему. Теперь honest warn в Output
                // (см. logLuaOutput) с именем инстанса и его SoundId.
                a.addEventListener('error', () => {
                    const nm = (luaByRef[ref] && luaByRef[ref].name) || ref;
                    logLuaOutput('warn', t('warn_sound_failed', { name: nm, src: a.src || '?' }));
                });
                soundElByRef[ref] = a;
            }
            return soundElByRef[ref];
        }
        function luaSoundControl(ref, action) {
            const a = soundElByRef[ref];
            if (!a) return; // SoundId ещё не задан — играть нечего
            if (action === 'play') {
                // currentTime не сбрасываем — Roblox Sound:Play() на уже
                // играющем звуке просто продолжает (а не перезапускает);
                // TimePosition для перемотки выставляется отдельным
                // свойством, см. luaSetGenericProp.
                a.play().catch(() => { }); // автоплей иногда блокируется браузером до первого жеста пользователя — не считаем это ошибкой скрипта
            } else if (action === 'stop') {
                a.pause();
                a.currentTime = 0;
            } else if (action === 'pause') {
                a.pause();
            } else if (action === 'resume') {
                a.play().catch(() => { });
            }
        }

        // Разумные Roblox-дефолты для свойств, которых у этого движка нет
        // ни в meshes (Position/Transparency/CanCollide), ни в GUI, ни в
        // virtualInstanceProps — Sound и подобные "не визуальные" классы
        // (см. комментарий у Instance.new про такие классы) реально
        // существуют в самой карте (не через Instance.new), так что для
        // них не было НИКАКОГО хранилища свойств вообще: чтение всегда
        // отдавало null. "sound.Volume * k" на первом же чтении падало
        // "attempt to perform arithmetic on a nil value" — с нужным полем
        // дефолт хотя бы совпадает с тем, что было бы в настоящем Roblox.
        const GENERIC_PROP_DEFAULTS = {
            Volume: 0.5, PlaybackSpeed: 1, Pitch: 1, TimePosition: 0, SoundId: '',
            Looped: false, Playing: false, PlayOnRemove: false,
        };
        let luaGenericPropsByRef = {}; // ref -> {propName: value} — общий "мусорный ящик" для свойств без спец-обработки, чтобы хотя бы запись-потом-чтение работала честно

        function luaGetGenericProp(ref, name) {
            if (name === 'Name' && luaByRef[ref]) return luaByRef[ref].name;
            // Sound — живое состояние реального <audio>, а не то, что
            // Lua когда-то в него в последний раз записал: TimePosition
            // должен ползти сам по себе во время игры (Main.lua сверяет
            // с ним такты чарта), IsPlaying/Playing должны отражать,
            // правда ли звук сейчас звучит (например, после того как
            // трек доиграл до конца сам, без явного Stop()).
            if (luaByRef[ref] && luaByRef[ref].cls === 'Sound' && soundElByRef[ref]) {
                const a = soundElByRef[ref];
                if (name === 'TimePosition') return a.currentTime || 0;
                if (name === 'IsPlaying' || name === 'Playing') return !a.paused && !a.ended;
                if (name === 'TimeLength' || name === 'Length') return a.duration || 0;
                // Pitch — устаревшее (в реальном Roblox давно заменено
                // PlaybackSpeed и фактически является его алиасом, а не
                // отдельным множителем), но старые FNF-скрипты 2018-2021
                // годов сплошь и рядом ставят именно Sound.Pitch. Раньше
                // просто лежало в общем "мусорном ящике" и никак не влияло
                // на звук — читаем/пишем через тот же playbackRate, что и
                // PlaybackSpeed (см. запись ниже).
                if (name === 'PlaybackSpeed' || name === 'Pitch') return a.playbackRate;
            }
            // GUI-объекты — ПЕРЕД virtualInstanceProps: Instance.new("Frame")
            // тоже заводит virtualInstanceProps (см. luaCreateVirtualInstance),
            // но если это GUI-класс, у него ЕЩЁ и guiPropsByRef — та самая
            // "живая" копия, которую видит DOM-рендер. Раньше проверка
            // virtualInstanceProps шла первой и просто перехватывала любое
            // чтение/запись раньше, чем дело доходило до GUI-ветки.
            if (guiPropsByRef[ref] && name in guiPropsByRef[ref]) {
                const v = guiPropsByRef[ref][name];
                // Position/Size — составные UDim2-объекты, мост может
                // передавать в Lua только числа/строки/булевы (см. коммент
                // у installLuaBridge) — отдаём их как JSON-строку, этого
                // достаточно для script.Parent:GetPropertyChangedSignal-
                // независимого чтения/логирования, не для арифметики над UDim2.
                return (v !== null && typeof v === 'object') ? JSON.stringify(v) : v;
            }
            // Instance.new() — нет меша/тела вообще, все свойства просто
            // лежат в обычном JS-объекте, заведённом при создании.
            if (virtualInstanceProps[ref]) {
                const v = virtualInstanceProps[ref][name];
                return v !== undefined ? v : null;
            }
            const mesh = sceneObjs[ref];
            if (name === 'Transparency') {
                return mesh && mesh.material ? 1 - (mesh.material.opacity !== undefined ? mesh.material.opacity : 1) : 0;
            }
            if (name === 'CanCollide') {
                const body = physicsBodies[ref];
                return body ? body.collisionFilterMask !== 0 : true;
            }
            if (luaGenericPropsByRef[ref] && name in luaGenericPropsByRef[ref]) return luaGenericPropsByRef[ref][name];
            if (name in GENERIC_PROP_DEFAULTS) return GENERIC_PROP_DEFAULTS[name];
            return null;
        }
        function luaSetGenericProp(ref, name, value) {
            if (name === 'Name' && luaByRef[ref]) { luaByRef[ref].name = value; return; }
            // Sound — до GUI/virtualInstanceProps веток: Sound не GUI-класс,
            // но должен реально играть, а не просто хранить значение (см.
            // getOrCreateSoundEl/luaSoundControl выше).
            if (luaByRef[ref] && luaByRef[ref].cls === 'Sound') {
                if (name === 'SoundId') {
                    const url = rbxAssetIdToProxyUrl(value);
                    const a = getOrCreateSoundEl(ref);
                    if (url) a.src = url;
                } else if (name === 'Volume') {
                    getOrCreateSoundEl(ref).volume = Math.max(0, Math.min(1, Number(value) || 0));
                } else if (name === 'Looped') {
                    getOrCreateSoundEl(ref).loop = !!value;
                } else if (name === 'PlaybackSpeed' || name === 'Pitch') {
                    // Оба свойства управляют одним и тем же <audio>.playbackRate
                    // (см. коммент в luaGetGenericProp) — что бы скрипт ни
                    // выставил последним, реально звучит именно оно.
                    getOrCreateSoundEl(ref).playbackRate = Number(value) || 1;
                } else if (name === 'TimePosition') {
                    getOrCreateSoundEl(ref).currentTime = Number(value) || 0;
                }
                // Падаем ДАЛЬШЕ (не return) — значение всё равно кладём в
                // luaGenericPropsByRef как раньше, чтобы код, читающий их
                // напрямую без спец-обработки (см. luaGetGenericProp),
                // тоже видел актуальное значение.
            }
            // GUI — ПЕРЕД virtualInstanceProps, той же причине, что и в
            // luaGetGenericProp выше: иначе запись на свежесозданном
            // Instance.new("Frame") молча уходила мимо DOM.
            // Color3/UDim2 через мост не проставить (мост несёт только
            // числа/строки/булевы, см. installLuaBridge), поэтому для
            // BackgroundColor3/TextColor3/Position/Size это ограничение.
            if (guiPropsByRef[ref]) {
                if (guiPatchProp(ref, name, value)) return;
            }
            if (virtualInstanceProps[ref]) { virtualInstanceProps[ref][name] = value; return; }
            const mesh = sceneObjs[ref];
            if (name === 'Transparency' && mesh && mesh.material) {
                mesh.material.transparent = value > 0;
                mesh.material.opacity = 1 - value;
                return;
            }
            if (name === 'CanCollide') {
                const body = physicsBodies[ref];
                if (body) body.collisionFilterMask = value ? 1 : 0;
                return;
            }
            (luaGenericPropsByRef[ref] = luaGenericPropsByRef[ref] || {})[name] = value;
        }
        // Отдельный, СЫРОЙ индекс иерархии для Lua-моста — специально НЕ
        // переиспользует treeByRef/parentByRef (те строятся из /api/tree,
        // а это ровно то дерево, что рисует Explorer: часть классов скрыта
        // (HIDDEN на сервере), есть предел глубины). Lua-скрипту, который
        // делает script.Parent, плевать, показывает ли Explorer этот
        // объект — родитель должен быть виден ВСЕГДА, если он вообще
        // существует в файле. Заполняется в startLuaScripts() из
        // /api/all_instances (см. app.py) — полного нефильтрованного
        // списка ref/class/name/parent.
        let luaByRef = {};          // ref -> {cls, name}
        let luaParentByRef = {};    // ref -> parentRef
        let luaChildrenByRef = {};  // ref -> [childRef, ...]
        // Instance.new() создаёт объекты без меша/физики — их произвольные
        // свойства (кроме Name/Parent, у тех есть отдельная логика) хранятся
        // здесь, а не считываются откуда-то из сцены.
        let virtualInstanceProps = {}; // ref -> {propName: value}
        let luaNextVirtualRef = -1000; // счётчик вниз — не пересекается ни с
        // реальными ref'ами карты (положительные), ни с сентинелом "нет
        // инстанса" (-1, см. wrap() в LUA_PRELUDE).

        // ============ Сигналы/RemoteEvent — общее для обеих VM состояние ============
        let luaSignalConns = {};   // id -> {L, fnRef, ref, evName}
        let luaSignalsByKey = {};  // "ref|evName" -> [id, ...]
        let luaNextSignalId = 1;
        let remoteQueue = [];      // [{ref, targetSide, args, dueAt}] — см. __fire_remote

        // Резолвит и дёргает все Connect-колбэки для (ref, evName) — общий
        // механизм и для RemoteEvent.OnServerEvent/OnClientEvent, и для
        // TextButton.MouseButton1Click (см. guiCreateDomNode). Каждый
        // колбэк вызывается на СВОЁМ L (сервер или клиент — там, где был
        // сделан :Connect), поэтому сервер и клиент физически не могут
        // прочитать локальные переменные друг друга — это и есть изоляция.
        // Пушит args на стек L (тот же формат, что ждут и Connect-колбэки, и
        // резюмируемые Event:Wait() — обёртка ссылок на инстанс через
        // __wrap, числа/строки/bool/nil как есть). Возвращает, сколько
        // значений было запушено.
        function pushLuaSignalArgs(L, args) {
            const { lua } = window.fengari;
            let n = 0;
            for (const a of (args || [])) {
                if (a && typeof a === 'object' && '__instanceRef' in a) {
                    lua.lua_getglobal(L, '__wrap');
                    lua.lua_pushnumber(L, a.__instanceRef);
                    lua.lua_call(L, 1, 1);
                } else if (typeof a === 'number') lua.lua_pushnumber(L, a);
                else if (typeof a === 'boolean') lua.lua_pushboolean(L, a);
                else if (a === null || a === undefined) lua.lua_pushnil(L);
                else lua.lua_pushstring(L, String(a));
                n++;
            }
            return n;
        }

        function fireLuaSignal(ref, evName, args) {
            const { lua } = window.fengari;
            const ids = (luaSignalsByKey[ref + '|' + evName] || []).slice();
            for (const id of ids) {
                const conn = luaSignalConns[id];
                if (!conn) continue;
                const L = conn.L;
                // Раньше здесь напрямую доставали саму Lua-функцию через
                // lua_rawgeti(LUA_REGISTRYINDEX, ...) (см. __register_conn) и
                // звали её lua_pcall — тот путь давал ошибку вида
                // "⛔function: 0x..." (объект ошибки — сама функция), из-за
                // чего непонятно было, что реально пошло не так. Теперь JS
                // знает только id — саму функцию ищет и вызывает Lua-сторона
                // (__invoke_conn в LUA_PRELUDE).
                //
                // Вызываем НЕ напрямую lua_pcall(L,...) на основном
                // состоянии, а через одноразовую корутину (lua_newthread) +
                // lua_resume — иначе любой wait()/Event:Wait() ВНУТРИ
                // обработчика падал с "attempt to yield across a JS-call
                // boundary": основной L — не корутина, yield из него
                // невозможен в принципе. Если обработчик уйдёт в wait(),
                // сама корутина попадёт в luaWaits/luaSignalWaits (эти C-
                // функции видят L2 = именно эту co) и доспит там как
                // обычно — здесь просто не ждём его синхронно.
                const co = lua.lua_newthread(L);
                lua.lua_getglobal(co, '__invoke_conn');
                lua.lua_pushnumber(co, id);
                const n = 1 + pushLuaSignalArgs(co, args);
                const status = lua.lua_resume(co, null, n);
                // lua_newthread положил co на стек L (побочный эффект) —
                // саму co-ссылку мы уже держим в этой JS-переменной, и
                // именно она (не слот на стеке L) не даёт fengari собрать
                // поток раньше времени (см. комментарий в runLuaScript), так
                // что убираем этот слот сразу же, независимо от status —
                // иначе он копится на стеке L при каждом срабатывании сигнала.
                lua.lua_pop(L, 1);
                if (status !== lua.LUA_OK && status !== lua.LUA_YIELD) {
                    logLuaOutput('error', luaErrToString(co), evName, null, L === luaServerL ? 'Script' : 'LocalScript');
                }
            }
            // Будим тех, кто спал в Event:Wait()/:wait() именно на этот
            // (ref, evName) — ровно с теми же аргументами, что получили бы
            // Connect-подписчики выше.
            if (luaSignalWaits.length) {
                const ready = luaSignalWaits.filter(w => w.ref === ref && w.evName === evName);
                if (ready.length) {
                    luaSignalWaits = luaSignalWaits.filter(w => !(w.ref === ref && w.evName === evName));
                    for (const w of ready) {
                        const n = pushLuaSignalArgs(w.co, args);
                        resumeLuaCoroutine(w.co, evName, n);
                    }
                }
            }

            // :FireClient(player, ...) (player-аргумент отбрасывается: у нас
            // всегда ровно один виртуальный LocalPlayer, адресовать некому).
            // Кладётся в очередь и обрабатывается СЛЕДУЮЩИМ кадром
            // (processRemoteQueue) — как и в настоящем Roblox, Remote-вызов
            // не выполняется мгновенно и синхронно, а реплицируется с
            // задержкой (у нас — один тик rAF вместо сетевого пинга).
            def('__fire_remote', function (L2) {
                const ref = lua.lua_tonumber(L2, 1);
                const targetSide = lua.lua_tojsstring(L2, 2);
                const n = lua.lua_gettop(L2);
                const args = [];
                for (let i = 3; i <= n; i++) {
                    const ty = lua.lua_type(L2, i);
                    if (ty === lua.LUA_TNUMBER) args.push(lua.lua_tonumber(L2, i));
                    else if (ty === lua.LUA_TBOOLEAN) args.push(!!lua.lua_toboolean(L2, i));
                    else if (ty === lua.LUA_TSTRING) args.push(lua.lua_tojsstring(L2, i));
                    else args.push(null);
                }
                remoteQueue.push({ ref, targetSide, args, dueAt: performance.now() + 16 });
                return 0;
            });
            def('__fire_bindable', function (L2) {
                // BindableEvent:Fire(...) — синхронно, в отличие от
                // __fire_remote (тот идёт через очередь с задержкой в кадр).
                // В отличие от __fire_remote, здесь ЕЩЁ детектируем аргументы-
                // инстансы (общий паттерн — "какой игрок поймал флаг" и т.п.),
                // не только примитивы: у обёрнутых Instance-таблиц есть
                // rawget-поле "__ref" (см. wrap() в LUA_PRELUDE).
                const ref = lua.lua_tonumber(L2, 1);
                const n = lua.lua_gettop(L2);
                const args = [];
                for (let i = 2; i <= n; i++) {
                    const ty = lua.lua_type(L2, i);
                    if (ty === lua.LUA_TNUMBER) args.push(lua.lua_tonumber(L2, i));
                    else if (ty === lua.LUA_TBOOLEAN) args.push(!!lua.lua_toboolean(L2, i));
                    else if (ty === lua.LUA_TSTRING) args.push(lua.lua_tojsstring(L2, i));
                    else if (ty === lua.LUA_TTABLE) {
                        lua.lua_getfield(L2, i, '__ref');
                        if (lua.lua_isnumber(L2, -1)) args.push({ __instanceRef: lua.lua_tonumber(L2, -1) });
                        else args.push(null);
                        lua.lua_pop(L2, 1);
                    } else {
                        args.push(null);
                    }
                }
                fireLuaSignal(ref, 'Event', args);
                return 0;
            });
        }

        // ====================== Luau -> Lua препроцессор ======================
        // fengari — обычная Lua 5.3, не Luau: она не понимает составное
        // присваивание (+=, -=, *=, /=, %=, ^=, ..=, //=) и continue —
        // а реальные Roblox-скрипты (в т.ч. эта карта — Plugin.lua, Main.lua,
        // SongMenuScript.lua) написаны именно на Luau и используют оба.
        // Раньше это падало ещё на компиляции: "syntax error near '+'"
        // (compound-присваивание) и "syntax error near 'end'" (continue —
        // голый идентификатор не валидный Lua-statement сам по себе).
        // Переписываем ИСХОДНИК перед loadLuaChunk, не трогая парсер.

        // [{type:'code'|'skip', text}] — 'skip' это строки ('...','"...",
        // длинные [[...]]/[=[...]=]) и комментарии (--... и --[[...]]) —
        // их только копируем как есть, не анализируем содержимое.
        function splitLuaSegments(src) {
            const segs = [];
            let i = 0, n = src.length, start = 0;
            const flushCode = (end) => { if (end > start) segs.push({ type: 'code', text: src.slice(start, end) }); };
            while (i < n) {
                const c = src[i];
                if (c === '-' && src[i + 1] === '-') {
                    flushCode(i);
                    let j = i + 2;
                    const lb = matchLuaLongBracket(src, j);
                    if (lb) j = lb.end;
                    else { while (j < n && src[j] !== '\n') j++; }
                    segs.push({ type: 'skip', text: src.slice(i, j) });
                    i = j; start = j; continue;
                }
                if (c === '"' || c === "'") {
                    flushCode(i);
                    let j = i + 1;
                    while (j < n && src[j] !== c) { if (src[j] === '\\') j++; j++; }
                    j = Math.min(j + 1, n);
                    segs.push({ type: 'skip', text: src.slice(i, j) });
                    i = j; start = j; continue;
                }
                if (c === '[') {
                    const lb = matchLuaLongBracket(src, i);
                    if (lb) {
                        flushCode(i);
                        segs.push({ type: 'skip', text: src.slice(i, lb.end) });
                        i = lb.end; start = lb.end; continue;
                    }
                }
                i++;
            }
            flushCode(n);
            return segs;
        }
        // [=*[ ... ]=*] — длинная строка/комментарий Lua. null, если в
        // позиции i такой конструкции нет (одиночная '[' — просто скобка).
        function matchLuaLongBracket(src, i) {
            if (src[i] !== '[') return null;
            let j = i + 1, eq = 0;
            while (src[j] === '=') { eq++; j++; }
            if (src[j] !== '[') return null;
            j++;
            const close = ']' + '='.repeat(eq) + ']';
            const idx = src.indexOf(close, j);
            return { end: idx === -1 ? src.length : idx + close.length };
        }

        // "x OP= y" -> "x = x OP (y)" — только внутри code-сегментов.
        // lvalue ищем СРАЗУ ЗА оператором (regex с $ на срезе "до оператора"
        // — тогда lvMatch.index сразу даёт точную позицию в исходной
        // строке, без лишнего lastIndexOf). rvalue — вперёд от оператора,
        // с балансом скобок, до первого ';'/переноса строки на глубине 0 —
        // покрывает подавляющее большинство реального кода (составные
        // присваивания почти всегда — одна простая строка).
        function expandCompoundAssign(code) {
            const opRe = /([+\-*/%^]|\.\.|\/\/)=(?!=)/g;
            const lvRe = /([A-Za-z_][A-Za-z0-9_]*(?:\s*\.\s*[A-Za-z_][A-Za-z0-9_]*|\s*\[[^\[\]]*\])*)\s*$/;
            let out = '', last = 0, m;
            while ((m = opRe.exec(code))) {
                const opStart = m.index, opEnd = opStart + m[0].length, op = m[1];
                let ls = opStart;
                while (ls > 0 && /\s/.test(code[ls - 1])) ls--;
                const lvMatch = lvRe.exec(code.slice(0, ls));
                if (!lvMatch) continue; // не похоже на lvalue — не наш случай, оставляем как есть
                const lvalue = lvMatch[1];
                const lvStartIdx = lvMatch.index;
                let re = opEnd, depth = 0;
                while (re < code.length) {
                    const ch = code[re];
                    if (ch === '(' || ch === '[' || ch === '{') depth++;
                    else if (ch === ')' || ch === ']' || ch === '}') { if (depth === 0) break; depth--; }
                    else if (depth === 0 && (ch === ';' || ch === '\n')) break;
                    re++;
                }
                const rhs = code.slice(opEnd, re).trim();
                out += code.slice(last, lvStartIdx) + `${lvalue} = ${lvalue} ${op} (${rhs})`;
                last = re;
                opRe.lastIndex = re;
            }
            out += code.slice(last);
            return out;
        }

        // continue -> goto __continue_N + метка перед закрывающим end/until
        // ближайшего цикла (for/while/repeat), с учётом вложенности через
        // простой стек блоков. Не пересекает границу вложенной function —
        // как и в самой Luau, continue не может "прыгнуть" из замыкания
        // наружу.
        function expandContinue(src) {
            const segs = splitLuaSegments(src);
            let loopId = 0;
            const stack = [];
            let pendingLoopDo = false;
            const wordRe = /[A-Za-z_][A-Za-z0-9_]*/g;
            for (const seg of segs) {
                if (seg.type !== 'code') continue;
                let out = '', last = 0;
                wordRe.lastIndex = 0;
                let m;
                while ((m = wordRe.exec(seg.text))) {
                    const w = m[0], idx = m.index;
                    if (w === 'for' || w === 'while') {
                        stack.push({ kind: 'loop', id: ++loopId, continueUsed: false });
                        pendingLoopDo = true;
                        out += seg.text.slice(last, idx) + w; last = idx + w.length; continue;
                    }
                    if (w === 'repeat') {
                        stack.push({ kind: 'repeat', id: ++loopId, continueUsed: false });
                        out += seg.text.slice(last, idx) + w; last = idx + w.length; continue;
                    }
                    if (w === 'if' || w === 'function') {
                        stack.push({ kind: w === 'if' ? 'if' : 'function' });
                        out += seg.text.slice(last, idx) + w; last = idx + w.length; continue;
                    }
                    if (w === 'do') {
                        if (pendingLoopDo) pendingLoopDo = false;
                        else stack.push({ kind: 'do' });
                        out += seg.text.slice(last, idx) + w; last = idx + w.length; continue;
                    }
                    if (w === 'until') {
                        out += seg.text.slice(last, idx);
                        const frame = stack.pop();
                        if (frame && frame.continueUsed) out += `::__continue_${frame.id}:: `;
                        out += 'until'; last = idx + w.length; continue;
                    }
                    if (w === 'end') {
                        out += seg.text.slice(last, idx);
                        const frame = stack.pop();
                        if (frame && frame.kind === 'loop' && frame.continueUsed) out += `::__continue_${frame.id}:: `;
                        out += 'end'; last = idx + w.length; continue;
                    }
                    if (w === 'continue') {
                        out += seg.text.slice(last, idx);
                        let target = null;
                        for (let k = stack.length - 1; k >= 0; k--) {
                            if (stack[k].kind === 'function') break; // continue не пересекает function
                            if (stack[k].kind === 'loop' || stack[k].kind === 'repeat') { target = stack[k]; break; }
                        }
                        out += target ? (target.continueUsed = true, `goto __continue_${target.id}`) : w;
                        last = idx + w.length; continue;
                    }
                }
                out += seg.text.slice(last);
                seg.text = out;
            }
            return segs.map(s => s.text).join('');
        }

        function preprocessLuau(src) {
            const segs = splitLuaSegments(src);
            for (const seg of segs) if (seg.type === 'code') seg.text = expandCompoundAssign(seg.text);
            return expandContinue(segs.map(s => s.text).join(''));
        }

        // luaL_loadstring/luaL_loadbuffer работают с байтовыми буферами
        // (как обычный char* в C), а не с JS-строками напрямую — при не-ASCII
        // содержимом (кириллица в исходнике скрипта — у нас это норма) байтовая
        // длина отличается от JS .length, так что нужен честный to_luastring +
        // luaL_loadbuffer, а не luaL_loadstring "в лоб". Заодно даём чанку имя
        // (chunkname) — тогда ошибки показывают "ИмяСкрипта:12: ...", а не
        // безымянный "[string ...]", ближе к тому, как это выглядит в самой
        // Roblox Studio.
        function loadLuaChunk(L, code, chunkname) {
            const { lauxlib, to_luastring } = window.fengari;
            const buf = to_luastring(preprocessLuau(code));
            return lauxlib.luaL_loadbuffer(L, buf, buf.length, to_luastring(chunkname));
        }

        function doLuaString(L, code, chunkname) {
            const { lua } = window.fengari;
            const status = loadLuaChunk(L, code, chunkname || 'chunk');
            if (status !== lua.LUA_OK) return status;
            return lua.lua_pcall(L, 0, 0, 0);
        }

        // Безопасно достаёт текст ошибки с вершины Lua-стека. Обычный
        // lua_tojsstring возвращает null/undefined, если там НЕ строка —
        // а Lua error() можно вызвать чем угодно (таблицей, числом, nil),
        // это законно. Раньше такой null долетал прямо до esc() в
        // renderLuaOutput() и рушил отрисовку ВСЕГО лога целиком.
        function luaErrToString(L) {
            const { lua, lauxlib } = window.fengari;
            try {
                const s = lua.lua_tojsstring(L, -1);
                if (s !== null && s !== undefined) return s;
            } catch (e) { /* падаем на luaL_tolstring ниже */ }
            try {
                lauxlib.luaL_tolstring(L, -1, null);
                const s2 = lua.lua_tojsstring(L, -1);
                lua.lua_pop(L, 1);
                if (s2 !== null && s2 !== undefined) return s2;
            } catch (e) { /* последний шанс — просто не строка */ }
            return '(ошибка не строкового типа)';
        }

        // luaL_traceback — тот же стек вызовов, что Roblox Studio показывает
        // под ошибкой в Output (разворачиваемым списком); здесь просто всегда
        // прикладываем его отдельной, приглушённой строкой под сообщением.
        function luaGetTraceback(co) {
            const { lua, lauxlib } = window.fengari;
            try {
                lauxlib.luaL_traceback(co, co, null, 1);
                const s = lua.lua_tojsstring(co, -1);
                lua.lua_pop(co, 1);
                return s;
            } catch (e) {
                return null;
            }
        }

        function resumeLuaCoroutine(co, name, nargs) {
            const { lua } = window.fengari;
            const status = lua.lua_resume(co, null, nargs);
            if (status === lua.LUA_YIELD) return; // ушёл в wait(), уже в luaWaits
            if (status !== lua.LUA_OK) {
                const msg = luaErrToString(co);
                logLuaOutput('error', msg, name, luaGetTraceback(co), luaScriptSideByCo.get(co));
            }
        }

        // Полный путь до объекта (A.B.C.ScriptName) — на карте полно РАЗНЫХ
        // скриптов с одинаковым дефолтным именем "Script"/"RegenScript",
        // голое имя в логе не давало понять, какой конкретно из них упал.
        // guard — на случай испорченной/циклической цепочки родителей.
        function luaFullPathOf(ref) {
            const parts = [];
            let cur = ref, guard = 0;
            while (cur !== undefined && cur !== -1 && guard++ < 50) {
                const inst = luaByRef[cur];
                if (!inst) break;
                parts.unshift(inst.name);
                cur = luaParentByRef[cur];
            }
            return parts.length ? parts.join('.') : (luaByRef[ref] ? luaByRef[ref].name : ('ref' + ref));
        }

        function runLuaScript(scr, L) {
            const { lua } = window.fengari;
            const path = luaFullPathOf(scr.ref);
            // function(script) ... end — превращает `script` в upvalue КОНКРЕТНОЙ
            // корутины, а не общий global: несколько скриптов выполняются
            // "параллельно" через кооперативные корутины (см. wait()), общий
            // global script их бы перепутал между собой.
            const wrapped = 'return function(script)\n' + scr.source + '\nend';
            let status = loadLuaChunk(L, wrapped, path);
            if (status !== lua.LUA_OK) {
                logLuaOutput('error', 'ошибка компиляции: ' + luaErrToString(L), path, null, scr.cls);
                lua.lua_pop(L, 1);
                return;
            }
            status = lua.lua_pcall(L, 0, 1, 0);
            if (status !== lua.LUA_OK) {
                logLuaOutput('error', luaErrToString(L), path, null, scr.cls);
                lua.lua_pop(L, 1);
                return;
            }
            const co = lua.lua_newthread(L);     // пушится на стек L, возвращается co
            lua.lua_pushvalue(L, -2);            // копия функции под свежесозданным потоком
            lua.lua_xmove(L, co, 1);             // переносим функцию на стек co
            lua.lua_getglobal(co, '__wrap');
            lua.lua_pushnumber(co, scr.ref);
            lua.lua_call(co, 1, 1);              // co: [функция, script-инстанс]
            lua.lua_pop(L, 2);                   // со стека L убираем саму функцию и поток
            // (поток жив, пока жива JS-ссылка co — см. luaWaits/резюмирование;
            // сборка Lua-мусора у fengari завязана на JS GC)
            luaScriptNameByCo.set(co, path);
            luaScriptSideByCo.set(co, scr.cls);
            resumeLuaCoroutine(co, path, 1);
        }

        // Клонирует поддерево StarterGui в PlayerGui конкретного клиента —
        // как настоящий Roblox: содержимое StarterGui копируется в
        // PlayerGui игрока целиком, у клона свои refs, и LocalScript'ы
        // внутри исполняются от лица КЛОНА (их script.Parent указывает на
        // объект в PlayerGui, а не на шаблон в StarterGui). Возвращает
        // Map(originalRef -> clonedRef).
        function cloneStarterGuiIntoPlayerGui(playerGuiRef) {
            const starterGuiRef = luaFindServiceRef('StarterGui');
            const refMap = {};
            if (starterGuiRef === -1) return refMap;

            function cloneNode(origRef, newParentRef) {
                const origInfo = luaByRef[origRef];
                if (!origInfo) return;
                const newRef = luaCreateVirtualInstance(origInfo.cls);
                luaByRef[newRef].name = origInfo.name;
                luaSetParent(newRef, newParentRef);
                refMap[origRef] = newRef;
                if (guiPropsByRef[origRef]) {
                    guiPropsByRef[newRef] = Object.assign({}, guiPropsByRef[origRef], { cls: origInfo.cls, ref: newRef, parent: newParentRef });
                }
                for (const childRef of (luaChildrenByRef[origRef] || [])) {
                    if (childRef !== newRef) cloneNode(childRef, newRef);
                }
            }
            for (const childRef of (luaChildrenByRef[starterGuiRef] || []).slice()) {
                cloneNode(childRef, playerGuiRef);
            }
            return refMap;
        }

        // Синтетический PlayerModule — в настоящем Roblox это закрытый
        // встроенный модуль (много тысяч строк управления персонажем и
        // камерой), сюда его не переносить; но GetControls():Disable()/
        // :Enable() — единственное, что реально зовут игровые скрипты
        // (см. чат) — и ЭТО у движка есть чем управлять: тот самый
        // WASD-полёт/ходьба персонажа и поворот камеры мышью в Play (см.
        // luaControlsDisabled в applyCharacterControl/onMM/onTM). Поэтому
        // не пустышка "ничего не отключает", а честная связь через
        // __set_controls_enabled.
        const PLAYER_MODULE_SOURCE = [
            'local PlayerModule = {}',
            'local Controls = {}',
            'Controls.__index = Controls',
            'function Controls:Disable() __set_controls_enabled(false) end',
            'function Controls:Enable() __set_controls_enabled(true) end',
            'function PlayerModule:GetControls() return setmetatable({}, Controls) end',
            'return PlayerModule',
        ].join('\n');

        // Создаёт game.Players.LocalPlayer (виртуальный, как и всё Play-only
        // дерево — luaCreateVirtualInstance) с дочерними PlayerGui и
        // Backpack, и клонирует в PlayerGui содержимое StarterGui. Это и
        // есть "полностью локальные" объекты — они существуют ТОЛЬКО в
        // клиентской половине рантайма и пропадают по Stop.
        let luaCharacterRef = -1; // ref виртуального "Model", изображающего player.Character (см. __get_character_ref) — тот самый ходящий куб из Play, а не настоящий Humanoid
        let luaPlayerRef = -1;    // ref единственного LocalPlayer (см. bootstrapClientPlayer) — нужен, чтобы подставлять его первым аргументом в OnServerEvent (см. processRemoteQueue)

        function bootstrapClientPlayer() {
            let playersRef = luaFindServiceRef('Players');
            if (playersRef === -1) playersRef = luaCreateVirtualInstance('Players');
            const playerRef = luaCreateVirtualInstance('Player');
            luaByRef[playerRef].name = 'LocalPlayer';
            luaSetParent(playerRef, playersRef);

            luaCharacterRef = luaCreateVirtualInstance('Model');
            luaByRef[luaCharacterRef].name = 'LocalCharacter';
            luaSetParent(luaCharacterRef, luaWorkspaceRef());

            const playerGuiRef = luaCreateVirtualInstance('PlayerGui');
            luaSetParent(playerGuiRef, playerRef);
            const backpackRef = luaCreateVirtualInstance('Backpack'); // существует для полноты API; не рендерится
            luaSetParent(backpackRef, playerRef);

            const playerScriptsRef = luaCreateVirtualInstance('PlayerScripts');
            luaSetParent(playerScriptsRef, playerRef);
            const playerModuleRef = luaCreateVirtualInstance('ModuleScript');
            luaByRef[playerModuleRef].name = 'PlayerModule';
            luaSetParent(playerModuleRef, playerScriptsRef);
            luaModuleSourceByRef[playerModuleRef] = PLAYER_MODULE_SOURCE;
            luaModuleNameByRef[playerModuleRef] = 'PlayerModule';

            const refMap = cloneStarterGuiIntoPlayerGui(playerGuiRef);
            return { playerRef, playerGuiRef, refMap };
        }

        async function startLuaScripts() {
            luaOutputLines = [];
            renderLuaOutput();
            try { await startLuaScriptsInner(); }
            catch (e) {
                logLuaOutput('error', 'Запуск Lua прерван: ' + (e && e.message ? e.message : String(e)));
                console.error('[Lua] startLuaScripts:', e);
            }
        }

        async function startLuaScriptsInner() {
            luaLogSessionId = 'play_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            const r = await api('GET', '/api/scripts');
            if (!isPlaying) return;
            if (!r || !r.ok) { logLuaOutput('error', '/api/scripts не ответил'); return; }
            if (!r.scripts || !r.scripts.length) { logLuaOutput('warn', 'Нет включённых Script/LocalScript на карте'); return; }

            if (!await ensureFengariLoaded()) {
                logLuaOutput('error', 'fengari не загрузилась — проверь интернет');
                notify('Lua VM (fengari) не загрузилась — проверь интернет', 'err');
                return;
            }
            if (!isPlaying) return; // Play могли остановить, пока грузился fengari

            // Сырой индекс иерархии для script.Parent/GetChildren — из
            // /api/all_instances (весь файл, без фильтров Explorer-дерева).
            const allR = await api('GET', '/api/all_instances');
            luaByRef = {};
            luaParentByRef = {};
            luaChildrenByRef = {};
            if (allR && allR.ok && allR.instances) {
                for (const inst of allR.instances) {
                    luaByRef[inst.ref] = { cls: inst.cls, name: inst.name };
                    luaParentByRef[inst.ref] = inst.parent;
                    // Sound, уже лежащий В ФАЙЛЕ (не Instance.new(...) из
                    // Lua) — SoundId туда никогда не "присваивается" через
                    // мост (luaSetGenericProp), он уже готов при загрузке,
                    // поэтому инициализируем реальный <audio> здесь явно.
                    // Без этого audio.src оставался пустым для абсолютно
                    // всех звуков, лежащих на карте изначально (см. историю:
                    // 5 Sound-рефов с воспроизведением, но без src).
                    if (inst.cls === 'Sound' && inst.soundId) {
                        const a = getOrCreateSoundEl(inst.ref);
                        const url = rbxAssetIdToProxyUrl(inst.soundId);
                        if (url) a.src = url;
                        if (typeof inst.volume === 'number') a.volume = Math.max(0, Math.min(1, inst.volume));
                        if (inst.looped) a.loop = true;
                    }
                }
                for (const inst of allR.instances) {
                    if (inst.parent !== undefined && inst.parent !== -1) {
                        (luaChildrenByRef[inst.parent] = luaChildrenByRef[inst.parent] || []).push(inst.ref);
                    }
                }
            } else {
                logLuaOutput('warn', '/api/all_instances не ответил');
            }
            if (!isPlaying) return; // Play могли остановить, пока шёл запрос

            // GUI-дерево (для клонирования StarterGui->PlayerGui и для
            // самого рендера оверлея) грузим ДО запуска скриптов — иначе
            // клонировать будет нечего.
            const guiR = await api('GET', '/api/gui_tree');
            guiPropsByRef = {};
            guiChildrenByRef = {};
            if (guiR && guiR.ok && guiR.elements) {
                for (const item of guiR.elements) guiPropsByRef[item.ref] = item;
            }

            const { lua, lauxlib, lualib } = window.fengari;
            luaServerL = lauxlib.luaL_newstate();
            lualib.luaL_openlibs(luaServerL);
            installLuaBridge(luaServerL);
            luaClientL = lauxlib.luaL_newstate();
            lualib.luaL_openlibs(luaClientL);
            installLuaBridge(luaClientL);

            for (const [L, label] of [[luaServerL, 'сервера'], [luaClientL, 'клиента']]) {
                const preludeStatus = doLuaString(L, LUA_PRELUDE, 'prelude');
                if (preludeStatus !== lua.LUA_OK) {
                    logLuaOutput('error', 'Lua prelude (' + label + '): ' + luaErrToString(L));
                    luaServerL = null; luaClientL = null;
                    return;
                }
            }

            // ModuleScript-исходники по ref — require() ищет тут (см.
            // __compile_module ниже), а не ходит в сеть на каждый require:
            // /api/scripts уже принёс все исходники разом. Сам кэш
            // выполненных модулей и защита от циклического require() —
            // ЦЕЛИКОМ в Lua (см. LUA_PRELUDE, require()), а не здесь: у
            // сервера и клиента и так разные lua_State с разными globals —
            // раз LUA_PRELUDE выполняется на каждом отдельно, локальные
            // __moduleCache там получаются автоматически изолированными,
            // без JS-стороны, тем же принципом, что и __conns.
            luaModuleSourceByRef = {};
            luaModuleNameByRef = {};
            for (const scr of r.scripts) {
                if (scr.cls !== 'ModuleScript') continue;
                luaModuleSourceByRef[scr.ref] = scr.source;
                luaModuleNameByRef[scr.ref] = scr.name;
            }

            luaWaits = [];
            luaSignalWaits = [];
            luaResetSignals();

            // Server-скрипты (Script) выполняются как есть — по одному
            // разу, "на сервере", видят реальную (нефильтрованную) карту.
            for (const scr of r.scripts) {
                if (scr.cls !== 'Script') continue;
                try { runLuaScript(scr, luaServerL); }
                catch (e) { logLuaOutput('error', scr.name + ': ' + e.message, scr.name, null, scr.cls); }
            }

            // Client: сначала bootstrapClientPlayer() клонирует StarterGui
            // в PlayerGui (получаем refMap: оригинальный ref -> клон), ПОТОМ
            // LocalScript'ы, лежавшие внутри StarterGui, запускаются с
            // ПОДМЕНЁННЫМ ref — от лица своего клона в PlayerGui, а не
            // шаблона. LocalScript'ы вне StarterGui (например, в
            // StarterPlayerScripts) запускаются как есть.
            let refMap = {};
            try {
                const bootResult = bootstrapClientPlayer();
                refMap = bootResult.refMap;
                luaPlayerRef = bootResult.playerRef;
            } catch (e) {
                // Раньше исключение тут (не пойманное) обрывало ВСЮ функцию —
                // ни один LocalScript не запускался, GUI не рендерился, и в
                // Output не было ни строчки объяснения (JS-исключение вне
                // Lua pcall сюда не попадает вообще).
                logLuaOutput('error', 'bootstrapClientPlayer упал: ' + e.message + ' — LocalScript-и и GUI не запущены');
            }
            for (const scr of r.scripts) {
                if (scr.cls !== 'LocalScript') continue;
                const clonedRef = refMap[scr.ref];
                const runAs = clonedRef !== undefined ? Object.assign({}, scr, { ref: clonedRef }) : scr;
                try { runLuaScript(runAs, luaClientL); }
                catch (e) { logLuaOutput('error', scr.name + ': ' + e.message, scr.name, null, scr.cls); }
            }

            renderGuiOverlayFromClient();
        }

        function stopLuaScripts() {
            luaServerL = null; // JS-ссылки отпущены — обе VM и все их корутины
            luaClientL = null; // станут доступны для сборки мусора JS-движком
            luaWaits = [];
            luaSignalWaits = [];
            luaOutputLines = [];
            luaByRef = {};
            luaParentByRef = {};
            luaChildrenByRef = {};
            virtualInstanceProps = {};
            luaGenericPropsByRef = {};
            luaCharacterRef = -1;
            luaPlayerRef = -1;
            luaControlsDisabled = false;
            luaNextVirtualRef = -1000;
            luaResetSignals();
            renderLuaOutput();
            clearGuiOverlay();
        }

        // ============ GUI (ScreenGui/Frame/TextLabel/TextButton/... в Play) ============
        //
        // Roblox-интерфейс рендерится ОТДЕЛЬНЫМ DOM-оверлеем (#gui-overlay)
        // поверх 3D-вьюпорта, а не как объекты three.js-сцены — GUI не имеет
        // геометрии/меша, у него есть только 2D-раскладка (UDim2 Position/
        // Size, экран-относительная). Строится один раз при входе в Play (из
        // /api/gui_tree, см. app.py GUI_CLASSES) и live-обновляется, когда
        // Lua-скрипт меняет свойство через __set_prop (см. luaSetGenericProp).
        let guiPropsByRef = {};    // ref -> {cls, parent, ...GUI_PROPS}
        let guiChildrenByRef = {}; // ref -> [childRef, ...]
        let guiDomByRef = {};      // ref -> HTMLElement

        function color3ToCss(c, transparency) {
            if (!c || typeof c !== 'object') return '#ffffff';
            const r = Math.round((c.r ?? 1) * 255), g = Math.round((c.g ?? 1) * 255), b = Math.round((c.b ?? 1) * 255);
            const a = 1 - (typeof transparency === 'number' ? transparency : 0);
            return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
        }

        // UDim2 {x:{scale,offset}, y:{scale,offset}} -> CSS calc(), точно как
        // в самом Roblox: итоговый пиксель = scale * размер_родителя + offset.
        // Родитель здесь всегда сам #gui-overlay (100% вьюпорта) — вложенные
        // Frame'ы позиционируются относительно родительского DOM-узла через
        // обычное position:absolute, так что calc(%) уже считается верно.
        // Одиночный UDim {scale, offset} -> CSS-длина. Используется для
        // UICorner.CornerRadius/*Radius и т.п. — та же логика, что и в
        // udim2ToCssSize, но для одного измерения.
        function udimToCssLength(u) {
            if (!u || typeof u !== 'object') return '0px';
            return 'calc(' + ((u.scale || 0) * 100) + '% + ' + (u.offset || 0) + 'px)';
        }

        // Применяет UICorner/UIStroke к DOM-элементу их РОДИТЕЛЯ. Эти два
        // класса — не самостоятельные визуальные элементы (в настоящем
        // Roblox тоже), а модификаторы соседнего GuiObject, поэтому они
        // не получают собственный DOM-узел — раньше это вообще никак не
        // обрабатывалось (см. applyGuiElementStyle), из-за чего ЛЮБОЙ
        // UICorner/UIStroke в файле или созданный из Lua
        // (Instance.new("UICorner")) не влиял на картинку: все Frame/
        // TextButton в Play всегда рисовались с прямыми углами и без
        // обводки, даже когда CornerRadius/Thickness были настроены.
        function applyGuiDecoration(parentEl, decoProps) {
            if (!parentEl || !decoProps) return;
            if (decoProps.cls === 'UICorner') {
                // Часть файлов хранит один общий CornerRadius, часть (в
                // т.ч. этот проект) — независимый радиус на каждый угол
                // (более новая версия UICorner в Roblox). Поддерживаем
                // оба варианта.
                if (decoProps.TopLeftRadius || decoProps.TopRightRadius ||
                    decoProps.BottomLeftRadius || decoProps.BottomRightRadius) {
                    const tl = udimToCssLength(decoProps.TopLeftRadius);
                    const tr = udimToCssLength(decoProps.TopRightRadius);
                    const br = udimToCssLength(decoProps.BottomRightRadius);
                    const bl = udimToCssLength(decoProps.BottomLeftRadius);
                    parentEl.style.borderRadius = tl + ' ' + tr + ' ' + br + ' ' + bl;
                } else {
                    parentEl.style.borderRadius = udimToCssLength(decoProps.CornerRadius);
                }
            } else if (decoProps.cls === 'UIStroke') {
                if (decoProps.Enabled === false) return;
                const thickness = (typeof decoProps.Thickness === 'number' ? decoProps.Thickness : 1);
                // inset box-shadow вместо border — обводка не съедает
                // внутреннее пространство и не сдвигает контент/бэкграунд,
                // как настоящий UIStroke (рисуется поверх, не в layout).
                parentEl.style.boxShadow = 'inset 0 0 0 ' + thickness + 'px ' +
                    color3ToCss(decoProps.Color, decoProps.Transparency);
            }
        }

        function udim2ToCssPos(pos) {
            const x = pos && pos.x ? pos.x : { scale: 0, offset: 0 };
            const y = pos && pos.y ? pos.y : { scale: 0, offset: 0 };
            return {
                left: 'calc(' + ((x.scale || 0) * 100) + '% + ' + (x.offset || 0) + 'px)',
                top: 'calc(' + ((y.scale || 0) * 100) + '% + ' + (y.offset || 0) + 'px)',
            };
        }

        function udim2ToCssSize(size) {
            const x = size && size.x ? size.x : { scale: 1, offset: 0 };
            const y = size && size.y ? size.y : { scale: 1, offset: 0 };
            return {
                width: 'calc(' + ((x.scale || 0) * 100) + '% + ' + (x.offset || 0) + 'px)',
                height: 'calc(' + ((y.scale || 0) * 100) + '% + ' + (y.offset || 0) + 'px)',
            };
        }

        function applyGuiElementStyle(el, props) {
            const cls = props.cls;
            const pos = udim2ToCssPos(props.Position);
            const size = udim2ToCssSize(props.Size);
            el.style.left = pos.left;
            el.style.top = pos.top;
            el.style.width = size.width;
            el.style.height = size.height;
            // Файл Roblox хранит инстансы, сгруппированные ПО КЛАССАМ
            // (все TextButton в одном чанке, все TextLabel — в другом), а
            // не в исходном порядке потомков конкретного родителя. Порядок
            // добавления в guiChildrenByRef идёт по порядку чтения этих
            // чанков — то есть фактически СЛУЧАЙНЫЙ относительно того, что
            // на самом деле старше/младше среди детей ОДНОГО родителя. При
            // равном ZIndex (обычное дело: почти всё в файле ZIndex=1) это
            // означает, что TextLabel вроде SongName мог оказаться "выше"
            // TextButton вроде PlayBtn в z-порядке (или наоборот) чисто по
            // случайности того, в каком чанке какой класс лежит в файле —
            // и, получив pointer-events:auto, накрывал собой кнопку
            // (реальный кейс: PlayBtn был недоступен для тапа, потому что
            // SongName того же ряда рисовался поверх, хотя у обоих ZIndex=1
            // — см. диагностику Playwright, "TextLabel intercepts pointer
            // events"). "Настоящий" порядок потомков без переразбора
            // формата не восстановить, поэтому вместо этого гарантируем
            // явным множителем, что интерактивные классы (кнопки, поля
            // ввода) при равном ZIndex ВСЕГДА рисуются выше декоративных
            // (лейблы/фреймы) — это соответствует практическому смыслу
            // разметки (кнопку не проектируют так, чтобы её специально
            // накрывал текст) и не требует знать истинный порядок.
            const isInteractiveCls = props.cls === 'TextButton' || props.cls === 'ImageButton' || props.cls === 'TextBox';
            el.style.zIndex = String((props.ZIndex || 1) * 10 + (isInteractiveCls ? 5 : 0));
            // AnchorPoint — раньше вообще не читался: Position всегда
            // считался левым верхним углом элемента, как AnchorPoint(0,0)
            // по умолчанию. Круги попадания (AnchorPoint 0.5,0.5) и
            // падающие ноты (0,0.5) в Main.lua были смещены относительно
            // задуманного места — процентный transform (в % от размера
            // САМОГО элемента, не родителя) — тот же трюк, что и в
            // настоящем CSS-центрировании, работает независимо от
            // фактического пиксельного размера.
            const ap = props.AnchorPoint;
            el.style.transform = ap ? `translate(${-(ap.x || 0) * 100}%, ${-(ap.y || 0) * 100}%)` : '';
            // ScreenGui/BillboardGui управляются свойством Enabled (не
            // Visible — у ScreenGui такого свойства вообще нет в настоящем
            // Roblox), а раньше Enabled нигде не читался при отрисовке —
            // songMenu.Enabled = true/false из скрипта молча ничего не
            // делало визуально (см. guiPatchProp — он просто перевызывает
            // эту функцию после любого изменения свойства).
            if (cls === 'ScreenGui' || cls === 'BillboardGui') {
                el.style.display = (props.Enabled === false) ? 'none' : 'flex';
            } else {
                el.style.display = (props.Visible === false) ? 'none' : 'flex';
            }

            if (cls === 'Frame' || cls === 'ScrollingFrame') {
                el.style.background = color3ToCss(props.BackgroundColor3, props.BackgroundTransparency);
                el.style.border = (props.BorderSizePixel || 1) > 0
                    ? (props.BorderSizePixel || 1) + 'px solid ' + color3ToCss(props.BorderColor3)
                    : 'none';
                if (props.ClipsDescendants) el.style.overflow = 'hidden';
                if (cls === 'ScrollingFrame') {
                    // Раньше ScrollingFrame рендерился 1-в-1 как обычный
                    // Frame (см. эту же ветку выше) — без overflow:auto
                    // список песен физически не мог прокручиваться, ЧТО
                    // БЫ ни лежало внутри (UIListLayout по-прежнему
                    // раскладывает карточки через position:absolute —
                    // абсолютно спозиционированные потомки корректно
                    // формируют scrollHeight своего прокручиваемого
                    // предка, так что отдельный CanvasSize не нужен).
                    el.style.overflowY = 'auto';
                    el.style.overflowX = 'hidden';
                    el.style.webkitOverflowScrolling = 'touch';
                }
            } else if (cls === 'TextLabel' || cls === 'TextButton' || cls === 'TextBox') {
                el.style.background = (props.BackgroundTransparency >= 1)
                    ? 'transparent' : color3ToCss(props.BackgroundColor3, props.BackgroundTransparency);
                el.style.color = color3ToCss(props.TextColor3, props.TextTransparency);
                el.style.fontSize = (props.TextSize || 14) + 'px';
                el.style.whiteSpace = props.TextWrapped === false ? 'nowrap' : 'pre-wrap';
                el.style.border = 'none';
                el.textContent = props.Text != null ? String(props.Text) : '';
                if (cls === 'TextBox') {
                    el.contentEditable = 'true';
                }
            } else if (cls === 'ImageLabel' || cls === 'ImageButton') {
                el.style.background = color3ToCss(props.BackgroundColor3, props.BackgroundTransparency);
                el.textContent = '';
                // Раньше Image просто складывался в title (всплывающая
                // подсказка при наведении) — картинка нигде не
                // рисовалась, даже когда в файле честно стоял реальный
                // rbxassetid:// (например SongIcon у карточек песен —
                // см. историю чата: иконки альбомов не показывались
                // именно поэтому, хотя ImageUrl был прописан). Настоящий
                // rbxassetid:// браузер напрямую открыть не может (это не
                // http-схема) — гоним через /api/asset-proxy на сервере
                // (см. app.py, тот же приём, что и для скачивания
                // аватара: сервер ходит на assetdelivery.roblox.com сам,
                // браузер получает уже готовые байты картинки).
                const proxyUrl = rbxAssetIdToProxyUrl(props.Image);
                if (proxyUrl) {
                    el.style.backgroundImage = 'url(' + proxyUrl + ')';
                    // Fit — ближе всего к дефолтному ScaleType.Stretch
                    // Roblox визуально не искажает картинку; Crop/Tile
                    // отдельно не эмулируем (редкий случай для этого
                    // движка), но Stretch/Slice трактуем как cover, а
                    // Fit — как contain.
                    el.style.backgroundSize = (props.ScaleType === 'Fit') ? 'contain' : 'cover';
                    el.style.backgroundPosition = 'center';
                    el.style.backgroundRepeat = 'no-repeat';
                    // background-image сам по себе не даёт события ошибки
                    // (в отличие от <img>/<audio>) — ошибка на /api/asset-
                    // proxy раньше проходила молча: элемент просто
                    // оставался пустым, без единой подсказки почему.
                    // Проверяем отдельным Image() специально ради onerror.
                    const probe = new Image();
                    probe.onerror = () => {
                        logLuaOutput('warn', t('warn_image_failed', { name: props.Name || cls, src: proxyUrl }));
                    };
                    probe.src = proxyUrl;
                } else {
                    el.style.backgroundImage = '';
                }
                el.title = props.Image || '';
            }
        }

        function domInputTypeName(e, isMove) {
            if (e.touches !== undefined || (e.type && e.type.indexOf('touch') === 0)) return 'Touch';
            if (isMove) return 'MouseMovement';
            if (e.button === 2) return 'MouseButton2';
            if (e.button === 1) return 'MouseButton3';
            return 'MouseButton1';
        }
        function domInputXY(e) {
            const t = e.touches && e.touches[0];
            return t ? [t.clientX, t.clientY] : [e.clientX, e.clientY];
        }

        function guiCreateDomNode(ref, props) {
            const el = document.createElement(props.cls === 'TextButton' || props.cls === 'ImageButton' ? 'button' : 'div');
            el.className = 'rbx-gui-el';
            el.dataset.ref = ref;
            el.dataset.cls = props.cls;
            applyGuiElementStyle(el, props);
            if (props.cls === 'TextButton' || props.cls === 'ImageButton') {
                el.style.outline = 'none';
                // Клик по кнопке — настоящий Lua-сигнал (fireLuaSignal),
                // а не просто визуальная реакция: любой LocalScript,
                // сделавший button.MouseButton1Click:Connect(fn), получит
                // вызов на клиентской VM (см. installLuaBridge/__connect).
                // MouseButton1Down/Up — только у GuiButton (Text/ImageButton),
                // как и в настоящем Roblox: у обычного Frame их нет.
                el.addEventListener('click', () => fireLuaSignal(ref, 'MouseButton1Click', []));
                el.addEventListener('mousedown', () => fireLuaSignal(ref, 'MouseButton1Down', []));
                el.addEventListener('mouseup', () => fireLuaSignal(ref, 'MouseButton1Up', []));
                // touchend НЕ passive и с preventDefault — иначе следом за
                // нашим сигналом браузер сам досылает "теневые" mousedown/
                // mouseup/click от того же тапа, и MouseButton1Down/Click
                // прилетают в Lua ДВАЖДЫ на одно нажатие. Для тумблеров
                // (открыть/закрыть меню, play/pause и т.п.) двойное
                // срабатывание отменяет само себя — кнопка выглядит
                // "сломанной", хотя оба сигнала технически дошли.
                el.addEventListener('touchstart', () => fireLuaSignal(ref, 'MouseButton1Down', []), { passive: true });
                el.addEventListener('touchend', (e) => { e.preventDefault(); fireLuaSignal(ref, 'MouseButton1Up', []); fireLuaSignal(ref, 'MouseButton1Click', []); }, { passive: false });
            }
            // MouseEnter/MouseLeave — у ЛЮБОГО GuiObject в настоящем Roblox,
            // не только у кнопок (Frame/TextLabel тоже их поддерживают).
            el.addEventListener('mouseenter', () => fireLuaSignal(ref, 'MouseEnter', []));
            el.addEventListener('mouseleave', () => fireLuaSignal(ref, 'MouseLeave', []));
            // InputBegan/InputEnded — тоже у ЛЮБОГО GuiObject (в отличие от
            // MouseButton1Down/Up, которые только у GuiButton) — например,
            // SliderBg в SettingsMenuScript это обычный Frame. InputObject
            // строится в Lua (см. makeEvent/Connect в LUA_PRELUDE) из
            // "сырых" typeName/x/y — тут только они.
            el.addEventListener('mousedown', (e) => fireLuaSignal(ref, 'InputBegan', [domInputTypeName(e, false), ...domInputXY(e)]));
            el.addEventListener('mouseup', (e) => fireLuaSignal(ref, 'InputEnded', [domInputTypeName(e, false), ...domInputXY(e)]));
            // Тач-эквиваленты — см. коммент у document.addEventListener
            // ('touchstart'/...) для UserInputService чуть ниже по файлу:
            // без них sliderBg.InputBegan (обычный Frame, не кнопка) на
            // телефоне мог вообще не сработать в начале жеста перетаскивания.
            el.addEventListener('touchstart', (e) => fireLuaSignal(ref, 'InputBegan', [domInputTypeName(e, false), ...domInputXY(e)]), { passive: true });
            el.addEventListener('touchend', (e) => fireLuaSignal(ref, 'InputEnded', [domInputTypeName(e, false), ...domInputXY(e)]), { passive: true });
            // FocusLost/Focused — TextBox (contentEditable div, см.
            // applyGuiElementStyle). enterPressed — единственный аргумент
            // FocusLost в настоящем Roblox — запоминаем нажатие Enter в
            // keydown и читаем флаг в blur (сам Enter к этому моменту уже
            // не всплывает как отдельное событие).
            if (props.cls === 'TextBox') {
                let enterPressed = false;
                // Живая правка contentEditable не попадает в guiPropsByRef
                // сама по себе — без этого promoInput.Text из Lua всегда
                // читал бы исходное статическое значение, а не то, что
                // реально ввёл игрок.
                el.addEventListener('input', () => { if (guiPropsByRef[ref]) guiPropsByRef[ref].Text = el.textContent; });
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { enterPressed = true; el.blur(); }
                });
                el.addEventListener('focus', () => fireLuaSignal(ref, 'Focused', []));
                el.addEventListener('blur', () => {
                    fireLuaSignal(ref, 'FocusLost', [enterPressed]);
                    enterPressed = false;
                });
            }
            return el;
        }

        function guiRenderNode(ref, parentEl) {
            const props = guiPropsByRef[ref];
            if (!props) return;
            const el = guiCreateDomNode(ref, props);
            guiDomByRef[ref] = el;
            parentEl.appendChild(el);
            for (const childRef of (guiChildrenByRef[ref] || [])) {
                const childProps = guiPropsByRef[childRef];
                if (childProps && (childProps.cls === 'UICorner' || childProps.cls === 'UIStroke')) {
                    // Модификатор, не отдельный визуальный узел — красим
                    // el (родителя), а не создаём для него DOM-элемент.
                    applyGuiDecoration(el, childProps);
                    continue;
                }
                guiRenderNode(childRef, el);
            }
            applyUIListLayout(ref);
        }

        // UIListLayout — раньше был только числом-заглушкой в GUI_CLASS_NAMES
        // (не падал), но реальной раскладки не делал вообще: карточки
        // (например, песен в SongMenuScript, клонированные через Clone())
        // просто оставались на позиции шаблона — все друг на друге в одной
        // точке. Визуально это выглядит как "список из одной песни", хотя
        // данных внутри может быть сколько угодно. Простой вертикальный
        // стек (FillDirection всегда вертикальный, без честного учёта
        // Scale-высоты — обычно у карточек списка задают offset-высоту,
        // этого достаточно) — не полная реализация UIListLayout (нет
        // HorizontalAlignment/Wraps и т.п.), но накладывания друг на друга
        // не будет.
        function applyUIListLayout(containerRef) {
            const kids = (guiChildrenByRef[containerRef] || []).slice();
            let layoutRef = null;
            for (const k of kids) {
                if (guiPropsByRef[k] && guiPropsByRef[k].cls === 'UIListLayout') { layoutRef = k; break; }
            }
            if (!layoutRef) return;
            const layoutProps = guiPropsByRef[layoutRef] || {};
            const paddingPx = (layoutProps.Padding && layoutProps.Padding.offset) || 0;
            let offset = 0;
            for (const k of kids) {
                const p = guiPropsByRef[k];
                if (!p || k === layoutRef) continue;
                if (p.cls && p.cls.indexOf('UI') === 0) continue; // UIPadding/UICorner/... — не элементы списка
                // Visible === false — это как раз наш случай "скрытый
                // шаблон-для-клонирования, оставленный лежать среди
                // остальных детей контейнера" (SongTemplate и т.п.).
                // Раньше он тоже учитывался как элемент списка: занимал
                // место (сдвигая ВСЕ реальные карточки вниз) и, что хуже,
                // МЕНЯЛ Position самого шаблона — следующий клон копировал
                // уже испорченную позицию, а не оригинальную дизайнерскую.
                if (p.Visible === false) continue;
                const oldX = (p.Position && p.Position.x) || { scale: 0, offset: 0 };
                p.Position = { x: oldX, y: { scale: 0, offset } };
                const el = guiDomByRef[k];
                if (el) applyGuiElementStyle(el, p);
                const heightPx = (p.Size && p.Size.y && p.Size.y.offset) || 0;
                offset += heightPx + paddingPx;
            }
        }

        // Рендерит DOM-оверлей из уже готового guiPropsByRef (собранного
        // в startLuaScripts: /api/gui_tree + клоны StarterGui->PlayerGui).
        // Показываем ТОЛЬКО клоны (отрицательные refs — см.
        // luaCreateVirtualInstance) и любые ScreenGui, чей родитель — не
        // StarterGui: сам StarterGui — это шаблон, в реальном Roblox он
        // тоже не рендерится напрямую, только его копии в PlayerGui.
        function renderGuiOverlayFromClient() {
            const overlay = document.getElementById('gui-overlay');
            if (!overlay) { logLuaOutput('error', 'renderGuiOverlayFromClient: #gui-overlay не найден в DOM'); return; }
            overlay.innerHTML = '';
            guiDomByRef = {};
            guiChildrenByRef = {};
            for (const [refStr, props] of Object.entries(guiPropsByRef)) {
                const ref = Number(refStr);
                const parentRef = luaParentByRef[ref];
                if (parentRef !== undefined && parentRef !== -1) {
                    (guiChildrenByRef[parentRef] = guiChildrenByRef[parentRef] || []).push(ref);
                }
            }
            let renderedCount = 0;
            for (const [refStr, props] of Object.entries(guiPropsByRef)) {
                const ref = Number(refStr);
                if (props.cls !== 'ScreenGui' && props.cls !== 'BillboardGui') continue;
                const parentRef = luaParentByRef[ref];
                const parentInfo = parentRef !== undefined ? luaByRef[parentRef] : null;
                const isTemplateUnderStarterGui = parentInfo && parentInfo.cls === 'StarterGui';
                if (isTemplateUnderStarterGui) continue; // шаблон — не рендерим, рендерим клон в PlayerGui
                if (props.Enabled === false) continue; // раньше было props.enabled (маленькая e) — никогда не совпадало, ScreenGui.Enabled=false из плейса игнорировался
                guiRenderNode(ref, overlay);
                renderedCount++;
            }
            overlay.classList.add('active');
            // Временный диагностический лог: сколько top-level ScreenGui/
            // BillboardGui реально ушло в DOM и сколько всего GUI-объектов
            // вообще известно движку на этот момент — если тут 0 при
            // ненулевом totalGuiObjects, значит все они Enabled=false (или
            // props.Enabled не то, что ожидается), а не проблема с самим
            // рендером/CSS.
            logLuaOutput('info', 'GUI overlay: отрисовано верхних экранов ' + renderedCount
                + ' из ' + Object.keys(guiPropsByRef).length + ' известных GUI-объектов');
        }

        function clearGuiOverlay() {
            const overlay = document.getElementById('gui-overlay');
            if (overlay) { overlay.innerHTML = ''; overlay.classList.remove('active'); }
            guiPropsByRef = {};
            guiChildrenByRef = {};
            guiDomByRef = {};
        }

        // Патчит уже отрисованный DOM-узел после того, как Lua-скрипт
        // (Script/LocalScript) поменял GUI-свойство через __set_prop —
        // без этого overlay оставался бы статичным снимком на момент
        // старта Play, а .Text/.Visible/.BackgroundColor3 из скрипта
        // молча ни на что не влияли бы.
        function guiPatchProp(ref, name, value) {
            const props = guiPropsByRef[ref];
            if (!props) return false;
            props[name] = value;
            let el = guiDomByRef[ref];
            if (!el) {
                // Узла ещё нет — это нормально для ScreenGui/BillboardGui,
                // который стартовал с Enabled=false: renderGuiOverlayFromClient
                // при старте Play вообще пропускает такие (см. её код), а
                // значит ни сам он, ни его дети (весь Background/кнопки/тексты
                // внутри) никогда не попадали в DOM. Раньше это молча ничего
                // не делало ("if (!props || !el) return false") — Lua-скрипт
                // ставил Enabled=true, а показывать было physически нечему.
                // Рендерим (и всё поддерево — guiRenderNode рекурсивен) прямо
                // сейчас, при первом реальном включении.
                if (name === 'Enabled' && value === true && (props.cls === 'ScreenGui' || props.cls === 'BillboardGui')) {
                    const overlay = document.getElementById('gui-overlay');
                    if (overlay) {
                        guiRenderNode(ref, overlay);
                        overlay.classList.add('active');
                    }
                }
                return true;
            }
            applyGuiElementStyle(el, props);
            return true;
        }

        function updateLuaScheduler() {
            if (!luaServerL && !luaClientL) return;
            processRemoteQueue();
            updateRunServiceSignals();
            updateTweens();
            if (!luaWaits.length) return;
            const now = performance.now();
            const ready = luaWaits.filter(w => w.resumeAt <= now);
            if (!ready.length) return;
            luaWaits = luaWaits.filter(w => w.resumeAt > now);
