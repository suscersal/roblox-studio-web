<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Roblox Studio Mobile</title>

    <script>
        // ВРЕМЕННАЯ ДИАГНОСТИКА (нет доступа к консоли разработчика) —
        // ловим ЛЮБУЮ необработанную ошибку JS где угодно на странице.
        // Если что-то падает при первой загрузке скрипта, это может тихо
        // остановить выполнение остального кода (в т.ч. не даст
        // определиться функции openFileBrowser) — и тогда клик по кнопке
        // не будет делать вообще ничего, без единого алерта из самой
        // функции. Этот перехватчик покажет такую ошибку.
        window.addEventListener('error', function (e) {
            alert('DEBUG GLOBAL ERROR: ' + e.message +
                '\n' + (e.filename || '') + ':' + e.lineno + ':' + e.colno);
        });
    </script>

        /* Горизонтальный ресайзер между main и bottom-panel */
.resizer-h {
    height: 5px;
    background: #374151;
    cursor: row-resize;
    flex-shrink: 0;
    transition: background 0.2s;
}
.resizer-h:hover,
.resizer-h.active {
    background: #3b82f6;
}

#bottom-panel {
    height: 180px;          /* начальная высота, меняется ресайзером */

    max-height: 60vh;
    background: #1f2937;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    border-top: 1px solid #374151;
}

#output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    background: #111827;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: bold;
    color: #9ca3af;
}
#output-header button {

#output-content {

}

        .notif {
            background: #065f46;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            animation: fadein .2s ease
        }

        .notif.err {
            background: #7f1d1d
        }

        .notif.warn {
            background: #78350f
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        #mobile-pad {
            position: absolute;
            bottom: 56px;
            left: 16px;
            display: none;
            align-items: flex-end;
            gap: 14px;
            z-index: 10;
            pointer-events: none
        }

        @media(pointer:coarse) {
            #mobile-pad {
                display: flex
            }
        }

        /* Раньше стик нужно было ловить пальцем ровно в границах круга
           112px — на телефоне, когда не смотришь на большой палец, это
           стабильно промахивается. Теперь есть широкая невидимая зона
           #joy-zone (выше и вокруг круга), и стик "всплывает" туда, куда
           реально попал палец, а не наоборот. */
        #joy-zone {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 112px;
            height: 240px;
            pointer-events: all;
            touch-action: none;
        }

        #joy-base {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: rgba(31, 41, 55, 0.55);
            border: 1px solid #4b5563;
            position: absolute;
            left: 0;
            bottom: 0;
            pointer-events: none;
            touch-action: none;
        }

        #joy-thumb {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.85);
            border: 1px solid #93c5fd;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .pad-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            pointer-events: all;
            /* joy-base/joy-zone больше не в потоке flex (position:absolute),
               поэтому место под них резервируем отступом вручную: 112px
               (диаметр) + 14px (тот же gap, что был у #mobile-pad раньше) */
            margin-left: 126px;
        }

        .pad-btn {
            width: 52px;
            height: 52px;
            background: rgba(31, 41, 55, 0.85);
            border: 1px solid #4b5563;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .pad-btn.active {
            background: rgba(59, 130, 246, 0.7)
        }
    </style>
</head>

<body>

                data-i18n="tb_new">🆕 New</span></button>

                data-i18n="tb_open">📂 Open</span></button>
        <button class="green" onclick="saveFile()" data-i18n-title="tb_save_title" title="Save (Ctrl+S)"><span
                data-i18n="tb_save">💾 Save</span></button>

        // Language auto-detection: browser language first (navigator.languages,
        // falling back to navigator.language), with an optional manual override
        // saved in localStorage (e.g. localStorage.setItem('rbxstudio-lang','ru')).
        // Unknown languages fall back to English.
        function detectLang() {
            try {
                const saved = localStorage.getItem('rbxstudio-lang');
                if (saved && I18N[saved]) return saved;
            } catch (e) { }
            const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
            for (const l of langs) {
                const short = (l || '').slice(0, 2).toLowerCase();
                if (I18N[short]) return short;
            }
            return 'en';
        }
        const LANG = detectLang();

        function t(key, vars) {
            let s = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : (I18N.en[key] != null ? I18N.en[key] : key);
            if (vars) {
                for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
            }
            return s;
        }

        function applyStaticI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.getAttribute('data-i18n-title')); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
            document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
            document.documentElement.lang = LANG;
            const langBtn = document.getElementById('lang-btn');
            if (langBtn) {
                // Кнопка показывает язык, НА КОТОРЫЙ переключит (не текущий) —
                // так интуитивнее, как переключатели языка в большинстве приложений.
                langBtn.textContent = LANG === 'ru' ? '🌐 EN' : '🌐 RU';
            }
        }
        applyStaticI18n();

        // Простой переключатель между двумя языками (en/ru). Полноценная
        // смена без перезагрузки потребовала бы переписывать LANG (сейчас
        // const) и все места, читающие его напрямую (а не только через
        // t()) — вместо этого просто сохраняем выбор и перезагружаем
        // страницу, благо это разовое действие, а не то, что переключают
        // ежесекундно.
        function toggleLang() {
            const next = LANG === 'ru' ? 'en' : 'ru';
            try { localStorage.setItem('rbxstudio-lang', next); } catch (e) { }
            location.reload();
        }

    <script>
        // Three.js загрузка
        (function () {
            const scripts = [
                'vendor/three.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
            ];
            let loaded = false;
            function tryLoad(i) {
                if (i >= scripts.length) {
                    console.error('Three.js не загружен');
                    document.getElementById('fps-counter').textContent = '3D: ошибка';
                    return;
                }
                const s = document.createElement('script');
                s.src = scripts[i];
                s.onload = () => {
                    if (!loaded) {
                        loaded = true;
                        console.log('Three.js загружен из: ' + scripts[i]);
                        initThree();
                    }
                };
                s.onerror = () => {
                    console.warn('Не удалось загрузить: ' + scripts[i]);
                    tryLoad(i + 1);
                };
                document.head.appendChild(s);
            }
            tryLoad(0);
        })();

        // OBJLoader/MTLLoader грузятся ЛЕНИВО, только когда реально нужен
        // импорт модели — не тормозят обычный старт редактора. r128-совместимые
        // UMD-версии (не ES-модули), вешают THREE.OBJLoader/THREE.MTLLoader
        // на уже загруженный глобальный THREE.
        let _objMtlLoadersPromise = null;
        function ensureObjMtlLoaders() {
            if (_objMtlLoadersPromise) return _objMtlLoadersPromise;
            _objMtlLoadersPromise = new Promise((resolve, reject) => {
                const pairs = [
                    ['vendor/MTLLoader.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js'],
                    ['vendor/OBJLoader.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js'],
                ];
                let remaining = pairs.length;
                pairs.forEach(([local, cdn]) => {
                    const s = document.createElement('script');
                    s.src = local;
                    s.onload = () => { if (--remaining === 0) resolve(); };
                    s.onerror = () => {
                        const fb = document.createElement('script');
                        fb.src = cdn;
                        fb.onload = () => { if (--remaining === 0) resolve(); };
                        fb.onerror = () => reject(new Error('Не удалось загрузить ' + cdn));
                        document.head.appendChild(fb);
                    };
                    document.head.appendChild(s);
                });
            });
            return _objMtlLoadersPromise;
        }
    </script>

    <script>
        // ============ ANDROID (SAF) ============
        // Если приложение открыто внутри Android-обёртки, MainActivity.kt
        // добавляет window.AndroidBridge через addJavascriptInterface —
        // используем это как признак "мы в APK, обычной файловой системы
        // с произвольным доступом нет, нужен системный пикер (SAF)".
        const IS_ANDROID = typeof window.AndroidBridge !== 'undefined';

        // Цвет неба (фон сцены + туман) — единая константа, чтобы оба места
        // (initThreeJS при старте и setQuality при переключении пресета)
        // не могли разъехаться в разные оттенки.
        const SKY_COLOR = 0x87ceeb;

        // ============ CODEMIRROR ============
        // ВАЖНО: это не отдельный кусок — весь код игры (включая регистрацию
        // window.addEventListener('DOMContentLoaded', ...) в самом низу файла,
        // откуда вызывается initResizers()) находится в ОДНОМ и том же
        // непрерывном <script>-блоке. Раньше CodeMirror.fromTextArea(...)
        // вызывался БЕЗ try/catch: если vendor/codemirror.min.js по какой-то
        // причине не подгрузился (нет сети при первом запуске без setup.sh,
        // файл не докачался, и т.п.), это исключение обрывало исполнение
        // ВСЕГО скрипта на этой строке — ни один function/let ниже неё
        // никогда не выполнялся, включая ту самую регистрацию
        // DOMContentLoaded. Отсюда одновременно и неработающий ресайзер
        // (initResizers() ни разу не вызывался), и нерабочие кнопки (их
        // onclick трогает let/const, объявленные ниже места обрыва — те
        // так и оставались неинициализированными). CodeMirror — это ТОЛЬКО
        // редактор скриптов; его отсутствие не должно ронять всё остальное
        // приложение.
        let cmEditor = null;
        try {
            cmEditor = CodeMirror.fromTextArea(document.getElementById('script-editor'), {
                mode: 'lua',
                theme: 'monokai',
                lineNumbers: true,
                autoCloseBrackets: true,
                matchBrackets: true,
                indentUnit: 4,
                tabSize: 4,
                indentWithTabs: false,
                lineWrapping: false,
                viewportMargin: 50
            });
        } catch (e) {
            console.error('CodeMirror не загрузился — редактор скриптов будет недоступен, остальное приложение работает как обычно:', e);
        }

        function refreshCM() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    if (cmEditor) cmEditor.refresh();
                });
            });
        }

        // ============ КАЧЕСТВО 3D ============
        const QUALITY_PRESETS = {
            low: {
                antialias: false,
                shadows: false,
                resolutionScale: 0.3,
                sphereSegments: 4,
                textures: false,
                helpers: false,
                ambientLight: 1.0,
                dirLight: 0.0,
                fog: true,
                skipSmallObjects: true,
                maxObjects: 1000,
                lodDistance: 50,
                renderDistance: 250,
                playBodies: 500, // потолок Play-объектов один на все пресеты — см. medium/high ниже
                // Раньше здесь была плотность веера лучей (rayGrid) —
                // весь подход на raycast-based стриминге снесён (см.
                // refreshStreamedGeometry): камера-направленные лучи
                // систематически давали "дыры" под неудобным углом и были
                // источником большинства багов последних правок. Теперь
                // подгрузка — chunk-based, как в Minecraft/UE5 World
                // Partition: просто радиус вокруг ИГРОКА, направление
                // взгляда вообще не участвует. loadRadius — студов вокруг
                // игрока, в пределах которых объекты гарантированно
                // подгружены (физика), независимо от того, куда смотрит
                // камера.
                loadRadius: 350,
                // Раньше физика (playBodies) и рендер были одним и тем же
                // потолком: раз бюджет физ-тел исчерпан, объект не грузился
                // вообще, даже просто как картинка. Это и создавало "дыры" —
                // дальняя стена в кадре, до которой физически не дойти в
                // ближайшие секунды, соревновалась за тот же лимит с
                // объектами под ногами. Меш без CANNON.Body — это просто
                // геометрия на GPU, физику каждый кадр не считает, поэтому
                // может позволить себе МНОГО больше, чем playBodies.
                //

    const resizers = document.querySelectorAll('.resizer');

    // === Вертикальные ресайзеры (мышь) ===

        resizer.addEventListener('mousedown', (e) => {

            document.body.style.userSelect = 'none';
        });

    // === Горизонтальный ресайзер (мышь) ===

    if (hResizer) {

            document.body.style.cursor = 'row-resize';

        document.addEventListener('mousemove', (e) => {

        document.addEventListener('mouseup', () => {
            if (hResizer.classList.contains('active')) {

                    localStorage.setItem('rbxstudio-bottom-height', document.getElementById('bottom-panel').offsetHeight);

        // === Горизонтальный ресайзер (touch) ===

            hResizer.classList.add('active');
            startY = e.touches[0].clientY;
            startHeight = document.getElementById('bottom-panel').offsetHeight;

        document.addEventListener('touchmove', (e) => {
            if (!hResizer.classList.contains('active')) return;

        function initJoystick() {
            const zone = document.getElementById('joy-zone');
            const base = document.getElementById('joy-base');
            const thumb = document.getElementById('joy-thumb');
            if (!zone || !base || !thumb) return;
            const maxR = 30;   // px, максимальный вылет ручки стика от центра base
            const deadZone = 6; // px — маленький дрожащий сдвиг пальца не должен давать ход
            let touchId = null;

            function setThumb(dx, dy) {
                thumb.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
            }

            // "Всплывающий" стик: на touchstart сам круг базы переезжает
            // туда, где реально коснулся палец (по вертикали — зона выше
            // круга специально высокая, ловит палец, куда бы он ни лёг),
            // а не требует от игрока попасть точно в фиксированные 112px.
            function placeBase(clientX, clientY) {
                const zr = zone.getBoundingClientRect();
                // база квадратная 112×112, центрируем её на пальце, но не
                // даём уехать за пределы зоны (иначе стик может вылезти
                // за экран или наехать на кнопки прыжка/спуска)
                const half = 56;
                let localCX = clientX - zr.left;
                let localCY = clientY - zr.top;
                localCX = Math.max(half, Math.min(zr.width - half, localCX));
                localCY = Math.max(half, Math.min(zr.height - half, localCY));
                base.style.left = (localCX - half) + 'px';
                base.style.bottom = (zr.height - localCY - half) + 'px';
            }

            function handleMove(clientX, clientY) {
                const rect = base.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = clientX - cx;
                let dy = clientY - cy;
                const dist = Math.hypot(dx, dy);
                if (dist < deadZone) {
                    setThumb(0, 0);
                    joyVector.x = 0;
                    joyVector.y = 0;
                    return;
                }
                if (dist > maxR) {
                    dx = dx / dist * maxR;
                    dy = dy / dist * maxR;
                }
                setThumb(dx, dy);
                joyVector.x = dx / maxR;
                joyVector.y = -dy / maxR; // тянем вверх по экрану — едем вперёд
            }

            function resetJoy() {
                touchId = null;
                joyVector.x = 0;
                joyVector.y = 0;
                setThumb(0, 0);
                // возвращаем базу в исходный угол зоны для следующего касания
                base.style.left = '0px';
                base.style.bottom = '0px';
            }

            zone.addEventListener('touchstart', e => {
                e.preventDefault();
                e.stopPropagation();
                const t = e.changedTouches[0];
                touchId = t.identifier;
                placeBase(t.clientX, t.clientY);
                handleMove(t.clientX, t.clientY);
            }, { passive: false });

            zone.addEventListener('touchmove', e => {
                e.preventDefault();
                e.stopPropagation();
                for (const t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        handleMove(t.clientX, t.clientY);
                        break;
                    }
                }
            }, { passive: false });

            ['touchend', 'touchcancel'].forEach(ev => zone.addEventListener(ev, e => {
                for (const t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        resetJoy();
                        break;
                    }
                }
            }));
        }

        function updateHelpers() {
            if (window._gridHelper) {
                scene.remove(window._gridHelper);

                window._axesHelper = new THREE.AxesHelper(5);
                scene.add(window._gridHelper);
                scene.add(window._axesHelper);
            }
        }
