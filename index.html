        async function doDownloadAvatar3d(mode) {
            const userId = (document.getElementById('av-uid').value || '').trim();
            if (!/^[0-9]+$/.test(userId)) {
                notify(t('avatar_enter_uid'), 'err');
                return;
            }

            _avatar3dCancelled = false;
            _avatar3dAbort = new AbortController();
            const signal = _avatar3dAbort.signal;

            const steps = mode === 'import'
                ? ['Запрашиваю статус модели у Roblox', 'Жду, пока Roblox сгенерирует модель', 'Скачиваю obj/mtl/текстуры', 'Добавляю на сцену']
                : ['Запрашиваю статус модели у Roblox', 'Жду, пока Roblox сгенерирует модель', 'Скачиваю obj/mtl/текстуры', 'Выберите, куда сохранить'];
            let step = 0;
            showModal(_avatarProgressHtml(steps, step));

            const maxWaitMs = 120000;
            const pollEveryMs = 1500;
            const startedAt = Date.now();
            let bundleUrl = null;
            let sawGenerating = false;

            while (Date.now() - startedAt < maxWaitMs) {
                if (_avatar3dCancelled) return;
                let st;
                try {
                    st = await _apiAbortable('/api/roblox/avatar3d/status?userId=' + encodeURIComponent(userId), signal);
                } catch (e) {
                    if (_avatar3dCancelled || e.name === 'AbortError') return;
                    showModal(_avatarProgressHtml(steps, step, 'Сеть/сервер: ' + (e && e.message || e)));
                    return;
                }
                if (!st.ok) {
                    showModal(_avatarProgressHtml(steps, step, st.message || st.error || 'Не удалось запросить статус'));
                    return;
                }
                if (st.ready) {
                    bundleUrl = st.bundleUrl;
                    break;
                }
                if (st.state === 'Error') {
                    showModal(_avatarProgressHtml(steps, step, 'Roblox не смог сгенерировать модель для этого User ID'));
                    return;
                }
                if (!sawGenerating) {
                    sawGenerating = true;
                    step = 1;
                    showModal(_avatarProgressHtml(steps, step));
                }
                await new Promise(res => setTimeout(res, pollEveryMs));
            }

            if (_avatar3dCancelled) return;

            if (!bundleUrl) {
                showModal(_avatarProgressHtml(steps, step, 'Roblox слишком долго готовит модель — попробуйте ещё раз чуть позже'));
                return;
            }

            step = 2;
            showModal(_avatarProgressHtml(steps, step));

            // savePath: на Android — приватная папка приложения (для SAF-
            // экспорта нужен реальный путь на диске), на десктопе — рядом
            // с самим app.py. Сервер всегда пишет .zip независимо от mode
            // (дёшево и на будущее пригодится), а для mode='import'
            // дополнительно просим includeAssets=1 — тогда в ответе сразу
            // приходят готовые для three.js текст OBJ/MTL и текстуры,
            // без повторного похода на сервер.
            const dataDir = (typeof IS_ANDROID !== 'undefined' && IS_ANDROID)
                ? window.AndroidBridge.getDataDir() : '.';

            let fetchUrl = '/api/roblox/avatar3d/fetch?bundleUrl=' + encodeURIComponent(bundleUrl) +
                '&userId=' + encodeURIComponent(userId) +
                '&savePath=' + encodeURIComponent(dataDir);
            if (mode === 'import') fetchUrl += '&includeAssets=1';

            let r;
            try {
                r = await _apiAbortable(fetchUrl, signal);
            } catch (e) {
                if (_avatar3dCancelled || e.name === 'AbortError') return;
                showModal(_avatarProgressHtml(steps, step, 'Ошибка скачивания: ' + (e && e.message || e)));
                return;
            }
            if (_avatar3dCancelled) return;
            if (!r.ok) {
                showModal(_avatarProgressHtml(steps, step, r.message || r.error || 'Не удалось скачать файлы'));
                return;
            }

            step = 3;
            showModal(_avatarProgressHtml(steps, step));

            if (mode === 'import') {
                try {
                    await importAvatarIntoScene(r.obj_text, r.mtl_text, r.textures, userId);
                } catch (e) {
                    showModal(_avatarProgressHtml(steps, step, 'Не удалось импортировать: ' + (e && e.message || e)));
                    return;
                }
                closeModal();
                notify(t('avatar_added_to_scene'));
                return;
            }

            if (!IS_ANDROID) {
                showModal(_avatarProgressHtml(steps, step, 'Сохранение .zip доступно только в Android-приложении (в десктоп-режиме файл уже записан рядом с app.py: ' + r.zipPath + ')'));
                return;
            }
            // Тот же поток, что уже работает для сохранения .rbxl:
            // Kotlin откроет системный диалог "Сохранить как", скопирует
            // zip по выбранному пользователем месту и вызовет
            // window.onAndroidFileExported(ok).
            window.AndroidBridge.exportRbxlFile(r.zipPath, r.zipName);
        }

        // Загружает OBJ+MTL+текстуры (уже скачанные с сервера как текст/
        // data URL) в текущую three.js сцену редактора как обычный объект.
        // Текстуры подставляются через LoadingManager.setURLModifier —
        // MTLLoader пытается идти в сеть за файлами по имени, а мы вместо
        // этого подсовываем уже готовые data: URL.
        async function importAvatarIntoScene(objText, mtlText, textures, userId) {
            await ensureObjMtlLoaders();

            // КРИТИЧНЫЙ ФИКС: Roblox отдаёт НЕстандартный .obj — строки вершин
            // выглядят как "v x y z r g b a" (координаты + RGBA-цвет прямо в
            // одной строке), а не "v x y z", как ждёт обычный формат
            // Wavefront OBJ. THREE.OBJLoader понимает только 3 (или 6 с
            // цветом без альфы) числа после "v" — лишние токены ломают
            // парсинг геометрии, из-за чего меш получался пустым/битым и
            // визуально ничего не появлялось на сцене. Отрезаем всё
            // лишнее, оставляя только x y z.
            const fixedObjText = objText.replace(
                /^v(\s+-?[\d.eE+-]+\s+-?[\d.eE+-]+\s+-?[\d.eE+-]+)(?:\s+-?[\d.eE+-]+)*\s*$/gm,
                'v$1'
            );

            const texByName = {};
            (textures || []).forEach(t => { texByName[t.name] = t.data_url; });

            const manager = new THREE.LoadingManager();
            manager.setURLModifier((url) => {
                const clean = url.split('/').pop();
                return texByName[clean] || url;
            });

            // ФИКС ПРОЗРАЧНОСТИ: THREE.MTLLoader (r128) трактует тег "Tr"
            // (transparency, 1 = полностью прозрачно) БЕЗ инверсии, как
            // если бы это было "d" (dissolve, 1 = непрозрачно) — это
            // старый баг лоадера. Roblox иногда пишет в .mtl именно "Tr",
            // из-за чего материалы получают заниженный opacity и весь
            // аватар выглядит полупрозрачным ("призрачным"). invertTrProperty
            // чинит семантику, а принудительный сброс ниже — подстраховка
            // на случай других полей (d/Tr с "мусорными" значениями),
            // потому что реальной художественной прозрачности у Roblox-
            // аватара (кроме альфы в текстурах ресниц/волос) быть не должно.
            const mtlLoader = new THREE.MTLLoader(manager);
            mtlLoader.setMaterialOptions({ invertTrProperty: true });
            const materials = mtlLoader.parse(mtlText, '');
            materials.preload();
            // ФИКС КАЧЕСТВА 1/2: MTLLoader по умолчанию делает материалы
            // однослойными (FrontSide) — при неправильном порядке вершин
            // в части полигонов (частый случай у сгенерированных Roblox
            // мешей) это вырезает грани и модель выглядит "дырявой"/
            // некачественной. DoubleSide рендерит обе стороны, дешёво и
            // без побочных эффектов на статичной модели вроде аватара.
            for (const key in materials.materials) {
                const m = materials.materials[key];
                m.side = THREE.DoubleSide;
                // Принудительно делаем непрозрачным: ошибочно распарсенный
                // d/Tr — самая частая причина "полупрозрачного" аватара.
                m.transparent = false;
                m.opacity = 1;
                m.alphaTest = 0;
                m.needsUpdate = true;
            }

            const objLoader = new THREE.OBJLoader(manager);
            objLoader.setMaterials(materials);
            const object = objLoader.parse(fixedObjText);

            // ФИКС КАЧЕСТВА 2/2: текстуры из data: URL по умолчанию
            // трактуются как линейные, из-за чего цвета выглядят блёкло/
            // серо по сравнению с оригиналом в Roblox — sRGB-кодирование
            // возвращает нормальную насыщенность. sRGBEncoding — API
            // three.js r128 (в новых версиях библиотеки заменено на
            // colorSpace, но здесь используется именно r128).
            object.traverse(n => {
                if (n.isMesh) {
                    n.castShadow = true;
                    n.receiveShadow = true;
                    // ФИКС "ГРАНЁНОГО" ВИДА: Roblox почти всегда не кладёт
                    // вершинные нормали (vn) в этот .obj — OBJLoader в таком
                    // случае считает нормали по каждой грани отдельно (flat
                    // shading), из-за чего низкополигональная модель
                    // выглядит ещё грубее, чем есть на самом деле — видны
                    // резкие "фасеты" вместо плавных переходов. Полигонов
                    // это не добавляет (их больше в источнике не взять —
                    // ограничение самого Roblox avatar-3d API), но
                    // computeVertexNormals() усредняет нормали между
                    // смежными гранями и свет ложится плавно (smooth
                    // shading), визуально маскируя низкий poly count.
                    if (n.geometry) n.geometry.computeVertexNormals();
                    const mats = Array.isArray(n.material) ? n.material : [n.material];
                    mats.forEach(m => {
                        if (m && m.map) {
                            m.map.encoding = THREE.sRGBEncoding;
                            // ФИКС ЗЕРНИСТОСТИ ТЕКСТУР НА ТЕЛЕФОНЕ: без
                            // анизотропной фильтрации текстуры кожи/одежды
                            // "шумят" и теряют детали под углом к камере —
                            // на высокоплотном экране телефона это заметнее,
                            // чем на мониторе ПК. getMaxAnisotropy() отдаёт
                            // максимум, который поддерживает GPU устройства.
                            m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                            m.map.needsUpdate = true;
                        }
                    });
                }
            });

            let vertCount = 0;
            object.traverse(n => { if (n.isMesh && n.geometry && n.geometry.attributes.position) vertCount += n.geometry.attributes.position.count; });
            if (vertCount === 0) {
                throw new Error('Модель распарсилась, но геометрия пустая (0 вершин) — формат OBJ мог измениться на стороне Roblox');
            }

            object.name = 'RobloxAvatar_' + userId;

            if (!(typeof scene !== 'undefined' && scene)) {
                throw new Error('3D-сцена ещё не готова, попробуйте через секунду');
            }
            scene.add(object);

            // ВАЖНО: координаты вершин в OBJ от Roblox абсолютные — они
            // привязаны к позиции персонажа в игровом мире (часто Y~100 и
            // выше), а не к (0,0,0). Простой сдвиг object.position НЕ
            // компенсирует это — сдвигается только точка опоры (pivot),
            // а сама геометрия остаётся там же относительно неё. Поэтому
            // сначала считаем bounding box и центрируем через него.
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());

            let targetPos = new THREE.Vector3(0, 0, 0);
            if (typeof camera !== 'undefined' && camera) {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                targetPos.copy(camera.position).add(dir.multiplyScalar(15));
            }
            object.position.copy(targetPos).sub(center);

            // Сохраняем смещение центра, чтобы использовать при reloadScene
            const centerOffset = center.clone();

            // Чтобы аватар появился в Explorer, был выбираемым/удаляемым
            // как обычный объект и не пропадал при следующем reloadScene()
            // (его вызывает даже поворот камеры) — заводим для него
            // настоящий Instance на сервере (Model в дереве), а саму
            // геометрию (которую сервер не умеет описывать в формате
            // Part/MeshPart) держим в клиентском кэше и переиспользуем
            // при каждой пересборке сцены вместо обычного построения меша
            // из свойств инстанса. См. правку в reloadScene().
            let ref = null;
            if (typeof api === 'function') {
                const findWs = ns => {
                    for (const n of ns) {
                        if (n.cls === 'Workspace') return n.ref;
                        const c = findWs(n.children);
                        if (c !== null) return c;
                    }
                    return null;
                };
                const parent = findWs(treeData) ?? -1;
                const r = await api('PUT', '/api/instance', {
                    class: 'Part',
                    name: object.name,
                    parent: parent,
                });
                if (r.ok) {
                    ref = r.ref;
                } else {
                    // ВАЖНО: PUT /api/instance молча возвращает {ok:false},
                    // если на сервере нет открытого файла (state['parsed']
                    // is None — открывается только через "Открыть проект"
                    // или аргументом командной строки при запуске app.py).
                    // Модель при этом всё равно появляется в вьюпорте, т.к.
                    // scene.add(object) чуть выше — чисто клиентский код,
                    // серверу не нужен. Раньше эта ошибка проглатывалась
                    // молча (ref просто оставался null) — снаружи выглядело
                    // так, будто аватар "не показывается в Explorer" без
                    // единой подсказки почему. Бросаем понятную ошибку:
                    // doDownloadAvatar3d() уже оборачивает вызов в try/catch
                    // и покажет её в модалке вместо ложного "успеха".
                    throw new Error(
                        'Модель добавлена только в вьюпорт (визуально), но НЕ ' +
                        'сохранена как объект сцены: нет открытого проекта ' +
                        '(.rbxl/.rbxlx). Откройте или создайте файл проекта, ' +
                        'затем импортируйте аватар заново.'
                    );
                }
                if (ref !== null) {
                    // КРИТИЧНЫЙ ФИКС #2: /api/scene на сервере (make_scene_objects)
                    // читает позицию ИСКЛЮЧИТЕЛЬНО из свойства CFrame — Position
                    // читается первым, но сразу же перезаписывается значением из
                    // CFrame (px, py, pz = get_pos(cf)). Если CFrame не задан,
                    // get_pos() возвращает (0,0,0), и объект всё равно вылетает
                    // за радиус видимости камеры, несмотря на записанный Position.
                    // Пишем CFrame в формате 3x4 row-major матрицы, который ждут
                    // get_pos()/get_rot_matrix() на сервере: [r00,r01,r02,px,
                    // r10,r11,r12,py, r20,r21,r22,pz]. Вращение — единичное,
                    // т.к. геометрия аватара уже "запечена" в мировых координатах
                    // самого меша (см. центрирование через bounding box выше).
                    const p = object.position;
                    const size = box.getSize(new THREE.Vector3());
                    // Формат CFrame, который реально понимает сервер (см.
                    // get_pos()/get_rot_matrix() в app.py и разбор в
                    // rbxl_parser.py): { position: {x,y,z}, matrix: [9
                    // чисел поворота] } — координаты ОТДЕЛЬНО от матрицы
                    // поворота. Предыдущая версия фикса клала перевод
                    // внутрь 12-элементной матрицы (r,r,r,tx,...) — но
                    // get_pos() сначала проверяет cf.get('position', {}),
                    // а дефолт {} — это тоже dict, поэтому ветка с matrix
                    // никогда не выполнялась и позиция всегда читалась
                    // как (0,0,0), несмотря на записанный CFrame.
                    await api('POST', '/api/instance/' + ref, {
                        prop: 'CFrame',
                        value: {
                            position: { x: p.x, y: p.y, z: p.z },
                            matrix: [1, 0, 0, 0, 1, 0, 0, 0, 1],
                        },
                    });
                    await api('POST', '/api/instance/' + ref, {
                        prop: 'Position',
                        value: { x: p.x, y: p.y, z: p.z },
                    });
                    await api('POST', '/api/instance/' + ref, {
                        prop: 'Size',
                        value: { x: size.x || 1, y: size.y || 1, z: size.z || 1 },
                    });
                    await api('POST', '/api/instance/' + ref, { prop: 'Anchored', value: true });
                }
            }
            if (ref !== null) {
                // Без userData.ref луч в pick() не может определить, какому
                // Instance принадлежит эта Group — клик по аватару в сцене
                // никогда не выбирал его.
                object.userData.ref = ref;
                window._avatarMeshCache = window._avatarMeshCache || {};
                window._avatarMeshCache[ref] = { object, centerOffset: centerOffset };
                sceneObjs[ref] = object;
                await loadTree();
            }

            // Рендер-цикл приложения не всегда рисует каждый кадр по
            // условию (throttling) — принудительно рисуем один кадр сразу,
            // чтобы объект стал виден немедленно, а не только после
            // следующего взаимодействия с камерой.
            if (typeof renderer !== 'undefined' && renderer && typeof camera !== 'undefined') {
                try { renderer.render(scene, camera); } catch (e) { }
            }

            return { vertCount, ref };
        }

        // Тот же колбэк уже используется для сохранения .rbxl — здесь
        // просто закрываем прогресс-модалку аватара, если она открыта.
        const _prevOnAndroidFileExported = window.onAndroidFileExported;
        window.onAndroidFileExported = function (ok) {
            if (_prevOnAndroidFileExported) _prevOnAndroidFileExported(ok);
            const overlay = document.getElementById('modal-overlay');
            if (overlay && overlay.classList.contains('show')) {
                closeModal();
            }
            notify(ok ? t('avatar_saved') : t('avatar_save_cancelled'), ok ? undefined : 'err');
        };

        function showModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-overlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        // ============ КЛАВИШИ ============
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' ||
                e.target.classList.contains('CodeMirror') || e.target.closest('.CodeMirror')) {
                return;
            }

            keysPressed[e.key.toLowerCase()] = true;

            if (isPlaying && (e.key === ' ' || e.key.toLowerCase() === 'e')) {
                e.preventDefault();
                jumpQueued = true;
            }

            if (e.ctrlKey && e.key === 'o') {
                e.preventDefault();
                openFileBrowser('open');
            } else if (e.ctrlKey && e.shiftKey && e.key === 'S') {
                e.preventDefault();
                openFileBrowser('save');
            } else if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveFile();
            } else if (e.key === 'Delete') {
                deleteSelected();
            } else if (e.key === 'Escape') {
                closeModal();
                deselect();
            } else if (e.key === 'F5') {
                e.preventDefault();
                reloadScene();
            } else if (e.key === 'f' && !e.ctrlKey) {
                if (selectedRef && sceneObjs[selectedRef]) {
                    const p = sceneObjs[selectedRef].position;
                    target = { x: p.x, y: p.y, z: p.z };
                    updateCamera();
                    notify(t('notify_focus'));
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keysPressed[e.key.toLowerCase()] = false;
        });

        document.getElementById('modal-overlay').onclick = e => {
            if (e.target.id === 'modal-overlay') closeModal();
        };

        // ============ ИНИЦИАЛИЗАЦИЯ ============
        window.addEventListener('DOMContentLoaded', () => {
            loadLayout();
            initResizers();
            
            refreshCM();
        });

        window.addEventListener('resize', refreshCM);
    </script>
</body>

</html>
