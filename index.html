            for (const w of ready) resumeLuaCoroutine(w.co, 'script', 0);
        }

        // TweenService:Create(...):Play() — раньше TweenService не
        // существовал вообще (виртуальный пустой сервис), а используется
        // массово: анимация очков в Main.lua, уведомления в
        // SettingsMenuScript, блюр/фейд в AgeWarningModule. Настоящей
        // покадровой интерполяции для ЧИСЛОВЫХ свойств (Transparency,
        // BackgroundTransparency и т.п.) — линейной, без имитации
        // конкретных EasingStyle (Quad/Back/...) — этого достаточно, чтобы
        // хоть что-то плавно двигалось, вместо мгновенного "телепорта" или
        // падения скрипта. Составные свойства (Color3/UDim2) — честно не
        // анимируются, просто применяются в момент завершения (см.
        // __tween_register) — то же ограничение, что и у Color3/UDim2
        // через мост в принципе (см. коммент у __set_prop).
        function updateTweens() {
            if (!activeTweens.length) return;
            const now = performance.now();
            const stillActive = [];
            for (const t of activeTweens) {
                const elapsed = (now - t.startTime) / 1000;
                const p = t.duration > 0 ? Math.min(1, elapsed / t.duration) : 1;
                if (t.cframe) {
                    const x = t.fromPos.x + (t.toPos.x - t.fromPos.x) * p;
                    const y = t.fromPos.y + (t.toPos.y - t.fromPos.y) * p;
                    const z = t.fromPos.z + (t.toPos.z - t.fromPos.z) * p;
                    let lx = t.fromLook.x + (t.toLook.x - t.fromLook.x) * p;
                    let ly = t.fromLook.y + (t.toLook.y - t.fromLook.y) * p;
                    let lz = t.fromLook.z + (t.toLook.z - t.fromLook.z) * p;
                    const llen = Math.hypot(lx, ly, lz) || 1;
                    applyCFrameValue(t.ref, x, y, z, lx / llen, ly / llen, lz / llen);
                    if (p >= 1) fireLuaSignal(t.completedRef, 'Event', []);
                    else stillActive.push(t);
                    continue;
                }
                if (t.composite) {
                    if (p >= 1) {
                        luaSetGenericProp(t.ref, t.propName, t.to);
                        fireLuaSignal(t.completedRef, 'Event', []);
                    } else {
                        stillActive.push(t);
                    }
                    continue;
                }
                const v = t.from + (t.to - t.from) * p;
                luaSetGenericProp(t.ref, t.propName, v);
                if (p >= 1) fireLuaSignal(t.completedRef, 'Event', []);
                else stillActive.push(t);
            }
            activeTweens = stillActive;
        }

        // UserInputService.InputBegan/InputChanged/InputEnded — глобальные
        // (в отличие от per-GuiObject InputBegan/InputEnded в
        // guiCreateDomNode): слушаем весь document, а не конкретный
        // элемент — иначе перетаскивание слайдера (см. SettingsMenuScript)
        // обрывалось бы, стоит увести курсор за пределы SliderBg. Сервис
        // ленивый (как и все остальные, см. getService) — если скрипт ещё
        // не спросил UserInputService, просто ничего не шлём.
        document.addEventListener('mousedown', (e) => {
            if (!luaServerL && !luaClientL) return;
            const ref = luaFindServiceRef('UserInputService');
            if (ref !== -1) fireLuaSignal(ref, 'InputBegan', [domInputTypeName(e, false), ...domInputXY(e)]);
        });
        document.addEventListener('mousemove', (e) => {
            if (!luaServerL && !luaClientL) return;
            const ref = luaFindServiceRef('UserInputService');
            if (ref !== -1) fireLuaSignal(ref, 'InputChanged', [domInputTypeName(e, true), ...domInputXY(e)]);
        });
        document.addEventListener('mouseup', (e) => {
            if (!luaServerL && !luaClientL) return;
            const ref = luaFindServiceRef('UserInputService');
            if (ref !== -1) fireLuaSignal(ref, 'InputEnded', [domInputTypeName(e, false), ...domInputXY(e)]);
        });
        // Тач-эквиваленты — раньше их не было вовсе, только мышиные. На
        // телефоне простой тап браузер ещё синтезирует как mousedown/
        // mouseup/click (поэтому кнопки вроде "Играть" и так работали),
        // но при РЕАЛЬНОМ перетаскивании (палец сдвинулся) синтетических
        // mousemove в процессе жеста не будет вообще — только один (если
        // вообще) в самом конце. Слайдер громкости в SettingsMenuScript
        // (sliderBg.InputBegan + UserInputService.InputChanged, см. код
        // самой игры) из-за этого не мог отследить движение пальца.
        // Passive (без preventDefault) — чтобы не ломать нативный touch-
        // scroll ScrollingFrame (список песен) тем же самым обработчиком.
        document.addEventListener('touchstart', (e) => {
            if (!luaServerL && !luaClientL) return;
            const ref = luaFindServiceRef('UserInputService');
            if (ref !== -1) fireLuaSignal(ref, 'InputBegan', [domInputTypeName(e, false), ...domInputXY(e)]);
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            if (!luaServerL && !luaClientL) return;
            const ref = luaFindServiceRef('UserInputService');
            if (ref !== -1) fireLuaSignal(ref, 'InputChanged', [domInputTypeName(e, true), ...domInputXY(e)]);
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            if (!luaServerL && !luaClientL) return;
            const ref = luaFindServiceRef('UserInputService');
            if (ref !== -1) fireLuaSignal(ref, 'InputEnded', [domInputTypeName(e, false), ...domInputXY(e)]);
        }, { passive: true });

        // RunService.Stepped/Heartbeat/RenderStepped — настоящий, не
        // заглушечный тик каждый кадр, если хоть один скрипт уже успел
        // обратиться к game:GetService("RunService") (иначе искать нечего —
        // сервис ленивый, как и все остальные, см. getService в LUA_PRELUDE).
        let lastRunServiceTick = null;
        function updateRunServiceSignals() {
            const ref = luaFindServiceRef('RunService');
            if (ref === -1) return;
            const now = performance.now() / 1000;
            const dt = lastRunServiceTick === null ? 0 : now - lastRunServiceTick;
            lastRunServiceTick = now;
            fireLuaSignal(ref, 'Heartbeat', [dt]);
            fireLuaSignal(ref, 'Stepped', [now, dt]);
            fireLuaSignal(ref, 'RenderStepped', [dt]);
        }

        function buildCannonShape(mesh) {
            const shapeName = mesh.userData.shape;
            const sx = mesh.userData.sx || 1, sy = mesh.userData.sy || 1, sz = mesh.userData.sz || 1;
            // Реальные тонкие плиты пола (трава, базплейты и т.п.) толщиной
            // <1 стада — на них cannon.js без CCD регулярно "проваливает"
            // сферу персонажа: за один сабстеп контакт просто не успевает
            // сгенерироваться. Форму для физики утолщаем до безопасного
            // минимума, сам меш (визуал) остаётся тонким как в файле.
            const MIN_COLLIDER_THICKNESS = 1.0;
            switch (shapeName) {
                case 'sphere': {
                    const r = Math.max(sx, sy, sz) * 0.5;
                    return new CANNON.Sphere(r);
                }
                case 'cylinder':
                    return new CANNON.Cylinder(sx * 0.5, sz * 0.5, Math.max(sy, MIN_COLLIDER_THICKNESS), 8);
                // Wedge/Cone у cannon.js нет готовой формы — приближаем боксом
                // по габаритам. Для точных скатов нужен ConvexPolyhedron.
                case 'wedge':
                case 'cone':
                case 'box':
                default:
                    return new CANNON.Box(new CANNON.Vec3(
                        Math.max(sx * 0.5, MIN_COLLIDER_THICKNESS * 0.5),
                        Math.max(sy * 0.5, MIN_COLLIDER_THICKNESS * 0.5),
                        Math.max(sz * 0.5, MIN_COLLIDER_THICKNESS * 0.5)
                    ));
            }
        }

        let charVelX = 0, charVelZ = 0; // последняя заданная игроком горизонтальная скорость
        // Устанавливается настоящим PlayerModule:GetControls():Disable()
        // (см. __set_controls_enabled в installLuaBridge) — например, FNF
        // делает так на время песни, чтобы играющий не увёл персонажа
        // WASD'ом и не сбил камеру мышью посреди ритм-игры. Раньше
        // PlayerModule не существовал вовсе, Disable() ничего не мог
        // отключить физически (см. пояснение в чате) — теперь честно
        // останавливает и ходьбу, и поворот камеры мышью/тачем.
        let luaControlsDisabled = false;

        function applyCharacterControl() {
            if (!charBody) return;
            charBody.wakeUp();

            const forward = luaControlsDisabled ? 0 : Math.max(-1, Math.min(1,
                (keysPressed['w'] ? 1 : 0) - (keysPressed['s'] ? 1 : 0) + joyVector.y));
            const strafe = luaControlsDisabled ? 0 : Math.max(-1, Math.min(1,
                (keysPressed['d'] ? 1 : 0) - (keysPressed['a'] ? 1 : 0) + joyVector.x));

            // Движение по горизонтали относительно направления взгляда камеры
            // (тангаж/phi игнорируем — как в Roblox, ходьба не зависит от
            // того, куда наклонена голова).
            //
            // Раньше бралось camera.getWorldDirection() с обнулением Y — это
            // вырождается в нулевой вектор, если посмотреть почти строго
            // вверх/вниз (на мобиле это легко смахнуть одним свайпом), и
            // персонаж переставал двигаться, хотя камера продолжала
            // крутиться нормально. theta не зависит от наклона вообще.
            const theta = spherical.theta;
            const fwdX = -Math.sin(theta), fwdZ = -Math.cos(theta);
            const rightX = Math.cos(theta), rightZ = -Math.sin(theta);

            let vx = fwdX * forward + rightX * strafe;
            let vz = fwdZ * forward + rightZ * strafe;
            const len = Math.hypot(vx, vz);
            let dirX = 0, dirZ = 0;
            if (len > 0.001) {
                dirX = vx / len; dirZ = vz / len;
                vx = dirX * CHAR_SPEED;
                vz = dirZ * CHAR_SPEED;
            } else {
                vx = 0; vz = 0;
            }

            // Ground-check лучом вниз — определяет, можно ли прыгнуть и
            // стоим ли мы вообще на земле (нужно и для авто-подъёма на
            // ступени ниже).
            const from = new CANNON.Vec3(charBody.position.x, charBody.position.y, charBody.position.z);
            const to = new CANNON.Vec3(charBody.position.x, charBody.position.y - CHAR_RADIUS - 0.6, charBody.position.z);
            const result = new CANNON.RaycastResult();
            physicsWorld.raycastClosest(from, to, { collisionFilterMask: 1, skipBackfaces: true }, result);
            canJump = result.hasHit;

            // Падаем и уже какое-то время не находим опору — скорее всего
            // физика под ногами ещё не подгрузилась (стриминг не успевает
            // за движением), а не что персонаж законно летит в пропасти.
            // Не ждём обычный троттлинг подгрузки — пробуем немедленно.
            if (!canJump && charBody.velocity.y < -5) {
                const now = performance.now();
                if (fallingSinceMs === null && !streamInFlight) {
                    fallingSinceMs = now;
                    refreshStreamedGeometry();
                } else if (fallingSinceMs !== null && now - fallingSinceMs > 200 && !streamInFlight) {
                    fallingSinceMs = now;
                    refreshStreamedGeometry();
                }
            } else {
                fallingSinceMs = null;
            }

            if (canJump && (dirX !== 0 || dirZ !== 0)) {
                tryStepUp(dirX, dirZ);
            }

            charVelX = vx;
            charVelZ = vz;
            charBody.velocity.x = vx;
            charBody.velocity.z = vz;

            if (jumpQueued && canJump) {
                charBody.velocity.y = JUMP_VELOCITY;
                canJump = false;
            }
            jumpQueued = false;
        }

        // Сфера плохо лезет по отдельным боксам-ступеням: цепляется за
        // ребро подступёнка, соскальзывает или проваливается в угол между
        // ступенями. Вместо того чтобы полагаться на физический контакт с
        // каждой ступенькой, определяем низкий бордюр впереди сами:
        // луч на уровне щиколотки что-то видит, а такой же луч на уровне
        // колена — уже нет (значит это ступенька, а не стена), и просто
        // приподнимаем персонажа, вместо того чтобы врезаться в неё.
        function tryStepUp(dirX, dirZ) {
            const checkDist = CHAR_RADIUS + 1.0;
            const footY = charBody.position.y - CHAR_RADIUS + 0.15;
            const kneeY = charBody.position.y - CHAR_RADIUS + STEP_HEIGHT;

            const footFrom = new CANNON.Vec3(charBody.position.x, footY, charBody.position.z);
            const footTo = new CANNON.Vec3(charBody.position.x + dirX * checkDist, footY, charBody.position.z + dirZ * checkDist);
            const footResult = new CANNON.RaycastResult();
            physicsWorld.raycastClosest(footFrom, footTo, { collisionFilterMask: 1, skipBackfaces: true }, footResult);
            if (!footResult.hasHit) return; // впереди на уровне ног пусто — ступенька не нужна

            const kneeFrom = new CANNON.Vec3(charBody.position.x, kneeY, charBody.position.z);
            const kneeTo = new CANNON.Vec3(charBody.position.x + dirX * checkDist, kneeY, charBody.position.z + dirZ * checkDist);
            const kneeResult = new CANNON.RaycastResult();
            physicsWorld.raycastClosest(kneeFrom, kneeTo, { collisionFilterMask: 1, skipBackfaces: true }, kneeResult);
            if (kneeResult.hasHit) return; // и выше препятствие — это стена, а не ступенька

            // Низкий порог впереди, сверху свободно — плавно поднимаем,
            // порциями по кадрам (а не телепортом), пока не окажемся над ним.
            charBody.position.y += 0.4;
            if (charBody.velocity.y < 0) charBody.velocity.y = 0;
        }

        // Enum.CameraType.Scriptable — настоящий Roblox по нему полностью
        // отдаёт камеру скрипту (никакого автослежения за персонажем).
        // Раньше этого понятия не существовало вообще: followCharacterCamera
        // вызывался каждый кадр безусловно и на каждом кадре стирал любую
        // позицию, которую только что выставил скрипт через camera.CFrame
        // (см. __set_prop/CFrame выше) — например, MenuCamera.lua ставит
        // именно CameraType.Scriptable перед тем, как двигать камеру по
        // точкам меню, и без этого флага её тут же отбрасывало обратно к
        // персонажу на следующем же кадре.
        let cameraIsScriptable = false;

        function followCharacterCamera() {
            if (!charBody || cameraIsScriptable) return;
            target.x = charBody.position.x;
            target.y = charBody.position.y + EYE_HEIGHT;
            target.z = charBody.position.z;
            if (charMesh) {
                charMesh.position.set(charBody.position.x, charBody.position.y, charBody.position.z);
                charMesh.rotation.y = spherical.theta; // куб развёрнут туда же, куда смотрит камера
            }
            updateCamera();
        }

        const PHYSICS_SUBSTEPS = 4; // дробим шаг — у cannon.js 0.6.2 нет CCD,
        // быстро падающая сфера может за один большой шаг проскочить сквозь
        // тонкий пол ("проваливаюсь"). Мельче шаг — меньше смещение за шаг.
        const MAX_FALL_SPEED = 300; // студов/сек — подстраховка на случай
        // разгона до нереальной скорости (например, пока не подгрузился пол).

        function stepPhysics() {
            if (!isPlaying || !physicsWorld) return;
            applyCharacterControl();

            if (charBody && charBody.velocity.y < -MAX_FALL_SPEED) {
                charBody.velocity.y = -MAX_FALL_SPEED;
            }

            const subDt = (1 / 60) / PHYSICS_SUBSTEPS;
            for (let i = 0; i < PHYSICS_SUBSTEPS; i++) {
                physicsWorld.step(subDt);
                // Ступеньки лестницы — это отдельные боксы с вертикальными
                // "порожками": во время решения контактов гравитация тянет
                // персонажа вдоль уклона, и это накапливалось из кадра в
                // кадр — отсюда съезжание с лестниц. Переустанавливаем
                // ГОРИЗОНТАЛЬНУЮ скорость после каждого подшага на то, что
                // реально задал игрок — Y (гравитация/прыжок) не трогаем.
                if (charBody) {
                    charBody.velocity.x = charVelX;
                    charBody.velocity.z = charVelZ;
                }
            }

            for (const [refStr, body] of Object.entries(physicsBodies)) {
                const mesh = sceneObjs[refStr];
                if (!mesh) continue;
                mesh.matrix.compose(
                    new THREE.Vector3(body.position.x, body.position.y, body.position.z),
                    new THREE.Quaternion(body.quaternion.x, body.quaternion.y, body.quaternion.z, body.quaternion.w),
                    new THREE.Vector3(1, 1, 1)
                );
            }
            followCharacterCamera();
            maybeStreamGeometry();
            updateLuaScheduler();
        }

        // ============ ДЕРЕВО ============
        async function loadTree() {
            const r = await api('GET', '/api/tree');
            if (!r.ok) return;
            treeData = r.tree;
            for (const n of treeData) {
                expanded.add(n.ref);
            }
            rebuildTreeIndex();
            renderTree();
            reloadScene();
        }

        // ref -> node и ref -> parentRef — плоские индексы поверх вложенного
        // treeData, чтобы Lua-мост (см. блок LUA ниже) мог искать
        // Parent/GetChildren/FindFirstChild за O(1), а не обходом дерева на
        // каждый вызов из скрипта.
        let treeByRef = {};
        let parentByRef = {};
        function rebuildTreeIndex() {
            treeByRef = {};
            parentByRef = {};
            function walk(nodes, parentRef) {
                for (const n of nodes) {
                    treeByRef[n.ref] = n;
                    parentByRef[n.ref] = parentRef;
                    if (n.children && n.children.length) walk(n.children, n.ref);
                }
            }
            walk(treeData, -1);
        }

        function updateInventoryCount() {
            // Раньше это писало текст в #inv-selected-info — элемент из
            // панели "Быстрое", которая была убрана из интерфейса.
            // document.getElementById возвращал null, и обращение к
            // .textContent роняло исключение, из-за чего вызывающие
            // функции (selectRef/deselect) обрывались ДО отображения
            // свойств объекта — отсюда и пропадало выделение в
            // Properties/Script. Оставляем функцию как no-op, чтобы не
            // трогать остальную логику выбора объектов.
        }

        function findNodeByRef(nodes, ref) {
            for (const n of nodes) {
                if (n.ref === ref) return n;
                if (n.children) {
                    const found = findNodeByRef(n.children, ref);
                    if (found) return found;
                }
            }
            return null;
        }

        function onSearch(v) {
            searchText = v.trim().toLowerCase();
            if (searchText) {
                for (const n of treeData) {
                    expandAll(n);
                }
            }
            renderTree();
        }

        function expandAll(n) {
            expanded.add(n.ref);
            for (const c of n.children) {
                expandAll(c);
            }
        }

        function collapseAll() {
            expanded.clear();
            renderTree();
        }

        function expandAllVisible() {
            for (const n of treeData) {
                expandAll(n);
            }
            renderTree();
        }

        function renderTree() {
            const c = document.getElementById('tree');
            c.innerHTML = '';
            for (const n of treeData) {
                renderNode(c, n, 0);
            }
        }

        function renderNode(parentEl, node, depth) {
            const matchesSearch = !searchText ||
                node.name.toLowerCase().includes(searchText) ||
                node.cls.toLowerCase().includes(searchText);
            const hasMatchingChildren = searchText ? node.children.some(child => anyMatch(child)) : false;
            const isVisible = matchesSearch || hasMatchingChildren;

            if (!isVisible) return;

            const row = document.createElement('div');
            row.className = 'tree-node' + (node.ref === selectedRef ? ' selected' : '');
            row.style.paddingLeft = (depth * 14 + 2) + 'px';

            const arrow = document.createElement('span');
            arrow.className = 'tree-arrow';
            if (node.children.length) {
                arrow.textContent = expanded.has(node.ref) ? '▼' : '▶';
                arrow.onclick = (e) => {
                    e.stopPropagation();
                    toggleExpand(node.ref);
                };
            }
            row.appendChild(arrow);

            if (node.icon) {
                const img = document.createElement('img');
                img.className = 'tree-icon';
                img.src = node.icon;
                img.onerror = () => { img.style.display = 'none'; };
                row.appendChild(img);
            }

            const label = document.createElement('span');
            label.className = 'tree-label';
            if (searchText && node.name.toLowerCase().includes(searchText)) {
                const idx = node.name.toLowerCase().indexOf(searchText);
                label.innerHTML = esc(node.name.slice(0, idx)) +
                    '<mark>' + esc(node.name.slice(idx, idx + searchText.length)) + '</mark>' +
                    esc(node.name.slice(idx + searchText.length));
            } else {
                label.textContent = node.name;
            }
            label.title = node.cls;

            row.onclick = () => selectRef(node.ref);
            row.appendChild(label);

            parentEl.appendChild(row);

            if (expanded.has(node.ref)) {
                for (const child of node.children) {
                    renderNode(parentEl, child, depth + 1);
                }
            }
        }

        function anyMatch(n) {
            if (!searchText) return true;
            if (n.name.toLowerCase().includes(searchText)) return true;
            return n.children.some(child => anyMatch(child));
        }

        function toggleExpand(ref) {
            if (expanded.has(ref)) {
                expanded.delete(ref);
            } else {
                expanded.add(ref);
            }
            renderTree();
        }

        function esc(s) {
            // Раньше падал на null/undefined — TypeError здесь обрывает
            // ВЕСЬ renderLuaOutput() на середине (esc вызывается для КАЖДОЙ
            // строки лога подряд), из-за чего Output застревал на "(no
            // output)" навсегда, даже если print() до этого честно
            // сработал — сам вызов logLuaOutput() уже случился, просто
            // ПОСЛЕДУЮЩАЯ перерисовка на чём-то ещё в очереди обрывалась
            // здесь. Причина — Lua error() можно вызвать не строкой (таблицей,
            // числом, nil), и lua_tojsstring для не-строки возвращает
            // null/undefined, а не текст ошибки.
            if (s === null || s === undefined) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ============ ВЫБОР ОБЪЕКТА ============
        async function selectRef(ref) {
            await saveCurrentScriptIfDirty(); // иначе несохранённые правки терялись при переключении объекта
            selectedRef = ref;
            highlightSelected(ref);
            renderTree();
            updateInventoryCount();
            const r = await api('GET', '/api/instance/' + ref);
            if (!r.ok) return;
            renderProps(r);
        }

        function deselect() {
            saveCurrentScriptIfDirty(); // fire-and-forget — иначе клик мимо объекта тоже терял правки
            selectedRef = null;
            currentScriptRef = null;
            currentScriptOrigSource = null;
            highlightSelected(null);
            renderTree();
            updateInventoryCount();
            document.getElementById('tab-props').innerHTML = '<p style="color:#6b7280;font-size:12px;padding:8px">' + t('props_placeholder') + '</p>';
        }

        // ============ СВОЙСТВА ============
        function renderProps(r) {
            const SCLS = ['Script', 'LocalScript', 'ModuleScript'];
            const panel = document.getElementById('tab-props');
            panel.innerHTML = '';

            const hdr = document.createElement('div');
            hdr.className = 'prop-header';
            if (r.icon) {
                const img = document.createElement('img');
                img.style.cssText = 'width:32px;height:32px;object-fit:contain;background:white;border-radius:4px;margin-bottom:4px;display:block';
                img.src = r.icon;
                hdr.appendChild(img);
            }
            const cls = document.createElement('div');
            cls.className = 'prop-cls';
            cls.textContent = r.cls;
            const ref = document.createElement('div');
            ref.className = 'prop-ref';
            ref.textContent = 'ref ' + r.ref;
            hdr.appendChild(cls);
            hdr.appendChild(ref);
            panel.appendChild(hdr);

            // Position, Rotation, Size
            const specialProps = ['Position', 'Rotation', 'Size'];
            for (const propName of specialProps) {
                if (r.props[propName]) {
                    addVector3Prop(panel, r.ref, propName, r.props[propName]);
                }
            }

            // Остальные свойства
            for (const [k, v] of Object.entries(r.props).sort()) {
                if (k === 'Source' || k === 'CFrame' || specialProps.includes(k) || k === '_assets') {
                    continue;
                }
                addPropRow(panel, r.ref, k, v);
            }

            if (SCLS.includes(r.cls)) {
                // Script выполняется на сервере, LocalScript — на клиенте,
                // ModuleScript ни там, ни там сам по себе (только через
                // require() из другого скрипта) — бейдж в шапке вкладки
                // Script делает эту разницу видимой, а не молчаливо
                // одинаковой, как раньше (см. SCRIPT_BADGES ниже).
                const badge = SCRIPT_BADGES[r.cls] || SCRIPT_BADGES.Script;
                document.getElementById('script-name').innerHTML =
                    '<span style="color:' + badge.color + '">' + badge.icon + ' ' + badge.label + '</span>'
                    + ' — ' + esc(r.cls) + ': ' + esc(r.props.Name || '?');
                if (cmEditor) cmEditor.setValue(r.props.Source || '');
                currentScriptRef = r.ref;
                currentScriptOrigSource = r.props.Source || '';
                switchTab('script');
                refreshCM();
            } else {
                currentScriptRef = null;
                currentScriptOrigSource = null;
                switchTab('props');
            }
        }

        function addVector3Prop(panel, ref, propName, value) {
            const container = document.createElement('div');
            container.style.cssText = 'margin-bottom:4px;padding:4px;background:#111827;border-radius:4px';

            const label = document.createElement('div');
            label.style.cssText = 'font-size:11px;color:#9ca3af;margin-bottom:4px;font-weight:bold';
            label.textContent = propName;
            container.appendChild(label);

            const coords = ['x', 'y', 'z'];
            const colors = ['#ef4444', '#22c55e', '#3b82f6'];

            const row = document.createElement('div');
            row.style.cssText = 'display:flex;gap:4px';

            coords.forEach((coord, i) => {
                const inputGroup = document.createElement('div');
                inputGroup.style.cssText = 'flex:1;display:flex;align-items:center;gap:2px';

                const coordLabel = document.createElement('span');
                coordLabel.style.cssText = 'font-size:10px;color:' + colors[i] + ';font-weight:bold;min-width:12px';
                coordLabel.textContent = coord.toUpperCase();

                const input = document.createElement('input');
                input.className = 'prop-val';
                input.type = 'number';
                input.step = propName === 'Rotation' ? '1' : '0.1';
                input.value = typeof value === 'object' ? (value[coord] || 0) : 0;
                input.style.cssText = 'font-size:11px;padding:2px 4px';

                input.onchange = async () => {
                    const newValue = { ...value };
                    newValue[coord] = parseFloat(input.value) || 0;
                    // ВАЖНО: value — общий объект для всех трёх инпутов
                    // (X/Y/Z), созданных в этом вызове addVector3Prop.
                    // Панель не перерисовывается после каждой правки, так
                    // что без этой строки следующий изменённый инпут (Y)
                    // отправлял бы {...value} со СТАРЫМ X — правка X
                    // визуально "откатывалась" при следующей же правке Y/Z.
                    value[coord] = newValue[coord];
                    await api('POST', '/api/instance/' + ref, {
                        prop: propName,
                        value: newValue
                    });
                    reloadScene();
                };

                inputGroup.appendChild(coordLabel);
                inputGroup.appendChild(input);
                row.appendChild(inputGroup);
            });

            container.appendChild(row);
            panel.appendChild(container);
        }

        function addPropRow(panel, ref, k, v) {
            const row = document.createElement('div');
            row.className = 'prop-row';

            const nm = document.createElement('span');
            nm.className = 'prop-name';
            nm.textContent = k;
            nm.title = k;
            row.appendChild(nm);

            if (typeof v === 'boolean') {
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'prop-bool';
                cb.checked = v;
                cb.onchange = () => setProp(ref, k, cb.checked);
                row.appendChild(cb);
            } else if (v && typeof v === 'object' && 'r' in v && 'g' in v && 'b' in v) {
                const pr = document.createElement('div');
                pr.className = 'prop-color-preview';
                const hex = '#' + [v.r, v.g, v.b].map(x =>
                    Math.min(255, Math.max(0, Math.round(x * 255))).toString(16).padStart(2, '0')
                ).join('');
                pr.style.background = hex;
                pr.onclick = () => {
                    const inp = document.createElement('input');
                    inp.type = 'color';
                    inp.value = hex;
                    inp.onchange = () => {
                        const color = {
                            r: parseInt(inp.value.slice(1, 3), 16) / 255,
                            g: parseInt(inp.value.slice(3, 5), 16) / 255,
                            b: parseInt(inp.value.slice(5, 7), 16) / 255
                        };
                        setProp(ref, k, color);
                        pr.style.background = inp.value;
                        reloadScene();
                    };
                    inp.click();
                };
                row.appendChild(pr);
            } else {
                const inp = document.createElement('input');
                inp.className = 'prop-val';
                inp.value = typeof v === 'object' ? JSON.stringify(v).slice(0, 80) : String(v ?? '');
                inp.onchange = () => {
                    let val = inp.value;
                    try { val = JSON.parse(val); } catch (e) { }
                    setProp(ref, k, val);
                };
                row.appendChild(inp);
            }
            panel.appendChild(row);
        }

        async function setProp(ref, prop, val) {
            await api('POST', '/api/instance/' + ref, {
                prop: prop,
                value: val
            });
        }

        async function saveScript() {
            if (selectedRef === null) {
                notify(t('notify_script_none'), 'warn');
                return;
            }
            if (!cmEditor) {
                notify('Редактор скриптов недоступен (CodeMirror не загрузился)', 'err');
                return;
            }
            const src = cmEditor.getValue();
            await api('POST', '/api/instance/' + selectedRef, {
                prop: 'Source',
                value: src
            });
            currentScriptOrigSource = src; // синхронизируем трекер "грязности" — см. saveCurrentScriptIfDirty
            notify(t('notify_script_saved'));
        }

        function switchTab(t) {
            document.querySelectorAll('.tab').forEach((el, i) => {
                const tabNames = ['props', 'script'];
                el.classList.toggle('active', tabNames[i] === t);
            });
            document.getElementById('tab-props').style.display = t === 'props' ? '' : 'none';
            document.getElementById('tab-script').style.display = t === 'script' ? 'flex' : 'none';
            if (t === 'script') refreshCM();
        }

        // ============ БЫСТРОЕ ДОБАВЛЕНИЕ ============
        async function quickAdd(cls) {
            const name = 'New' + cls;
            let parent = selectedRef;
            if (parent === null) {
                const findWs = ns => {
                    for (const n of ns) {
                        if (n.cls === 'Workspace') return n.ref;
                        const c = findWs(n.children);
                        if (c !== null) return c;
                    }
                    return null;
                };
                parent = findWs(treeData) ?? -1;
            }
            const r = await api('PUT', '/api/instance', {
                class: cls,
                name: name,
                parent: parent
            });
            if (r.ok) {
                notify(t('notify_quickadd', { cls: cls }));
                loadTree();
            } else {
                notify(r.error || t('notify_error'), 'err');
            }
        }

        // ============ ФАЙЛОВЫЙ БРАУЗЕР ============
        let _fbMode = 'open';
        let _fbPath = '';

        // ============ СОХРАНЕНИЕ "КАК" ============
        // Раньше "Сохранить как" вне Android открывало самописный
        // проводник (fbModal/browseTo), который ходил по файловой системе
        // СЕРВЕРА через /api/browse — на телефоне (и вообще всегда, когда
        // сервер и вкладка браузера не одна машина) это в принципе не
        // могло показать реальные файлы пользователя. Теперь везде —
        // только системный путь: на Android это SAF-диалог "Сохранить
        // как" через мост, в браузере — обычная нативная загрузка
        // (менеджер загрузок ОС/браузера, см. /api/save/download).
        async function openFileBrowser(mode) {
            _fbMode = mode;

            // ОТКРЫТИЕ — см. pickRbxlFileForOpen().
            if (mode === 'open') {
                pickRbxlFileForOpen();
                return;
            }

            showModal(saveAsModal());
        }

        function saveAsModal() {
            return '<h3>' + t('fb_saveas_title') + '</h3>' +
                '<input id="fb-name" placeholder="' + t('fb_name_ph') + '" value="place.rbxl">' +
                '<div class="modal-row">' +
                '<button onclick="confirmSaveAs()" style="background:#065f46">' + t('btn_save') + '</button>' +
                '<button onclick="closeModal()">' + t('btn_cancel') + '</button>' +
                '</div>';
        }

        async function confirmSaveAs() {
            const nm = document.getElementById('fb-name');
            const name = (nm && nm.value.trim()) || 'place.rbxl';
            closeModal();

            if (window.AndroidBridge && typeof window.AndroidBridge.getDataDir === 'function' &&
                typeof window.AndroidBridge.exportRbxlFile === 'function') {
                // Android: сервер сначала пишет .rbxl во временный файл в
                // приватном хранилище приложения (сервер видит только
                // его — SAF-Uri для него недоступны), а Kotlin показывает
                // системный диалог "Сохранить как" и копирует туда байты.
                const dataDir = window.AndroidBridge.getDataDir();
                const tempPath = dataDir + '/export_' + name.replace(/[^A-Za-z0-9._-]/g, '_');
                const r = await api('POST', '/api/save', { path: tempPath });
                if (!r.ok) {
                    notify(r.error || t('notify_error'), 'err');
                    return;
                }
                window.AndroidBridge.exportRbxlFile(tempPath, name);
                return;
            }

            // Браузер: обычная нативная загрузка файла — вызывается сразу
            // в рамках того же клика, без alert()/await между кликом и
            // созданием ссылки, чтобы не потерять user-activation (см.
            // pickRbxlFileForOpen для той же проблемы на открытии).
            const a = document.createElement('a');
            a.href = '/api/save/download?name=' + encodeURIComponent(name);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            notify('💾 ' + name);
        }

        // Вызывается из Kotlin после того как пользователь выбрал место
        // через SAF и файл скопирован (или отменил диалог / произошла ошибка).
        window.onAndroidFileExported = function (ok) {
            notify(ok ? t('notify_saved_simple') : t('notify_save_cancelled'), ok ? undefined : 'err');
        };

        // Открытие .rbxl/.rbxlx нативным способом ОС вместо /api/browse.
        // На Android — SAF через мост (Kotlin копирует файл в приватное
        // хранилище приложения и вызывает onAndroidFileImported с локальным
        // путём). Везде остальном — обычный <input type=file>: браузер сам
        // показывает системный файловый менеджер, а выбранный файл
        // отправляется на сервер как multipart/form-data (тот же паттерн,
        // что уже используется для импорта аватара — см.
        // pickAvatarFileForImport()).
        function pickRbxlFileForOpen() {
            // ВАЖНО: здесь раньше стояли блокирующие alert() между кликом
            // пользователя и вызовом fileInput.click(). Нативный пикер
            // файлов браузер показывает только в рамках "живого"
            // пользовательского жеста (transient user activation) —
            // alert() требует отдельного тапа "OK" и к моменту его закрытия
            // этот жест уже израсходован/истёк, поэтому fileInput.click()
            // молча ничего не делал. Используем console.log вместо alert —
            // он ничего не блокирует и не трогает user-activation.
            console.log('pickRbxlFileForOpen вызвана. AndroidBridge=' +
                (typeof window.AndroidBridge) +
                ', pickRbxlFile=' +
                (window.AndroidBridge ? typeof window.AndroidBridge.pickRbxlFile : 'n/a'));

            if (window.AndroidBridge && typeof window.AndroidBridge.pickRbxlFile === 'function') {
                window.AndroidBridge.pickRbxlFile();
                return;
            }

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.rbxl,.rbxlx';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            fileInput.addEventListener('change', function (event) {
                const file = event.target.files[0];
                if (!file) {
                    document.body.removeChild(fileInput);
                    return;
                }

                console.log('выбран файл ' + file.name + ', размер ' + file.size + ' байт. Отправляю на /api/open/upload...');

                const formData = new FormData();
                formData.append('file', file);

                fetch('/api/open/upload', { method: 'POST', body: formData })
                    .then(response => response.json())
                    .then(data => {
                        document.body.removeChild(fileInput);
                        if (data.ok) {
                            notify(t('notify_loaded_count', { n: data.count }));
                            loadTree();
                        } else {
                            notify(data.error || t('notify_error'), 'err');
                        }
                    })
                    .catch(err => {
                        document.body.removeChild(fileInput);
                        console.error('Ошибка загрузки файла:', err);
                        notify(t('notify_error'), 'err');
                    });
            });

            // Вызывается сразу, синхронно, в рамках того же клика — без
            // alert()/await между ними, иначе браузер молча откажет.
            fileInput.click();
        }

        window.onAndroidFileImported = async function (path) {

        async function validateRobloxApiKey() {
            const resEl = document.getElementById('rbx-apikey-validate-result');
            if (resEl) resEl.textContent = t('apikey_validating');
            // Пробуем реальным ассетом со сцены, если он уже загружен
            // (см. luaByRef/all_instances) — так проверка честно бьёт по
            // тому же пути, что и настоящая игра, а не по случайному ID.
            let testAssetId = null;
            for (const ref in (typeof soundElByRef !== 'undefined' ? soundElByRef : {})) {
                const src = soundElByRef[ref].src || '';
                const m = /[?&]id=(\d+)/.exec(src);
                if (m) { testAssetId = m[1]; break; }
            }
            const r = await api('POST', '/api/roblox/api-key/validate', testAssetId ? { assetId: testAssetId } : {});
            if (!r.ok) {
                if (resEl) resEl.textContent = '❌ ' + t('apikey_error', { msg: r.error || r.text });
                return;
            }
            if (r.valid) {
                if (resEl) resEl.textContent = t('apikey_valid');
            } else {
                if (resEl) resEl.textContent = t('apikey_invalid');
            }
        }

        function _b64ToBlob(b64, mime) {
            const bytes = atob(b64);
            const arr = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
            return new Blob([arr], { type: mime });
        }

        function _downloadBlob(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

                else if (i === activeIndex && errorText) { icon = '❌'; style = 'font-weight:600;color:#f87171'; }
                return '<div style="display:flex;gap:8px;align-items:center;padding:4px 0;' + style + '">' +
                    '<span>' + icon + '</span><span>' + label + '</span></div>';
            }).join('');

                : '';
            return '<h3>' + t('avatar_progress_title') + '</h3>' + rows + errBlock +

        function pickAvatarFileForImport() {
            // Если есть Android-мост — используем нативный выбор файла
            if (window.AndroidBridge && typeof window.AndroidBridge.pickAvatarZipFile === 'function') {
                window.AndroidBridge.pickAvatarZipFile();
                return;
            }

            // Веб-версия: создаём скрытый input для выбора ZIP
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.zip,application/zip';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            fileInput.addEventListener('change', function (event) {
                const file = event.target.files[0];
                if (!file) {
                    document.body.removeChild(fileInput);
                    return;
                }

                // Отправляем файл на сервер (multipart/form-data)
                const formData = new FormData();
                formData.append('file', file);

                fetch('/api/roblox/avatar3d/import-local-upload', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        document.body.removeChild(fileInput);
                        if (data.ok) {
                            // Вызываем реальную функцию импорта в сцену
                            importAvatarIntoScene(data.obj_text, data.mtl_text, data.textures, 'local')
                                .then(() => notify(t('avatar_added_to_scene')))
                                .catch(e => notify('Не удалось импортировать: ' + e.message, 'err'));
                        } else {
                            notify(data.error || 'Ошибка импорта', 'err');
                        }
                    })
                    .catch(err => {
                        document.body.removeChild(fileInput);
                        console.error('Ошибка загрузки файла:', err);
                        notify('Ошибка сети при импорте', 'err');
                    });
            });

            fileInput.click();
        }

                await importAvatarIntoScene(r.obj_text, r.mtl_text, r.textures, 'local');
                notify(t('avatar_added_to_scene'));
            } catch (e) {
                notify('Не удалось импортировать: ' + (e && e.message || e), 'err');
            }
        };


        async function doDownloadAvatar3d(mode) {
            const userId = (document.getElementById('av-uid').value || '').trim();
            if (!/^[0-9]+$/.test(userId)) {
                notify(t('avatar_enter_uid'), 'err');
                return;
            }

            _avatar3dCancelled = false;
            _avatar3dAbort = new AbortController();
            const signal = _avatar3dAbort.signal;

            const steps = mode === 'import'
                ? ['Запрашиваю статус модели у Roblox', 'Жду, пока Roblox сгенерирует модель', 'Скачиваю obj/mtl/текстуры', 'Добавляю на сцену']
                : ['Запрашиваю статус модели у Roblox', 'Жду, пока Roblox сгенерирует модель', 'Скачиваю obj/mtl/текстуры', 'Выберите, куда сохранить'];
            let step = 0;
            showModal(_avatarProgressHtml(steps, step));

            const maxWaitMs = 120000;
            const pollEveryMs = 1500;
            const startedAt = Date.now();
            let bundleUrl = null;
            let sawGenerating = false;

            while (Date.now() - startedAt < maxWaitMs) {
                if (_avatar3dCancelled) return;
                let st;
                try {
                    st = await _apiAbortable('/api/roblox/avatar3d/status?userId=' + encodeURIComponent(userId), signal);
                } catch (e) {
                    if (_avatar3dCancelled || e.name === 'AbortError') return;
                    showModal(_avatarProgressHtml(steps, step, 'Сеть/сервер: ' + (e && e.message || e)));
                    return;
                }
                if (!st.ok) {
                    showModal(_avatarProgressHtml(steps, step, st.message || st.error || 'Не удалось запросить статус'));
                    return;
                }
                if (st.ready) {
                    bundleUrl = st.bundleUrl;
                    break;
                }
                if (st.state === 'Error') {
                    showModal(_avatarProgressHtml(steps, step, 'Roblox не смог сгенерировать модель для этого User ID'));
                    return;
                }
                if (!sawGenerating) {
                    sawGenerating = true;
                    step = 1;
                    showModal(_avatarProgressHtml(steps, step));
                }
                await new Promise(res => setTimeout(res, pollEveryMs));
            }

            if (_avatar3dCancelled) return;

            if (!bundleUrl) {
                showModal(_avatarProgressHtml(steps, step, 'Roblox слишком долго готовит модель — попробуйте ещё раз чуть позже'));
                return;
            }

            step = 2;
            showModal(_avatarProgressHtml(steps, step));

            // savePath: на Android — приватная папка приложения (для SAF-
            // экспорта нужен реальный путь на диске), на десктопе — рядом
            // с самим app.py. Сервер всегда пишет .zip независимо от mode
            // (дёшево и на будущее пригодится), а для mode='import'
            // дополнительно просим includeAssets=1 — тогда в ответе сразу
            // приходят готовые для three.js текст OBJ/MTL и текстуры,
            // без повторного похода на сервер.
            const dataDir = (typeof IS_ANDROID !== 'undefined' && IS_ANDROID)
                ? window.AndroidBridge.getDataDir() : '.';

            let fetchUrl = '/api/roblox/avatar3d/fetch?bundleUrl=' + encodeURIComponent(bundleUrl) +
                '&userId=' + encodeURIComponent(userId) +
                '&savePath=' + encodeURIComponent(dataDir);
            if (mode === 'import') fetchUrl += '&includeAssets=1';

            let r;
            try {
                r = await _apiAbortable(fetchUrl, signal);
            } catch (e) {
                if (_avatar3dCancelled || e.name === 'AbortError') return;
                showModal(_avatarProgressHtml(steps, step, 'Ошибка скачивания: ' + (e && e.message || e)));
                return;
            }
            if (_avatar3dCancelled) return;
            if (!r.ok) {
                showModal(_avatarProgressHtml(steps, step, r.message || r.error || 'Не удалось скачать файлы'));
                return;
            }

            step = 3;
            showModal(_avatarProgressHtml(steps, step));

            if (mode === 'import') {
                try {
                    await importAvatarIntoScene(r.obj_text, r.mtl_text, r.textures, userId);
                } catch (e) {
                    showModal(_avatarProgressHtml(steps, step, 'Не удалось импортировать: ' + (e && e.message || e)));
                    return;
                }
                closeModal();
                notify(t('avatar_added_to_scene'));
                return;
            }

            if (!IS_ANDROID) {
                showModal(_avatarProgressHtml(steps, step, 'Сохранение .zip доступно только в Android-приложении (в десктоп-режиме файл уже записан рядом с app.py: ' + r.zipPath + ')'));
                return;
            }
            // Тот же поток, что уже работает для сохранения .rbxl:
            // Kotlin откроет системный диалог "Сохранить как", скопирует
            // zip по выбранному пользователем месту и вызовет
            // window.onAndroidFileExported(ok).
            window.AndroidBridge.exportRbxlFile(r.zipPath, r.zipName);
        }

        // Загружает OBJ+MTL+текстуры (уже скачанные с сервера как текст/
        // data URL) в текущую three.js сцену редактора как обычный объект.
        // Текстуры подставляются через LoadingManager.setURLModifier —
        // MTLLoader пытается идти в сеть за файлами по имени, а мы вместо
        // этого подсовываем уже готовые data: URL.
        async function importAvatarIntoScene(objText, mtlText, textures, userId) {
            await ensureObjMtlLoaders();

            // КРИТИЧНЫЙ ФИКС: Roblox отдаёт НЕстандартный .obj — строки вершин
            // выглядят как "v x y z r g b a" (координаты + RGBA-цвет прямо в
            // одной строке), а не "v x y z", как ждёт обычный формат
            // Wavefront OBJ. THREE.OBJLoader понимает только 3 (или 6 с
            // цветом без альфы) числа после "v" — лишние токены ломают
            // парсинг геометрии, из-за чего меш получался пустым/битым и
            // визуально ничего не появлялось на сцене. Отрезаем всё
            // лишнее, оставляя только x y z.
            const fixedObjText = objText.replace(
                /^v(\s+-?[\d.eE+-]+\s+-?[\d.eE+-]+\s+-?[\d.eE+-]+)(?:\s+-?[\d.eE+-]+)*\s*$/gm,
                'v$1'
            );

            const texByName = {};
            (textures || []).forEach(t => { texByName[t.name] = t.data_url; });

            const manager = new THREE.LoadingManager();
            manager.setURLModifier((url) => {
                const clean = url.split('/').pop();
                return texByName[clean] || url;
            });

            // ФИКС ПРОЗРАЧНОСТИ: THREE.MTLLoader (r128) трактует тег "Tr"
            // (transparency, 1 = полностью прозрачно) БЕЗ инверсии, как
            // если бы это было "d" (dissolve, 1 = непрозрачно) — это
            // старый баг лоадера. Roblox иногда пишет в .mtl именно "Tr",
            // из-за чего материалы получают заниженный opacity и весь
            // аватар выглядит полупрозрачным ("призрачным"). invertTrProperty
            // чинит семантику, а принудительный сброс ниже — подстраховка
            // на случай других полей (d/Tr с "мусорными" значениями),
            // потому что реальной художественной прозрачности у Roblox-
            // аватара (кроме альфы в текстурах ресниц/волос) быть не должно.
            const mtlLoader = new THREE.MTLLoader(manager);
            mtlLoader.setMaterialOptions({ invertTrProperty: true });
            const materials = mtlLoader.parse(mtlText, '');
            materials.preload();
            // ФИКС КАЧЕСТВА 1/2: MTLLoader по умолчанию делает материалы
            // однослойными (FrontSide) — при неправильном порядке вершин
            // в части полигонов (частый случай у сгенерированных Roblox
            // мешей) это вырезает грани и модель выглядит "дырявой"/
            // некачественной. DoubleSide рендерит обе стороны, дешёво и
            // без побочных эффектов на статичной модели вроде аватара.
            for (const key in materials.materials) {
                const m = materials.materials[key];
                m.side = THREE.DoubleSide;
                // Принудительно делаем непрозрачным: ошибочно распарсенный
                // d/Tr — самая частая причина "полупрозрачного" аватара.
                m.transparent = false;
                m.opacity = 1;
                m.alphaTest = 0;
                m.needsUpdate = true;
            }

            const objLoader = new THREE.OBJLoader(manager);
            objLoader.setMaterials(materials);
            const object = objLoader.parse(fixedObjText);

            // ФИКС КАЧЕСТВА 2/2: текстуры из data: URL по умолчанию
            // трактуются как линейные, из-за чего цвета выглядят блёкло/
            // серо по сравнению с оригиналом в Roblox — sRGB-кодирование
            // возвращает нормальную насыщенность. sRGBEncoding — API
            // three.js r128 (в новых версиях библиотеки заменено на
            // colorSpace, но здесь используется именно r128).
            object.traverse(n => {
                if (n.isMesh) {
                    n.castShadow = true;
                    n.receiveShadow = true;
                    // ФИКС "ГРАНЁНОГО" ВИДА: Roblox почти всегда не кладёт
                    // вершинные нормали (vn) в этот .obj — OBJLoader в таком
                    // случае считает нормали по каждой грани отдельно (flat
                    // shading), из-за чего низкополигональная модель
                    // выглядит ещё грубее, чем есть на самом деле — видны
                    // резкие "фасеты" вместо плавных переходов. Полигонов
                    // это не добавляет (их больше в источнике не взять —
                    // ограничение самого Roblox avatar-3d API), но
                    // computeVertexNormals() усредняет нормали между
                    // смежными гранями и свет ложится плавно (smooth
                    // shading), визуально маскируя низкий poly count.
                    if (n.geometry) n.geometry.computeVertexNormals();
                    const mats = Array.isArray(n.material) ? n.material : [n.material];
                    mats.forEach(m => {
                        if (m && m.map) {
                            m.map.encoding = THREE.sRGBEncoding;
                            // ФИКС ЗЕРНИСТОСТИ ТЕКСТУР НА ТЕЛЕФОНЕ: без
                            // анизотропной фильтрации текстуры кожи/одежды
                            // "шумят" и теряют детали под углом к камере —
                            // на высокоплотном экране телефона это заметнее,
                            // чем на мониторе ПК. getMaxAnisotropy() отдаёт
                            // максимум, который поддерживает GPU устройства.
                            m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                            m.map.needsUpdate = true;
                        }
                    });
                }
            });

            let vertCount = 0;
            object.traverse(n => { if (n.isMesh && n.geometry && n.geometry.attributes.position) vertCount += n.geometry.attributes.position.count; });
            if (vertCount === 0) {
                throw new Error('Модель распарсилась, но геометрия пустая (0 вершин) — формат OBJ мог измениться на стороне Roblox');
            }

            object.name = 'RobloxAvatar_' + userId;

            if (!(typeof scene !== 'undefined' && scene)) {
                throw new Error('3D-сцена ещё не готова, попробуйте через секунду');
            }
            scene.add(object);

            // ВАЖНО: координаты вершин в OBJ от Roblox абсолютные — они
            // привязаны к позиции персонажа в игровом мире (часто Y~100 и
            // выше), а не к (0,0,0). Простой сдвиг object.position НЕ
            // компенсирует это — сдвигается только точка опоры (pivot),
            // а сама геометрия остаётся там же относительно неё. Поэтому
            // сначала считаем bounding box и центрируем через него.
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());

            let targetPos = new THREE.Vector3(0, 0, 0);
            if (typeof camera !== 'undefined' && camera) {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                targetPos.copy(camera.position).add(dir.multiplyScalar(15));
            }
            object.position.copy(targetPos).sub(center);

            // Сохраняем смещение центра, чтобы использовать при reloadScene
            const centerOffset = center.clone();

            // Чтобы аватар появился в Explorer, был выбираемым/удаляемым
            // как обычный объект и не пропадал при следующем reloadScene()
            // (его вызывает даже поворот камеры) — заводим для него
            // настоящий Instance на сервере (Model в дереве), а саму
            // геометрию (которую сервер не умеет описывать в формате
            // Part/MeshPart) держим в клиентском кэше и переиспользуем
            // при каждой пересборке сцены вместо обычного построения меша
            // из свойств инстанса. См. правку в reloadScene().
            let ref = null;
            if (typeof api === 'function') {
                const findWs = ns => {
                    for (const n of ns) {
                        if (n.cls === 'Workspace') return n.ref;
                        const c = findWs(n.children);
                        if (c !== null) return c;
                    }
                    return null;
                };
                const parent = findWs(treeData) ?? -1;
                const r = await api('PUT', '/api/instance', {
                    class: 'Part',
                    name: object.name,
                    parent: parent,
                });
                if (r.ok) {
                    ref = r.ref;
                } else {
                    // ВАЖНО: PUT /api/instance молча возвращает {ok:false},
                    // если на сервере нет открытого файла (state['parsed']
                    // is None — открывается только через "Открыть проект"
                    // или аргументом командной строки при запуске app.py).
                    // Модель при этом всё равно появляется в вьюпорте, т.к.
                    // scene.add(object) чуть выше — чисто клиентский код,
                    // серверу не нужен. Раньше эта ошибка проглатывалась
                    // молча (ref просто оставался null) — снаружи выглядело
                    // так, будто аватар "не показывается в Explorer" без
                    // единой подсказки почему. Бросаем понятную ошибку:
                    // doDownloadAvatar3d() уже оборачивает вызов в try/catch
                    // и покажет её в модалке вместо ложного "успеха".
                    throw new Error(
                        'Модель добавлена только в вьюпорт (визуально), но НЕ ' +
                        'сохранена как объект сцены: нет открытого проекта ' +
                        '(.rbxl/.rbxlx). Откройте или создайте файл проекта, ' +
                        'затем импортируйте аватар заново.'
                    );
                }
                if (ref !== null) {
                    // КРИТИЧНЫЙ ФИКС #2: /api/scene на сервере (make_scene_objects)
                    // читает позицию ИСКЛЮЧИТЕЛЬНО из свойства CFrame — Position
                    // читается первым, но сразу же перезаписывается значением из
                    // CFrame (px, py, pz = get_pos(cf)). Если CFrame не задан,
                    // get_pos() возвращает (0,0,0), и объект всё равно вылетает
                    // за радиус видимости камеры, несмотря на записанный Position.
                    // Пишем CFrame в формате 3x4 row-major матрицы, который ждут
                    // get_pos()/get_rot_matrix() на сервере: [r00,r01,r02,px,
                    // r10,r11,r12,py, r20,r21,r22,pz]. Вращение — единичное,
                    // т.к. геометрия аватара уже "запечена" в мировых координатах
                    // самого меша (см. центрирование через bounding box выше).
                    const p = object.position;
                    const size = box.getSize(new THREE.Vector3());
                    // Формат CFrame, который реально понимает сервер (см.
                    // get_pos()/get_rot_matrix() в app.py и разбор в
                    // rbxl_parser.py): { position: {x,y,z}, matrix: [9
                    // чисел поворота] } — координаты ОТДЕЛЬНО от матрицы
                    // поворота. Предыдущая версия фикса клала перевод
                    // внутрь 12-элементной матрицы (r,r,r,tx,...) — но
                    // get_pos() сначала проверяет cf.get('position', {}),
                    // а дефолт {} — это тоже dict, поэтому ветка с matrix
                    // никогда не выполнялась и позиция всегда читалась
                    // как (0,0,0), несмотря на записанный CFrame.
                    await api('POST', '/api/instance/' + ref, {
                        prop: 'CFrame',
                        value: {
                            position: { x: p.x, y: p.y, z: p.z },
                            matrix: [1, 0, 0, 0, 1, 0, 0, 0, 1],
                        },
                    });
                    await api('POST', '/api/instance/' + ref, {
                        prop: 'Position',
                        value: { x: p.x, y: p.y, z: p.z },
                    });
                    await api('POST', '/api/instance/' + ref, {
                        prop: 'Size',
                        value: { x: size.x || 1, y: size.y || 1, z: size.z || 1 },
                    });
                    await api('POST', '/api/instance/' + ref, { prop: 'Anchored', value: true });
                }
            }
            if (ref !== null) {
                // Без userData.ref луч в pick() не может определить, какому
                // Instance принадлежит эта Group — клик по аватару в сцене
                // никогда не выбирал его.
                object.userData.ref = ref;
                window._avatarMeshCache = window._avatarMeshCache || {};
                window._avatarMeshCache[ref] = { object, centerOffset: centerOffset };
                sceneObjs[ref] = object;
                await loadTree();
            }

            // Рендер-цикл приложения не всегда рисует каждый кадр по
            // условию (throttling) — принудительно рисуем один кадр сразу,
            // чтобы объект стал виден немедленно, а не только после
            // следующего взаимодействия с камерой.
            if (typeof renderer !== 'undefined' && renderer && typeof camera !== 'undefined') {
                try { renderer.render(scene, camera); } catch (e) { }
            }

            return { vertCount, ref };
        }

        // Тот же колбэк уже используется для сохранения .rbxl — здесь
        // просто закрываем прогресс-модалку аватара, если она открыта.
        const _prevOnAndroidFileExported = window.onAndroidFileExported;
        window.onAndroidFileExported = function (ok) {
            if (_prevOnAndroidFileExported) _prevOnAndroidFileExported(ok);
            const overlay = document.getElementById('modal-overlay');
            if (overlay && overlay.classList.contains('show')) {
                closeModal();
            }
            notify(ok ? t('avatar_saved') : t('avatar_save_cancelled'), ok ? undefined : 'err');
        };

        function showModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-overlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        // ============ КЛАВИШИ ============
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' ||
                e.target.classList.contains('CodeMirror') || e.target.closest('.CodeMirror')) {
                return;
            }

            keysPressed[e.key.toLowerCase()] = true;

            if (isPlaying && !luaControlsDisabled && (e.key === ' ' || e.key.toLowerCase() === 'e')) {
                e.preventDefault();
                jumpQueued = true;
            }

            if (e.ctrlKey && e.key === 'o') {
                e.preventDefault();
                openFileBrowser('open');
            } else if (e.ctrlKey && e.shiftKey && e.key === 'S') {
                e.preventDefault();
                openFileBrowser('save');
            } else if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveFile();
            } else if (e.key === 'Delete') {
                deleteSelected();
            } else if (e.key === 'Escape') {
                closeModal();
                deselect();
            } else if (e.key === 'F5') {
                e.preventDefault();
                reloadScene();
            } else if (e.key === 'f' && !e.ctrlKey) {
                if (selectedRef && sceneObjs[selectedRef]) {
                    const p = sceneObjs[selectedRef].position;
                    target = { x: p.x, y: p.y, z: p.z };
                    updateCamera();
                    notify(t('notify_focus'));
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keysPressed[e.key.toLowerCase()] = false;
        });

        document.getElementById('modal-overlay').onclick = e => {
            if (e.target.id === 'modal-overlay') closeModal();
        };

        // ============ ИНИЦИАЛИЗАЦИЯ ============
        window.addEventListener('DOMContentLoaded', () => {
            loadLayout();
            initResizers();

            refreshCM();
        });

        window.addEventListener('resize', refreshCM);
        // Обычный window 'resize' на многих мобильных браузерах/WebView НЕ
        // срабатывает при появлении/скрытии виртуальной клавиатуры — меняется
        // только visualViewport (видимая область), а layout-вьюпорт (window.
        // innerHeight) может остаться прежним. Без этого CodeMirror держал
        // устаревшие координаты после открытия клавиатуры — от этого и
        // "экран уплывает" (страница пытается докрутить фокус в старых
        // координатах), и подсказки могли всплывать не там, где реально
        // видно (или вовсе за пределами видимой области).
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                refreshCM();
                if (cmEditor && cmEditor.state && cmEditor.state.completionActive) {
                    cmEditor.closeCompletion(); // старая позиция всё равно неверна — не показывать её "зависшей"
                }
            });
        }
    </script>
</body>
