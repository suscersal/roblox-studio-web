<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Roblox Studio Mobile</title>

    <script>
        // ВРЕМЕННАЯ ДИАГНОСТИКА (нет доступа к консоли разработчика) —
        // ловим ЛЮБУЮ необработанную ошибку JS где угодно на странице.
        // Если что-то падает при первой загрузке скрипта, это может тихо
        // остановить выполнение остального кода (в т.ч. не даст
        // определиться функции openFileBrowser) — и тогда клик по кнопке
        // не будет делать вообще ничего, без единого алерта из самой
        // функции. Этот перехватчик покажет такую ошибку.
        window.addEventListener('error', function (e) {
            alert('DEBUG GLOBAL ERROR: ' + e.message +
                '\n' + (e.filename || '') + ':' + e.lineno + ':' + e.colno);
        });
    </script>

    <!-- vendor/*.css — локальные копии, скачанные один раз setup_termux.sh
         (см. корень проекта). После setup.sh приложение работает без сети
         вообще; если запускать без setup.sh (например, сразу с ПК), эти
         файлы можно заменить обратно на CDN-ссылки. -->
    <!-- CodeMirror 5 CSS больше не нужен — CM6 задаёт свою тему целиком через
         JS (EditorView.theme(...) в entry.mjs), никаких отдельных .css файлов
         подключать не требуется. -->





    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="toolbar-top">
        <span class="title">🎮 RbxStudio</span>
        <div class="sep"></div>
        <button onclick="newProject()" data-i18n-title="tb_new_title" title="New empty scene"><span
                data-i18n="tb_new">🆕 New</span></button>
        <button onclick="openFileBrowser('open')" data-i18n-title="tb_open_title" title="Open file (Ctrl+O)"><span
                data-i18n="tb_open">📂 Open</span></button>
        <button class="green" onclick="saveFile()" data-i18n-title="tb_save_title" title="Save (Ctrl+S)"><span
                data-i18n="tb_save">💾 Save</span></button>
        <button onclick="openFileBrowser('save')" data-i18n-title="tb_saveas_title" title="Save as"><span
                data-i18n="tb_saveas">💾 As...</span></button>
        <button onclick="importRbxm()" data-i18n-title="tb_import_title" title="Import a model (.rbxm) into the scene"><span
                data-i18n="tb_import">📥 Import</span></button>
        <button onclick="exportSelectedRbxm()" data-i18n-title="tb_export_title" title="Export the selected objects to a model (.rbxm)"><span
                data-i18n="tb_export">📤 Export</span></button>
        <div class="sep"></div>
        <button onclick="showAddDialog()" data-i18n-title="tb_addobj_title" title="Add object"><span
                data-i18n="tb_add">➕ Add</span></button>
        <button class="red" onclick="deleteSelected()" data-i18n-title="tb_delete_title" title="Delete (Delete)"><span
                data-i18n="tb_delete">🗑 Delete</span></button>
        <div class="sep"></div>
        <button onclick="reloadScene()" data-i18n-title="tb_refresh_title" title="Refresh scene (F5)"><span
                data-i18n="tb_refresh">🔄 Refresh</span></button>
        <button class="blue" onclick="showPublishDialog()" data-i18n-title="tb_publish_title" title="Publish"><span
                data-i18n="tb_publish">☁ Publish</span></button>
        <button class="purple" id="account-btn" onclick="showAccountDialog()"
            data-i18n-title="tb_account_title" title="Аккаунт Roblox и Open Cloud API-ключ">
            <span data-i18n="tb_account">👤 Account</span></button>
        <button onclick="toggleLang()" title="Switch language / Сменить язык" id="lang-btn">🌐 EN</button>
        <div class="sep"></div>
        <button class="green" id="play-btn" onclick="togglePlay()" data-i18n-title="tb_play_title"
            title="Run physics simulation"><span data-i18n="tb_play">▶ Play</span></button>
        <button onclick="toggleThirdPerson()" title="1st/3rd person">👤 Вид</button>
        <div class="sep"></div>
        <button onclick="resetCamera()" data-i18n-title="tb_resetcam_title" title="Reset camera"><span
                data-i18n="tb_resetcam">🏠 Reset</span></button>
        <button onclick="topView()" data-i18n-title="tb_topview_title" title="Top view"><span data-i18n="tb_topview">⬆
                Top</span></button>
        <button onclick="frontView()" data-i18n-title="tb_frontview_title" title="Front view"><span
                data-i18n="tb_frontview">📷 Front</span></button>
        <button onclick="rightView()" data-i18n-title="tb_rightview_title" title="Right view"><span
                data-i18n="tb_rightview">➡ Right</span></button>
        <button onclick="teleportCameraToSelected()" data-i18n-title="tb_teleport_title" title="Teleport camera to selected object"><span
                data-i18n="tb_teleport">🎯 Go to</span></button>
        <div class="sep"></div>
        <button onclick="toggleHelpers()" data-i18n-title="tb_helpers_title" title="Grid and axes">📏</button>
        <button onclick="resetLayout()" data-i18n-title="tb_resetlayout_title" title="Reset panel sizes">📐</button>
    </div>

    <div id="main">
        <div id="explorer">
            <div id="explorer-header">
                <span id="explorer-title">Explorer</span>
                <div>
                    <button id="multisel-btn" onclick="toggleMultiSelect()" data-i18n-title="exp_multisel_title"
                        title="Multi-select mode">☑</button>
                    <button onclick="collapseAll()" data-i18n-title="exp_collapse_title" title="Collapse all">◢</button>
                    <button onclick="expandAllVisible()" data-i18n-title="exp_expand_title"
                        title="Expand all">◣</button>
                </div>
            </div>
            <input id="search-box" data-i18n-placeholder="exp_search_ph" placeholder="🔍 Search..."
                oninput="onSearch(this.value)">
            <div id="tree-scroll">
                <div id="tree"></div>
            </div>
        </div>
        <div class="resizer" id="resizer-1"></div>
        <div id="viewport" tabindex="0">
            <div id="gui-overlay"></div>
            <button id="play-stop-fab" onclick="togglePlay()" title="Stop">⏸</button>
            <div id="fps-counter">FPS: --</div>
            <div id="speed-indicator">🚀 x1.0</div>
            <div id="quality-selector">
                <button onclick="setQuality('low')" class="active" id="q-low">Low</button>
                <button onclick="setQuality('medium')" id="q-medium">Med</button>
                <button onclick="setQuality('high')" id="q-high">High</button>
            </div>
            <!-- Старый плавающий блок Lua Output удалён -->
            <div id="vp-label" data-i18n-html="vp_hint">
                🖱️ LMB — rotate | 🖱️ RMB — pan | 🖱️ Wheel — render distance<br>
                ⌨️ WASD — move | F — focus | Esc — deselect
            </div>
            <div id="mobile-pad">
                <div id="joy-zone"></div>
                <div id="joy-base">
                    <div id="joy-thumb"></div>
                </div>
                <div class="pad-col">
                    <button class="pad-btn" id="pad-e" data-key="e" data-i18n-title="pad_up_title" title="Up">⬆</button>
                    <button class="pad-btn" id="pad-q" data-key="q" data-i18n-title="pad_down_title"
                        title="Down">⬇</button>
                </div>
            </div>
        </div>
        <div class="resizer" id="resizer-2"></div>
        <div id="rightpanel">
            <div id="tabs">
                <div class="tab active" onclick="switchTab('props')">Properties</div>
                <div class="tab" onclick="switchTab('script')">Script</div>
                <!-- Вкладка Output удалена, она теперь снизу -->
            </div>
            <div id="tab-props">
                <p style="color:#6b7280;font-size:12px;padding:8px" data-i18n="props_placeholder">← Select an object</p>
            </div>
            <div id="tab-script" style="display:none;flex:1;flex-direction:column">
                <div id="script-name" data-i18n="script_none_selected">No script selected</div>
                <div id="script-editor-container">
                    <textarea id="script-editor" spellcheck="false"></textarea>
                </div>
                <button id="script-save-btn" onclick="saveScript()" data-i18n="script_save_btn">💾 Save script</button>
            </div>
        </div>
    </div>

    <!-- Горизонтальный ресайзер и нижняя панель Output (после main) -->
    <div class="resizer-h" id="resizer-h"></div>
    <div id="bottom-panel">
        <div id="output-header">
            <span>Output</span>
            <select id="output-filter" onchange="renderLuaOutput()" title="Фильтр по среде выполнения">
                <option value="all">Все</option>
                <option value="Script">🖥️ Server</option>
                <option value="LocalScript">💻 Client</option>
            </select>
            <button onclick="clearLuaOutput()" title="Clear">🗑</button>
        </div>
        <div id="output-content"></div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content" class="modal"></div>
    </div>
    <div id="notify"></div>


    <!-- CodeMirror 6, единым офлайн-бандлом (см. entry.mjs/rollup.config.mjs
         в репозитории — собирается через rollup из официальных пакетов
         @codemirror/*, вместо CDN-зависимости). Раньше здесь было 4 отдельных
         файла CM5 (ядро + режим Lua + два аддона) — CM6 такой же блокирующий
         <script>, но один: cmEditor создаётся в DOMContentLoaded-колбэке чуть
         ниже, так что достаточно, чтобы бандл успел выполниться до этого
         события (обычный порядковый <script> это и так гарантирует). -->
    <script src="vendor/cm6-bundle.min.js"></script>


    <script src="script.js"></script>
    <!-- show-hint.min.js/lua-hint.js (CodeMirror 5 addon) больше не нужны —
         автодополнение теперь встроено в CM6-бандл (@codemirror/autocomplete),
         см. entry.mjs. -->
</body>

</html>
