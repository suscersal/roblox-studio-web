<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Roblox Studio Mobile</title>

    <script>
        // ВРЕМЕННАЯ ДИАГНОСТИКА (нет доступа к консоли разработчика) —
        // ловим ЛЮБУЮ необработанную ошибку JS где угодно на странице.
        // Если что-то падает при первой загрузке скрипта, это может тихо
        // остановить выполнение остального кода (в т.ч. не даст
        // определиться функции openFileBrowser) — и тогда клик по кнопке
        // не будет делать вообще ничего, без единого алерта из самой
        // функции. Этот перехватчик покажет такую ошибку.
        window.addEventListener('error', function (e) {
            alert('DEBUG GLOBAL ERROR: ' + e.message +
                '\n' + (e.filename || '') + ':' + e.lineno + ':' + e.colno);
        });
    </script>

    <!-- vendor/*.css — локальные копии, скачанные один раз setup_termux.sh
         (см. корень проекта). После setup.sh приложение работает без сети
         вообще; если запускать без setup.sh (например, сразу с ПК), эти
         файлы можно заменить обратно на CDN-ссылки. -->
    <!-- CodeMirror 5 CSS больше не нужен — CM6 задаёт свою тему целиком через
         JS (EditorView.theme(...) в entry.mjs), никаких отдельных .css файлов
         подключать не требуется. -->





    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #111827;
            color: #fff;
            font-family: system-ui, sans-serif;
            height: 100vh;
            /* фолбэк для браузеров без поддержки dvh */
            height: 100dvh;
            /* 100vh на мобильных — это ВСЯ layout-высота,
            включая область под виртуальной клавиатурой; когда клавиатура
            открывается, эта высота не уменьшается сама, и вместе с
            overflow:hidden ниже получается "экран уплывает" — браузер
            пытается докрутить фокус в контейнер, который по факту больше
            видимой области. 100dvh — современная единица, которая САМА
            учитывает открытую клавиатуру (уменьшается вместе с видимой
            областью), без единой строчки JS. */
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        #toolbar-top {
            background: #1f2937;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            height: 40px;

            border-bottom: 1px solid #374151;
            overflow-x: auto

        #toolbar-top button {

            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap
        }

        #toolbar-top button:hover {
            background: #4b5563
        }

        #toolbar-top button.green {
            background: #065f46
        }

        #toolbar-top button.red {
            background: #7f1d1d
        }

        #toolbar-top button.blue {
            background: #1e3a8a
        }

        #toolbar-top button.purple {
            background: #7c3aed
        }

        #toolbar-top .sep {
            width: 1px;
            height: 24px;
            background: #374151;
            margin: 0 4px
        }

        #toolbar-top .title {
            font-weight: bold;
            margin-right: 8px;
            font-size: 14px;
            white-space: nowrap
        }

        @media (max-width: 700px) {

                flex-wrap: wrap;
                height: auto;
                overflow-x: visible;
                padding: 4px 6px
            }

            #toolbar-top .title {

        #main {

        }

        #explorer-header {

            align-items: center
        }

        #explorer-header button {

        }

        /* ============ GUI overlay (ScreenGui/Frame/TextLabel/... в Play) ============ */
        #gui-overlay {

            inset: 0;
            overflow: hidden;
            pointer-events: none;
            display: none;

        #gui-overlay.active {

        .rbx-gui-el {

            box-sizing: border-box;

            align-items: center;
            justify-content: center;
            overflow: hidden;
            white-space: pre-wrap;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            pointer-events: none;
        }

        /* ScreenGui/BillboardGui — организационные full-screen контейнеры,
           не визуальные элементы (в настоящем Roblox сами по себе клики
           никогда не блокируют, блокируют только их GuiObject-потомки).
           Раньше pointer-events:auto по ошибке повесили на БАЗОВЫЙ класс
           целиком, включая эти корни — из-за чего ЛЮБОЙ другой, даже
           пустой в этом месте экрана, но Enabled=true ScreenGui, если он
           стоял позже по DOM/z-order, перехватывал клики по ВСЕЙ площади
           экрана, включая совершенно другое меню под ним (см. диагностику
           Playwright: "<div ... data-cls="ScreenGui"> intercepts pointer
           events" — Играть/Прослушать не срабатывали именно поэтому).
           Включаем auto только настоящим GuiObject'ам. */
        .rbx-gui-el[data-cls="Frame"],
        .rbx-gui-el[data-cls="ScrollingFrame"],
        .rbx-gui-el[data-cls="TextLabel"],
        .rbx-gui-el[data-cls="TextButton"],
        .rbx-gui-el[data-cls="TextBox"],
        .rbx-gui-el[data-cls="ImageLabel"],
        .rbx-gui-el[data-cls="ImageButton"] {
            pointer-events: auto;
        }

        .rbx-gui-el[data-cls="TextButton"],
        .rbx-gui-el[data-cls="ImageButton"] {
            cursor: pointer;
        }

        #vp-label {
            display: none; /* подсказка по ЛКМ/ПКМ/WASD убрана по просьбе — загораживала GUI-оверлей снизу */
        }

        #fps-counter {

            top: 8px;
            left: 8px;
            font-size: 11px;
            color: #22c55e;

            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 5;

        /* Плавающая кнопка Stop поверх вьюпорта во время Play — просили
           убрать верхний тулбар целиком (Explorer/Properties и так уже
           сворачиваются, но САМ тулбар с обычными кнопками редактора всё
           ещё съедал строку высоты, а Stop в нём — единственное, что
           реально нужно в Play). Иконка вместо текста — компактнее, чем
           целая кнопка "⏹ Stop" из тулбара. */
        #play-stop-fab {
            display: none;
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 6;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #ef4444;
            color: #fff;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
        }

        #play-stop-fab.visible {

            justify-content: center;
        }

        #viewport.play-active #fps-counter {

        }

        #speed-indicator {

            right: 8px;

        }

        /* Раньше стик нужно было ловить пальцем ровно в границах круга
           112px — на телефоне, когда не смотришь на большой палец, это
           стабильно промахивается. Теперь есть широкая невидимая зона
           #joy-zone (выше и вокруг круга), и стик "всплывает" туда, куда
           реально попал палец, а не наоборот. */
        #joy-zone {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 112px;
            height: 240px;
            pointer-events: all;
            touch-action: none;
        }

        #joy-base {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: rgba(31, 41, 55, 0.55);
            border: 1px solid #4b5563;
            position: absolute;
            left: 0;
            bottom: 0;
            pointer-events: none;
            touch-action: none;
        }

        #joy-thumb {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.85);
            border: 1px solid #93c5fd;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .pad-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            pointer-events: all;
            /* joy-base/joy-zone больше не в потоке flex (position:absolute),
               поэтому место под них резервируем отступом вручную: 112px
               (диаметр) + 14px (тот же gap, что был у #mobile-pad раньше) */
            margin-left: 126px;
        }

        .pad-btn {
            width: 52px;
            height: 52px;
            background: rgba(31, 41, 55, 0.85);
            border: 1px solid #4b5563;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center

        // Language auto-detection: browser language first (navigator.languages,
        // falling back to navigator.language), with an optional manual override
        // saved in localStorage (e.g. localStorage.setItem('rbxstudio-lang','ru')).
        // Unknown languages fall back to English.
        function detectLang() {
            try {
                const saved = localStorage.getItem('rbxstudio-lang');
                if (saved && I18N[saved]) return saved;
            } catch (e) { }
            const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
            for (const l of langs) {
                const short = (l || '').slice(0, 2).toLowerCase();
                if (I18N[short]) return short;
            }
            return 'en';
        }
        const LANG = detectLang();

        function t(key, vars) {
            let s = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : (I18N.en[key] != null ? I18N.en[key] : key);
            if (vars) {
                for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
            }
            return s;
        }

        function applyStaticI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });

        // UMD-версии (не ES-модули), вешают THREE.OBJLoader/THREE.MTLLoader
        // на уже загруженный глобальный THREE.
        let _objMtlLoadersPromise = null;
        function ensureObjMtlLoaders() {
            if (_objMtlLoadersPromise) return _objMtlLoadersPromise;
            _objMtlLoadersPromise = new Promise((resolve, reject) => {
                const pairs = [
                    ['vendor/MTLLoader.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js'],
                    ['vendor/OBJLoader.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js'],
                ];
                let remaining = pairs.length;
                pairs.forEach(([local, cdn]) => {
                    const s = document.createElement('script');
                    s.src = local;
                    s.onload = () => { if (--remaining === 0) resolve(); };
                    s.onerror = () => {
                        const fb = document.createElement('script');
                        fb.src = cdn;
                        fb.onload = () => { if (--remaining === 0) resolve(); };
                        fb.onerror = () => reject(new Error('Не удалось загрузить ' + cdn));
                        document.head.appendChild(fb);
                    };
                    document.head.appendChild(s);
                });
            });
            return _objMtlLoadersPromise;
        }

            // === Горизонтальный ресайзер (мышь) ===
            const hResizer = document.getElementById('resizer-h');
            if (hResizer) {
                let startY = 0, startHeight = 0;
                hResizer.addEventListener('mousedown', (e) => {
                    hResizer.classList.add('active');

                document.addEventListener('mousemove', (e) => {
                    if (!hResizer.classList.contains('active')) return;

                    panel.style.height = newH + 'px';

                document.addEventListener('mouseup', () => {

                        document.body.style.userSelect = '';

                            localStorage.setItem('rbxstudio-bottom-height', document.getElementById('bottom-panel').offsetHeight);
                        } catch (e) { }
                    }
                });

                // === Горизонтальный ресайзер (touch) ===
                hResizer.addEventListener('touchstart', (e) => {
                    hResizer.classList.add('active');
                    startY = e.touches[0].clientY;
                    startHeight = document.getElementById('bottom-panel').offsetHeight;
                    document.body.style.userSelect = 'none';
                }, { passive: true });

                document.addEventListener('touchmove', (e) => {
                    if (!hResizer.classList.contains('active')) return;
                    const panel = document.getElementById('bottom-panel');
                    let newH = startHeight + (startY - e.touches[0].clientY);
                    newH = Math.max(80, Math.min(window.innerHeight * 0.6, newH));

            // === Общие обработчики для вертикальных ресайзеров (mousemove/mouseup) ===
            document.addEventListener('mousemove', (e) => {

                    let w = Math.max(150, Math.min(400, startWidth + e.clientX - startX));
                    document.getElementById('explorer').style.width = w + 'px';
                } else if (currentResizer.id === 'resizer-2') {
                    let w = Math.max(200, Math.min(500, startRightWidth + startX - e.clientX));
                    document.getElementById('rightpanel').style.width = w + 'px';
                }
                refreshCM();
                resize();

            document.addEventListener('mouseup', () => {

            // === Touch-поддержка для вертикальных ресайзеров ===
            resizers.forEach(resizer => {

                    resizer.classList.add('active');

                }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!currentResizer) return;
                if (currentResizer.id === 'resizer-1') {
                    let w = Math.max(150, Math.min(400, startWidth + e.touches[0].clientX - startX));
                    document.getElementById('explorer').style.width = w + 'px';
                } else if (currentResizer.id === 'resizer-2') {
                    let w = Math.max(200, Math.min(500, startRightWidth + startX - e.touches[0].clientX));
                    document.getElementById('rightpanel').style.width = w + 'px';
                }
                refreshCM();
                resize();
            }, { passive: true });

            document.addEventListener('touchend', () => {
                if (currentResizer) {
                    currentResizer.classList.remove('active');
                    currentResizer = null;
                    document.body.style.userSelect = '';
                    saveLayout();
                }
            });
        }

        function maybeReloadNearby(now) {
            if (isPlaying) return; // у Play своя отдельная подгрузка вокруг персонажа
            if (now - lastCameraUpdate < CAMERA_UPDATE_INTERVAL) return;
            const moved = lastReloadTarget.x === null
                ? Infinity
                : Math.hypot(target.x - lastReloadTarget.x, target.y - lastReloadTarget.y, target.z - lastReloadTarget.z);
            const threshold = (qualitySettings.renderDistance || 300) * 0.25;

        // ============ THREE.JS INIT ============

            });
            // ФИКС ЧЁТКОСТИ НА ТЕЛЕФОНЕ: раньше pixelRatio был жёстко = 1,
            // независимо от реальной плотности пикселей экрана. На ПК
            // (DPR≈1) это почти незаметно, но на телефоне (DPR обычно 2-3)
            // рендер шёл в 2-3 раза ниже реального разрешения экрана и
            // затем растягивался — отсюда "мыло" по сравнению с ПК даже
            // на пресете High. Используем настоящий devicePixelRatio
            // (ограниченный сверху, чтобы не сажать слабые телефоны).
            applyPixelRatio();
            renderer.shadowMap.enabled = qualitySettings.shadows;
            vp.appendChild(renderer.domElement);

            // (SwiftShader/llvmpipe/Google SwiftShader), картинка будет
            // мыльной ВНЕ ЗАВИСИМОСТИ от pixelRatio/anisotropy — это
            // ограничение системы, а не наших настроек качества.
            try {
                const dbgExt = renderer.getContext().getExtension('WEBGL_debug_renderer_info');
                const gpuInfo = dbgExt
                    ? renderer.getContext().getParameter(dbgExt.UNMASKED_RENDERER_WEBGL)

        function initJoystick() {
            const zone = document.getElementById('joy-zone');
            const base = document.getElementById('joy-base');
            const thumb = document.getElementById('joy-thumb');
            if (!zone || !base || !thumb) return;
            const maxR = 30;   // px, максимальный вылет ручки стика от центра base
            const deadZone = 6; // px — маленький дрожащий сдвиг пальца не должен давать ход
            let touchId = null;

            function setThumb(dx, dy) {
                thumb.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
            }

            // "Всплывающий" стик: на touchstart сам круг базы переезжает
            // туда, где реально коснулся палец (по вертикали — зона выше
            // круга специально высокая, ловит палец, куда бы он ни лёг),
            // а не требует от игрока попасть точно в фиксированные 112px.
            function placeBase(clientX, clientY) {
                const zr = zone.getBoundingClientRect();
                // база квадратная 112×112, центрируем её на пальце, но не
                // даём уехать за пределы зоны (иначе стик может вылезти
                // за экран или наехать на кнопки прыжка/спуска)
                const half = 56;
                let localCX = clientX - zr.left;
                let localCY = clientY - zr.top;
                localCX = Math.max(half, Math.min(zr.width - half, localCX));
                localCY = Math.max(half, Math.min(zr.height - half, localCY));
                base.style.left = (localCX - half) + 'px';
                base.style.bottom = (zr.height - localCY - half) + 'px';
            }

            function handleMove(clientX, clientY) {
                const rect = base.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = clientX - cx;
                let dy = clientY - cy;
                const dist = Math.hypot(dx, dy);
                if (dist < deadZone) {
                    setThumb(0, 0);
                    joyVector.x = 0;
                    joyVector.y = 0;
                    return;
                }
                if (dist > maxR) {
                    dx = dx / dist * maxR;
                    dy = dy / dist * maxR;
                }
                setThumb(dx, dy);
                joyVector.x = dx / maxR;
                joyVector.y = -dy / maxR; // тянем вверх по экрану — едем вперёд
            }

            function resetJoy() {
                touchId = null;
                joyVector.x = 0;
                joyVector.y = 0;
                setThumb(0, 0);
                // возвращаем базу в исходный угол зоны для следующего касания
                base.style.left = '0px';
                base.style.bottom = '0px';
            }

            zone.addEventListener('touchstart', e => {
                e.preventDefault();
                e.stopPropagation();
                const t = e.changedTouches[0];
                touchId = t.identifier;
                placeBase(t.clientX, t.clientY);
                handleMove(t.clientX, t.clientY);
            }, { passive: false });

            zone.addEventListener('touchmove', e => {
                e.preventDefault();
                e.stopPropagation();
                for (const t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        handleMove(t.clientX, t.clientY);
                        break;
                    }
                }
            }, { passive: false });

            ['touchend', 'touchcancel'].forEach(ev => zone.addEventListener(ev, e => {
                for (const t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        resetJoy();
                        break;
                    }
                }
            }));
        }

        function updateHelpers() {
            if (window._gridHelper) {
                scene.remove(window._gridHelper);

        // Максимальный DPR, который реально используем. На High
        // разрешаем до 2x — этого достаточно для чёткости и не убивает
        // FPS на большинстве телефонов. На Low/Medium сознательно держим
        // ниже (экономия производительности важнее там).
        function applyPixelRatio() {
            if (!renderer) return;
            const cap = currentQuality === 'high' ? 3 : currentQuality === 'medium' ? 1.5 : 1;
            const dpr = Math.min(window.devicePixelRatio || 1, cap);
            renderer.setPixelRatio(dpr);
        }

        function resize() {
            const vp = document.getElementById('viewport');
            const scale = qualitySettings.resolutionScale;
            const guiOverlayEl = document.getElementById('gui-overlay');
            // В Play зажимаем вьюпорт к 16:9 (letterbox чёрными полосами
            // слева/справа или сверху/снизу — как просили), а не растягиваем
            // на всю доступную площадь #viewport: это не только красивее,
            // но и убирает "прыжки" пропорций GUI-оверлея (там много
            // Position/Size в scale, т.е. в процентах от ширины/высоты)
            // при каждом сворачивании/разворачивании Explorer/Properties
            // или просто на нетипичном соотношении сторон экрана телефона.
            // В режиме редактирования (не Play) поведение старое — вьюпорт
            // занимает всю доступную область, так удобнее двигать камеру
            // и работать с сценой.
            let cssW = vp.clientWidth, cssH = vp.clientHeight, offX = 0, offY = 0;
            if (typeof isPlaying !== 'undefined' && isPlaying) {
                const targetAspect = 16 / 9;
                const boxAspect = vp.clientWidth / Math.max(vp.clientHeight, 1);
                if (boxAspect > targetAspect) {
                    cssH = vp.clientHeight;
                    cssW = Math.floor(cssH * targetAspect);
                } else {
                    cssW = vp.clientWidth;
                    cssH = Math.floor(cssW / targetAspect);
                }
                offX = Math.floor((vp.clientWidth - cssW) / 2);
                offY = Math.floor((vp.clientHeight - cssH) / 2);
            }
            const w = Math.floor(cssW * scale);
            const h = Math.floor(cssH * scale);
            // ВАЖНО: setSize принимает CSS-размер (третий аргумент false —
            // не трогать style самим three.js, стиль задаём вручную ниже).
            // Реальный размер буфера отрисовки = w*pixelRatio x h*pixelRatio,
            // это считает сам renderer — раньше повышенная плотность
            // экрана телефона никак не учитывалась.
            renderer.setSize(w, h, false);
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.left = offX + 'px';
            renderer.domElement.style.top = offY + 'px';
            renderer.domElement.style.width = cssW + 'px';
            renderer.domElement.style.height = cssH + 'px';
            // #gui-overlay обязан покрывать РОВНО ту же область, что и
            // canvas, иначе Position/Size в scale у GUI (проценты) будут
            // считаться от иной, неверной площади, чем то, что реально
            // видно на летербоксед-канвасе.
            if (guiOverlayEl) {
                guiOverlayEl.style.left = offX + 'px';
                guiOverlayEl.style.top = offY + 'px';
                guiOverlayEl.style.width = cssW + 'px';
                guiOverlayEl.style.height = cssH + 'px';
                guiOverlayEl.style.right = '';
                guiOverlayEl.style.bottom = '';
            }
            if (camera) {
                camera.aspect = w / Math.max(h, 1);
                camera.updateProjectionMatrix();
            }
        }

        // ============ АНИМАЦИЯ ============
        function animate() {
            requestAnimationFrame(animate);

            fpsFrames++;
            const now = performance.now();
            if (now - fpsTime >= 1000) {
                currentFPS = Math.round(fpsFrames / ((now - fpsTime) / 1000));
                // ВРЕМЕННАЯ ДИАГНОСТИКА: реальный pixelRatio, физическое
                // разрешение canvas-буфера и максимальная анизотропия,
                // которую отдаёт GPU/драйвер устройства. Нужно, чтобы
                // понять, действительно ли на телефоне применяются наши
                // фиксы, или там что-то ограничивает их на уровне
                // WebView/GPU. Уберите после диагностики.
                const _dbgPR = renderer ? renderer.getPixelRatio() : '?';
                const _dbgSize = renderer ? renderer.getSize(new THREE.Vector2()) : { x: '?', y: '?' };
                const _dbgAniso = renderer ? renderer.capabilities.getMaxAnisotropy() : '?';
                // Раньше тут был Object.keys(sceneObjs).length — общий
                // размер словаря мешей, включая те, что сейчас скрыты
                // (visible=false) стрим-обрезкой. Это вводило в заблуждение:
                // счётчик не падал после ужатия видимого набора, хотя
                // реально рисуется куда меньше. Считаем именно видимые.
                let _visibleObjCount = 0;
                for (const _m of Object.values(sceneObjs)) {
                    if (_m.visible) _visibleObjCount++;
                }
                document.getElementById('fps-counter').textContent = 'FPS: ' + currentFPS + ' | ' + _visibleObjCount + ' obj' +
                    ' | PR:' + _dbgPR + ' | buf:' + Math.round(_dbgSize.x * _dbgPR) + 'x' + Math.round(_dbgSize.y * _dbgPR) +
                    ' | aniso:' + _dbgAniso + (isPlaying ? (' | loaded:' + Object.keys(physicsBodies).length) : '');
                fpsFrames = 0;
                fpsTime = now;
            }

            // WASD + аналоговый стик — свободный полёт камеры (только в режиме
            // редактирования; во время Play движением управляет 'тело' персонажа)
            if (!isPlaying) {
                const forward = Math.max(-1, Math.min(1,
                    (keysPressed['w'] ? 1 : 0) - (keysPressed['s'] ? 1 : 0) + joyVector.y));
                const strafe = Math.max(-1, Math.min(1,
                    (keysPressed['d'] ? 1 : 0) - (keysPressed['a'] ? 1 : 0) + joyVector.x));
                const vertical = (keysPressed['e'] ? 1 : 0) - (keysPressed['q'] ? 1 : 0);

                const anyMove = forward !== 0 || strafe !== 0 || vertical !== 0;


                if (anyMove) {


                    const direction = new THREE.Vector3();
                    camera.getWorldDirection(direction);
                    const right = new THREE.Vector3();
                    right.crossVectors(direction, new THREE.Vector3(0, 1, 0)).normalize();
                    speed = moveSpeed * (spherical.r / 30) * 0.25;
                    //acseration надо в правильный переменовать;
                    if (forward) {
                        acseration = acseration + 0.1;
                        if (acseration > 1) {
                            speed = speed + acseration / 50
                        }
                    }
                    if (now - time_move > 100) {
                        acseration = 0;
                    }
                    time_move = now



                    target.x += direction.x * speed * forward + right.x * speed * strafe;
                    target.z += direction.z * speed * forward + right.z * speed * strafe;
                    target.y += speed * vertical;

                    updateCamera();
                    maybeReloadNearby(now);
                }
            }

            stepPhysics();
            renderer.render(scene, camera);
        }

        let thirdPerson = false; // true — камера позади куба-персонажа, не в глазах
        const THIRD_PERSON_DIST = 12;

        function updateCamera() {
            const { theta, phi } = spherical;
            const dirX = Math.sin(phi) * Math.sin(theta);
            const dirY = Math.cos(phi);
            const dirZ = Math.sin(phi) * Math.cos(theta);
            if (isPlaying && thirdPerson) {
                // dir — направление "назад" (см. lookAt ниже в ветке от первого
                // лица: смотрим в target-dir, значит dir и есть "за спиной") —
                // отходим по нему от персонажа и смотрим на него.
                camera.position.set(target.x + dirX * THIRD_PERSON_DIST, target.y + dirY * THIRD_PERSON_DIST, target.z + dirZ * THIRD_PERSON_DIST);
                camera.lookAt(target.x, target.y, target.z);
            } else {
                // Камера от первого лица: позиция глаза = target,
                // смотрим в направлении, заданном theta/phi (без отступа на радиус r)
                camera.position.set(target.x, target.y, target.z);
                camera.lookAt(target.x - dirX, target.y - dirY, target.z - dirZ);
            }
            updateCharMeshVisibility();
        }

        function toggleThirdPerson() {
            thirdPerson = !thirdPerson;
            updateCamera();
            notify(thirdPerson ? '3-е лицо' : '1-е лицо (от глаз)');
        }

        // ============ ПРЕСЕТЫ КАМЕРЫ ============
        function resetCamera() {
            spherical = { theta: Math.PI / 4, phi: Math.PI / 3, r: 30 };
            target = { x: 0, y: 2, z: 0 };
            updateCamera();
            notify(t('notify_camera_reset'));
        }

        function topView() {
            spherical = { theta: 0, phi: 0.01, r: spherical.r };
            updateCamera();
            notify(t('notify_topview'));
        }

        function frontView() {
            spherical = { theta: 0, phi: Math.PI / 2, r: spherical.r };
            updateCamera();
            notify(t('notify_frontview'));
        }

        function rightView() {
            spherical = { theta: Math.PI / 2, phi: Math.PI / 2, r: spherical.r };
            updateCamera();
            notify(t('notify_rightview'));
        }

        // Телепорт камеры редактора к выбранному в Explorer объекту —
        // раньше единственный способ найти конкретную часть в 3D (камеры
        // MenuCamera, точки ThumbnailCameraValue и т.п. в fnf.rbxl,
        // разбросанные по сцене) был вручную крутить/таскать камеру,
        // пока не наткнёшься. sceneObjs[ref] — тот же THREE-объект, на
        // который уже опирается подсветка выделения (BoxHelper чуть
        // выше по файлу), так что позиция гарантированно совпадает с тем,
        // что реально нарисовано.
        function teleportCameraToSelected() {
            if (selectedRef === null || !sceneObjs[selectedRef]) {
                notify(t('notify_teleport_no_selection'), 'warn');
                return;
            }
            const pos = sceneObjs[selectedRef].position;
            target = { x: pos.x, y: pos.y, z: pos.z };
            if (spherical.r > 25) spherical.r = 20;
            updateCamera();
            notify(t('notify_teleported'));
        }

        // ============ МЫШЬ ============
        function onMD(e) {
            isDragging = false;
            prevMouse = { x: e.clientX, y: e.clientY };
        }

        function onMM(e) {
            if (!e.buttons) return;
            if (isPlaying && luaControlsDisabled) return; // PlayerModule:GetControls():Disable() — камера тоже не должна крутиться

            const dx = e.clientX - prevMouse.x;
            const dy = e.clientY - prevMouse.y;
            prevMouse = { x: e.clientX, y: e.clientY };

            if (Math.abs(dx) + Math.abs(dy) > 3) {
                isDragging = true;
            }

            if (e.buttons === 1) {
                spherical.theta -= dx * .005;
                spherical.phi = Math.max(.05, Math.min(Math.PI - .05, spherical.phi - dy * .005));
            } else if (e.buttons === 2 || e.buttons === 4) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                const right = new THREE.Vector3();
                right.crossVectors(direction, new THREE.Vector3(0, 1, 0)).normalize();
                const up = new THREE.Vector3();
                up.crossVectors(right, direction).normalize();

                const panSpeed = spherical.r * 0.002;
                target.x -= right.x * dx * panSpeed + up.x * dy * panSpeed;
                target.y -= up.y * dy * panSpeed;
                target.z -= right.z * dx * panSpeed + up.z * dy * panSpeed;
                maybeReloadNearby(performance.now());
            }

            updateCamera();
        }

        function onMU(e) {
            if (!isDragging && e.button === 0) {
                pick(e.clientX, e.clientY);
            }
        }

        function onWh(e) {
            e.preventDefault();

            if (e.shiftKey) {
                moveSpeed = Math.max(0.1, Math.min(10, moveSpeed - e.deltaY * 0.01));
                const indicator = document.getElementById('speed-indicator');
                indicator.textContent = '🚀 x' + moveSpeed.toFixed(1);
                indicator.style.display = 'block';
                clearTimeout(window._speedTimeout);
                window._speedTimeout = setTimeout(() => {
                    indicator.style.display = 'none';
                }, 1500);
                return;
            }

            // r больше не двигает камеру (вид от 1-го лица), но всё ещё
            // задаёт дальность подгрузки сцены и скорость панорамирования
            spherical.r = Math.max(1, Math.min(500, spherical.r + e.deltaY * .05));
        }

        // ============ ТАЧ ============
        let _tch = [];
        let _td = 0;
        let _ts = null;

        function onTS(e) {
            e.preventDefault();
            // targetTouches — только касания НА ЭТОМ элементе (вьюпорт).
            // e.touches — все касания на странице сразу, включая палец на
            // джойстике (другой DOM-элемент) — из-за этого при игре двумя
            // пальцами (джойстик + поворот камеры) вьюпорт видел "2 касания"
            // и вместо поворота включал pinch-zoom, а после отпускания
            // состояние _tch оставалось рассинхронизировано с реальными
            // пальцами — движение переставало отвечать.
            _tch = Array.from(e.targetTouches);
            _ts = _tch[0] ? { x: _tch[0].clientX, y: _tch[0].clientY } : null;
            if (e.targetTouches.length === 2) {
                const dx = e.targetTouches[0].clientX - e.targetTouches[1].clientX;
                const dy = e.targetTouches[0].clientY - e.targetTouches[1].clientY;
                _td = Math.sqrt(dx * dx + dy * dy);
            }
        }

        function onTM(e) {
            e.preventDefault();
            if (isPlaying && luaControlsDisabled) return; // PlayerModule:GetControls():Disable() — та же блокировка, что и для мыши (onMM)
            if (e.targetTouches.length === 1) {
                const t = e.targetTouches[0];
                if (!_tch[0]) { _tch = [t]; return; }
                const dx = t.clientX - _tch[0].clientX;
                const dy = t.clientY - _tch[0].clientY;
                _tch = Array.from(e.targetTouches);
                spherical.theta -= dx * .005;
                spherical.phi = Math.max(.05, Math.min(Math.PI - .05, spherical.phi - dy * .005));
                updateCamera();
            } else if (e.targetTouches.length === 2) {
                const dx = e.targetTouches[0].clientX - e.targetTouches[1].clientX;
                const dy = e.targetTouches[0].clientY - e.targetTouches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                spherical.r = Math.max(1, Math.min(500, spherical.r + (dist - _td) * .05));
                _td = dist;
                _tch = Array.from(e.targetTouches);
                updateCamera();
            }
        }

        function onTE(e) {
            if (e.changedTouches.length === 1 && _ts) {
                const t = e.changedTouches[0];
                if (Math.abs(t.clientX - _ts.x) < 8 && Math.abs(t.clientY - _ts.y) < 8) {
                    pick(t.clientX, t.clientY);
                }
            }
        }

        // ============ ИСПРАВЛЕННЫЙ PICK ============
        function pick(cx, cy) {
            const vp = document.getElementById('viewport');
            const rect = vp.getBoundingClientRect();
            mouse.x = ((cx - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((cy - rect.top) / rect.height) * 2 + 1;

            // Пересоздаем raycaster если нужно
            if (!raycaster) {
                raycaster = new THREE.Raycaster();
                raycaster.params.Points.threshold = 0.1;
                raycaster.params.Line.threshold = 0.1;
            }

            raycaster.setFromCamera(mouse, camera);

            // Обновляем кеш объектов для raycasting
            const now = performance.now();
            let objectsToCheck;

            if (now - raycasterCache.lastUpdate > raycasterCache.updateInterval) {
                raycasterCache.objects = Object.values(sceneObjs);
                raycasterCache.lastUpdate = now;
            }
            objectsToCheck = raycasterCache.objects;

            // Для low/medium с большим количеством объектов - оптимизация
            if (currentQuality !== 'high' && objectsToCheck.length > 2000) {
                objectsToCheck = objectsToCheck
                    .map(obj => ({
                        obj: obj,
                        dist: obj.position.distanceToSquared(camera.position)
                    }))
                    .sort((a, b) => a.dist - b.dist)
                    .slice(0, 2000)
                    .map(item => item.obj);
            }

            // recursive: true — обычным Mesh'ам без детей это ничего не
            // стоит, а импортированным аватарам (THREE.Group из OBJLoader,
            // без собственной геометрии) необходимо, иначе луч не попадает
            // ни во что и клик по аватару не выбирает его вообще.
            const hits = raycaster.intersectObjects(objectsToCheck, true);

            if (hits.length) {
                // У аватара userData.ref есть только на корневой Group —
                // у её дочерних мешей (реальная цель попадания луча при
                // recursive:true) его нет, поэтому поднимаемся по родителям
                // до первого объекта с userData.ref.
                let obj = hits[0].object;
                while (obj && !(obj.userData && obj.userData.ref)) {
                    obj = obj.parent;
                }
                if (obj && obj.userData && obj.userData.ref) {
                    selectRef(parseInt(obj.userData.ref));
                    return;
                }
            }

            deselect();
        }

        // Геометрия WedgePart (клин/скат). Конвенция Roblox: BackSurface — это +Z
        // (полная прямоугольная грань), FrontSurface — -Z (высота сходится в ребро).
        function makeWedgeGeometry(sx, sy, sz) {
            const hx = sx / 2, hy = sy / 2, hz = sz / 2;
            const BBL = [-hx, -hy, hz], BBR = [hx, -hy, hz];
            const BTL = [-hx, hy, hz], BTR = [hx, hy, hz];
            const FBL = [-hx, -hy, -hz], FBR = [hx, -hy, -hz];
            const tris = [
                BBL, BTR, BTL,   // задняя грань (полная, +Z)
                BBL, BBR, BTR,
                BBL, FBL, FBR,   // низ
                BBL, FBR, BBR,
                BBL, BTL, FBL,   // левая треугольная грань
                BBR, FBR, BTR,   // правая треугольная грань
                BTL, FBR, FBL,   // скат
                BTL, BTR, FBR,
            ];
            const positions = new Float32Array(tris.length * 3);
            tris.forEach((v, i) => positions.set(v, i * 3));
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.computeVertexNormals();
            return geo;
        }

        // ============ ЗАГРУЗКА РЕАЛЬНОЙ ГЕОМЕТРИИ MeshPart/SpecialMesh(FileMesh) ============
        // Раньше MeshId (MeshPart.MeshId / дочерний SpecialMesh.MeshId при
        // MeshType.FileMesh — см. _extract_real_mesh_id в app.py) вообще не
        // подгружался как геометрия: часть ВСЕГДА рисовалась как bounding-box
        // её Size (см. buildMeshFromObj ниже) — отсюда "меши не грузятся" и
        // "текстура криво легла" (клеилась на box-приближение вместо
        // настоящей формы с её настоящими UV). Парсим бинарный .mesh Roblox
        // прямо в браузере через тот же /api/asset-proxy, что и для
        // картинок/звука — просто как ArrayBuffer вместо Image/Audio.
        //
        // Поддержаны версии:
        //  - "1.00" — древний ASCII-формат: header "version 1.00", число
        //    граней, затем по 3 вершины на грань (без индексного буфера),
        //    каждая вершина — [x,y,z][nx,ny,nz][u,v,0].
        //  - "2.00"/"3.00" — бинарный формат: header из известных полей
        //    (sizeof_MeshHeader/sizeof_MeshVertex/sizeof_MeshFace/numVerts/
        //    numFaces), массив вершин с шагом sizeof_MeshVertex (первые 32
        //    байта каждой всегда position(12)+normal(12)+uv(8) независимо
        //    от версии — остальное, tangent/vertex-color, не нужно для
        //    геометрии и намеренно пропускается), затем массив граней —
        //    sizeof_MeshFace=12 (3×uint32 индекса).
        //  - "4.00"/"5.00" (риг/LOD, другой макет заголовка с костями) —
        //    НЕ поддержаны: это либо скиннинг-меши персонажей (уже покрыты
        //    отдельным путём импорта аватара через OBJ), либо структура,
        //    которую нельзя честно угадать без проверки на живом
        //    Roblox CDN (недоступен из песочницы сборки) — явный fallback
        //    на bounding-box с предупреждением в Output honestly лучше, чем
        //    тихо собранная из неверных офсетов геометрия.
        const _meshGeometryCache = {}; // meshId -> Promise<{geometry, size}|null>

        function _parseRobloxMeshV1(text) {
            const nums = text.match(/-?[\d.]+(?:[eE][-+]?\d+)?/g);
            if (!nums || nums.length < 2) return null;
            const numFaces = parseInt(nums[0], 10);
            if (!numFaces) return null;
            const coords = nums.slice(1).map(Number);
            const need = numFaces * 3 * 9; // 3 вершины/грань × (pos3+norm3+uv3)
            if (coords.length < need) return null;
            const positions = new Float32Array(numFaces * 9);
            const normals = new Float32Array(numFaces * 9);
            const uvs = new Float32Array(numFaces * 6);
            let ci = 0, pi = 0, ni = 0, ui = 0;
            for (let f = 0; f < numFaces; f++) {
                for (let v = 0; v < 3; v++) {
                    positions[pi++] = coords[ci++]; positions[pi++] = coords[ci++]; positions[pi++] = coords[ci++];
                    normals[ni++] = coords[ci++]; normals[ni++] = coords[ci++]; normals[ni++] = coords[ci++];
                    uvs[ui++] = coords[ci++]; uvs[ui++] = 1 - coords[ci++]; ci++; // третье число UV-тройки не используется; V инвертирован — см. коммент у бинарного парсера
                }
            }
            return { positions, normals, uvs, indices: null };
        }

        function _parseRobloxMeshBinary(buf) {
            const dv = new DataView(buf);
            let off = 0;
            const sizeofHeader = dv.getUint16(off, true); off += 2;
            const sizeofVertex = dv.getUint16(off, true); off += 2;
            const sizeofFace = dv.getUint16(off, true); off += 2;
            off += 2; // паддинг перед numVerts(uint32) до 4-байтного выравнивания
            const numVerts = dv.getUint32(off, true); off += 4;
            const numFaces = dv.getUint32(off, true); off += 4;
            if (!numVerts || !numFaces || sizeofVertex < 32 || sizeofFace !== 12) return null;
            const vertOff = sizeofHeader > 0 ? sizeofHeader : off;
            const positions = new Float32Array(numVerts * 3);
            const normals = new Float32Array(numVerts * 3);
            const uvs = new Float32Array(numVerts * 2);
            for (let i = 0; i < numVerts; i++) {
                const base = vertOff + i * sizeofVertex;
                if (base + 32 > buf.byteLength) return null;
                positions[i * 3] = dv.getFloat32(base, true);
                positions[i * 3 + 1] = dv.getFloat32(base + 4, true);
                positions[i * 3 + 2] = dv.getFloat32(base + 8, true);
                normals[i * 3] = dv.getFloat32(base + 12, true);
                normals[i * 3 + 1] = dv.getFloat32(base + 16, true);
                normals[i * 3 + 2] = dv.getFloat32(base + 20, true);
                uvs[i * 2] = dv.getFloat32(base + 24, true);
                // Roblox хранит V сверху-вниз, Three.js/OpenGL — снизу-вверх;
                // без переворота текстура на реальном меше встаёт вверх ногами.
                uvs[i * 2 + 1] = 1 - dv.getFloat32(base + 28, true);
            }
            const faceOff = vertOff + numVerts * sizeofVertex;
            const indices = new Uint32Array(numFaces * 3);
            for (let i = 0; i < numFaces; i++) {
                const base = faceOff + i * sizeofFace;
                if (base + 12 > buf.byteLength) return null;
                indices[i * 3] = dv.getUint32(base, true);
                indices[i * 3 + 1] = dv.getUint32(base + 4, true);
                indices[i * 3 + 2] = dv.getUint32(base + 8, true);
            }
            return { positions, normals, uvs, indices };
        }

        function _buildGeometryFromParsed(parsed) {
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(parsed.positions, 3));
            geo.setAttribute('normal', new THREE.BufferAttribute(parsed.normals, 3));
            geo.setAttribute('uv', new THREE.BufferAttribute(parsed.uvs, 2));
            if (parsed.indices) geo.setIndex(new THREE.BufferAttribute(parsed.indices, 1));
            if (!parsed.normals.some(n => n !== 0)) geo.computeVertexNormals();
            geo.computeBoundingBox();
            const bb = geo.boundingBox;
            const size = {
                x: Math.max(0.001, bb.max.x - bb.min.x),
                y: Math.max(0.001, bb.max.y - bb.min.y),
                z: Math.max(0.001, bb.max.z - bb.min.z),
            };
            // Помечаем как разделяемую между несколькими частями с одним
            // MeshId — вызывающий код НЕ должен .dispose() эту геометрию
            // при удалении/пересборке одной конкретной части (см. места,
            // где geometry.dispose() вызывается на mesh-объектах сцены).
            geo.userData.sharedMesh = true;
            return { geometry: geo, size };
        }

        async function loadRealMeshGeometry(meshId) {
            if (_meshGeometryCache[meshId]) return _meshGeometryCache[meshId];
            const p = (async () => {
                try {
                    const resp = await fetch('/api/asset-proxy?id=' + meshId);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const buf = await resp.arrayBuffer();
                    const head = new TextDecoder('ascii').decode(buf.slice(0, 16));
                    const m = /version[ ]?([\d.]+)/i.exec(head);
                    const version = m ? m[1] : null;
                    let parsed = null;
                    if (version === '1.00') {
                        parsed = _parseRobloxMeshV1(new TextDecoder('utf-8').decode(buf));
                    } else if (version === '2.00' || version === '3.00') {
                        // Текстовый заголовок "version X.XX\n" перед бинарной
                        // частью — обрезаем его по первому переводу строки.
                        const nl = new Uint8Array(buf).indexOf(10);
                        parsed = _parseRobloxMeshBinary(buf.slice(nl + 1));
                    } else {
                        logLuaOutput('warn', 'Mesh ' + meshId + ': формат "' + (version || '?') + '" (риг/LOD) пока не поддержан, использую приближение');
                        return null;
                    }
                    if (!parsed) {
                        logLuaOutput('warn', 'Mesh ' + meshId + ': не удалось разобрать файл, использую приближение');
                        return null;
                    }
                    return _buildGeometryFromParsed(parsed);
                } catch (e) {
                    logLuaOutput('warn', 'Mesh ' + meshId + ': загрузка не удалась (' + e.message + '), использую приближение');
                    return null;
                }
            })();
            _meshGeometryCache[meshId] = p;
            return p;
        }

        // Асинхронно подменяет box-приближение на реальную геометрию, когда
        // она подгрузится — сам mesh уже добавлен в сцену со старой
        // геометрией (не блокируем появление объекта на время сетевого
        // запроса). sceneObjs проверяем на момент завершения: если part
        // успели удалить/пересобрать сцену, подменять уже нечего.
        function scheduleRealMeshSwap(o, mesh) {
            loadRealMeshGeometry(o.meshId).then((result) => {
                if (!result) return;
                if (sceneObjs[o.ref] !== mesh) return; // объект уже заменён/удалён
                mesh.geometry = result.geometry;
                // mesh.matrixAutoUpdate=false (см. buildMeshFromObj) — матрица
                // либо голая rotation+position (без поворота), либо честная
                // 3x3-матрица поворота Roblox, но БЕЗ масштаба (тот раньше
                // был запечён прямо в вершины box-геометрии). decompose/
                // compose работает одинаково в обоих случаях и добавляет
                // недостающий масштаб (Size части / собственный размер
                // реального меша), не трогая позицию и поворот.
                const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scale = new THREE.Vector3();
                mesh.matrix.decompose(pos, quat, scale);
                scale.x *= (o.sx || 1) / result.size.x;
                scale.y *= (o.sy || 1) / result.size.y;
                scale.z *= (o.sz || 1) / result.size.z;
                mesh.matrix.compose(pos, quat, scale);
            });
        }

        // ============ ТЕКСТУРЫ ОБЫЧНЫХ ЧАСТЕЙ (Decal/MeshPart/SpecialMesh) ============
        // Глобальный (не per-rebuild, в отличие от geoCache/matCache ниже —
        // те создаются заново на каждую пересборку сцены) кэш по asset id,
        // чтобы одна и та же текстура не качалась с /api/asset-proxy заново
        // при каждом Play/перезаходе в сцену.
        const _partTexCache = {};
        // Раньше THREE.TextureLoader создавался здесь же, на верхнем уровне
        // скрипта — то есть СРАЗУ при разборе этого <script>, ДО того, как
        // гарантированно успевает выполниться сам THREE.js (он подключён
        // отдельным <script src="..."> и не обязательно к этому моменту уже
        // отработал) — "Uncaught ReferenceError: THREE is not defined" при
        // самой загрузке страницы, ещё до всякого Play. Инициализируем
        // лениво, при первом реальном вызове (к этому моменту THREE точно
        // загружен — вся остальная сцена и так на нём держится).
        let _partTexLoader = null;
        function getOrLoadPartTexture(assetId) {
            if (_partTexCache[assetId]) return _partTexCache[assetId];
            if (!_partTexLoader) _partTexLoader = new THREE.TextureLoader();
            const tex = _partTexLoader.load('/api/asset-proxy?id=' + assetId, (loaded) => {
                // Тот же r128-фикс насыщенности, что и у аватаров (см.
                // importAvatarIntoScene) — иначе текстура выглядит блёкло.
                loaded.encoding = THREE.sRGBEncoding;
                loaded.anisotropy = renderer.capabilities.getMaxAnisotropy();
                loaded.needsUpdate = true;
            }, undefined, () => {
                // 3-й колбэк TextureLoader.load — onError, раньше не
                // передавался вообще: неудачная загрузка (плохой ключ/
                // кука, сеть) молча оставляла часть без текстуры —
                // ни строчки в Output.
                logLuaOutput('warn', t('warn_texture_failed', { id: assetId }));
            });
            _partTexCache[assetId] = tex;
            return tex;
        }

        // ============ ИСПРАВЛЕННАЯ СЦЕНА ============
        function buildMeshFromObj(o, geoCache, matCache) {
            const geoKey = o.shape + '_' + (o.sx || 1).toFixed(2) + '_' + (o.sy || 1).toFixed(2) + '_' + (o.sz || 1).toFixed(2);
            if (!geoCache[geoKey]) {
                if (o.shape === 'sphere') {
                    const seg = Math.max(4, qualitySettings.sphereSegments);
                    const radius = Math.max(o.sx || 1, o.sy || 1, o.sz || 1) * 0.5;
                    geoCache[geoKey] = new THREE.SphereGeometry(radius, seg, Math.round(seg * 0.75));
                } else if (o.shape === 'cylinder') {
                    const seg = Math.max(6, qualitySettings.sphereSegments);
                    geoCache[geoKey] = new THREE.CylinderGeometry((o.sx || 1) * 0.5, (o.sz || 1) * 0.5, o.sy || 1, seg);
                } else if (o.shape === 'cone') {
                    const seg = Math.max(6, qualitySettings.sphereSegments);
                    const radius = Math.max(o.sx || 1, o.sz || 1) * 0.5;
                    geoCache[geoKey] = new THREE.ConeGeometry(radius, o.sy || 1, seg);
                } else if (o.shape === 'wedge') {
                    geoCache[geoKey] = makeWedgeGeometry(o.sx || 1, o.sy || 1, o.sz || 1);
                } else {
                    geoCache[geoKey] = new THREE.BoxGeometry(o.sx || 1, o.sy || 1, o.sz || 1, 1, 1, 1);
                }
            }
            const geo = geoCache[geoKey];

            // Текстура — только на "high", как и остальные quality-флаги
            // визуальной детализации (см. QUALITY_PRESETS). На low/medium
            // грузить с сервера картинки на каждую замешенную часть карты
            // того же класса проблем, что решает весь chunk-based стриминг.
            const texId = qualitySettings.textures ? o.texture : null;

            // Decal накладывается РОВНО на одну грань (o.textureFace —
            // Face-свойство самого Decal в файле, см. _extract_part_texture_id
            // в app.py), а не на все 6 сразу. Раньше один и тот же материал
            // с текстурой ставился на ВСЮ BoxGeometry целиком — у неё
            // дефолтный UV каждой грани 0..1 независимо, так что текстура
            // рисовалась растянутой копией на каждой из 6 сторон сразу —
            // "плохо легли текстуры". BoxGeometry.groups идут в порядке
            // +X,-X,+Y,-Y,+Z,-Z; Roblox Enum.NormalId (Right=+X, Left=-X,
            // Top=+Y, Bottom=-Y, Back=+Z, Front=-Z) — переводим строковое
            // имя грани в тот же индекс.
            const FACE_TO_BOX_GROUP = {
                Right: 0, Left: 1, Top: 2, Bottom: 3, Back: 4, Front: 5,
            };
            // meshId (реальная кастомная геометрия, см. scheduleRealMeshSwap
            // ниже) — НЕ box-приближение, даже пока грузится: настоящая
            // форма почти никогда не прямоугольная, класть текстуру на одну
            // "самую большую грань" для неё так же неверно, как на все 6
            // сразу — до подмены геометрии часть просто без текстуры не
            // останется (полноценный map на весь плейсхолдер), а после
            // подмены реальные UV меша лягут как надо.
            const isBoxShape = !o.meshId && (!o.shape || o.shape === 'block' || o.shape === 'box');
            // Decal — своя явная грань (Face), уже вычислена корректно
            // выше. Но MeshPart.TextureID/SpecialMesh.TextureId — это
            // текстура, честно рассчитанная на РЕАЛЬНУЮ форму меша
            // (какая угодно, не бокс) с её собственной UV-развёрткой;
            // мы же вместо настоящей геометрии рисуем bounding-box
            // приближение. Раньше в этом случае текстуру всё равно
            // клеили на ВСЕ 6 граней сразу (тем же дефолтным UV
            // BoxGeometry 0..1 на каждую грань) — для непрямоугольного
            // меша это гарантированно выглядит криво натянутым сразу со
            // всех сторон, как на зажигалке (длинный тонкий бокс + один
            // "плоский" рисунок этикетки). Раз настоящую геометрию меша
            // не грузим, кладём такую текстуру ТОЛЬКО на одну, самую
            // большую по площади грань (обычно она и была основной
            // "лицевой" стороной у автора модели) — заметно ближе к
            // правде, чем текстура на каждой стороне одновременно.
            let implicitFaceIdx = null;
            if (texId && !o.textureFace && isBoxShape) {
                const sx = o.sx || 1, sy = o.sy || 1, sz = o.sz || 1;
                const areaX = sy * sz, areaY = sx * sz, areaZ = sx * sy;
                implicitFaceIdx = (areaX >= areaY && areaX >= areaZ) ? 0
                    : (areaY >= areaZ) ? 2 : 4;
            }
            const faceIdx = (texId && o.textureFace && isBoxShape)
                ? (FACE_TO_BOX_GROUP[o.textureFace] ?? FACE_TO_BOX_GROUP.Front)
                : implicitFaceIdx;

            const baseColor = texId && faceIdx === null ? '#ffffff' : (o.color || '#a0a0a0');
            const matKey = (o.color || '#a0a0a0') + '_' + (o.opacity || 1).toFixed(1) + '_' +
                (faceIdx === null ? (texId || '') : (texId + '_face' + faceIdx));
            if (!matCache[matKey]) {
                const baseOpts = {
                    transparent: (o.opacity || 1) < 1.0,
                    opacity: o.opacity || 1.0,
                    flatShading: currentQuality === 'low',
                };
                if (faceIdx !== null) {
                    // Массив материалов по группам граней BoxGeometry: 5
                    // обычных (цвет part'а, без текстуры) + 1 с текстурой
                    // на нужной грани — ИМЕННО то место, куда в Roblox
                    // кладётся Decal.
                    const plain = new THREE.MeshLambertMaterial({ ...baseOpts, color: o.color || '#a0a0a0' });
                    const textured = new THREE.MeshLambertMaterial({
                        ...baseOpts, color: '#ffffff', map: getOrLoadPartTexture(texId),
                    });
                    const arr = [plain, plain, plain, plain, plain, plain];
                    arr[faceIdx] = textured;
                    matCache[matKey] = arr;
                } else {
                    matCache[matKey] = new THREE.MeshLambertMaterial({
                        ...baseOpts,
                        // Текстуру красим в тон o.color — она бы почти всегда
                        // забивалась им до полной непрозрачной заливки, если
                        // color оставить как есть (получается имитация тона
                        // поверхности без текстуры).
                        color: baseColor,
                        map: texId ? getOrLoadPartTexture(texId) : null,
                    });
                }
            }
            const mat = matCache[matKey];

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(o.px || 0, o.py || 0, o.pz || 0);

            if (o.rot && o.rot.length >= 9) {
                const rm = new THREE.Matrix4();
                // o.rot — row-major [R00,R01,R02, R10,R11,R12, R20,R21,R22],
                // Matrix4.set() тоже принимает аргументы по строкам, поэтому
                // просто передаём подряд, БЕЗ транспонирования.
                rm.set(
                    o.rot[0], o.rot[1], o.rot[2], o.px || 0,
                    o.rot[3], o.rot[4], o.rot[5], o.py || 0,
                    o.rot[6], o.rot[7], o.rot[8], o.pz || 0,
                    0, 0, 0, 1
                );
                mesh.matrix.copy(rm);
                mesh.matrixAutoUpdate = false;
            } else {
                mesh.matrixAutoUpdate = false;
                mesh.updateMatrix();
            }

            mesh.castShadow = qualitySettings.shadows;
            mesh.receiveShadow = qualitySettings.shadows;
            mesh.userData.ref = o.ref;
            mesh.userData.cls = o.class;
            mesh.userData.shape = o.shape;
            mesh.userData.sx = o.sx || 1;
            mesh.userData.sy = o.sy || 1;
            mesh.userData.sz = o.sz || 1;
            mesh.userData.anchoredFlag = !!o.anchored;
            mesh.userData.cancollideFlag = o.cancollide !== false;
            mesh.frustumCulled = true;

            if ((o.opacity || 1) < 1.0) {
                mesh.material.depthWrite = (o.opacity || 1) > 0.7;
            }
            if (o.meshId) scheduleRealMeshSwap(o, mesh);
            return mesh;
        }

        async function reloadScene() {
            if (isPlaying) {
                notify(t('notify_stop_play_first'), 'warn');
                return;
            }
            lastCameraUpdate = performance.now();
            lastReloadTarget = { x: target.x, y: target.y, z: target.z };
            const params = new URLSearchParams({
                cx: Math.round(target.x),
                cy: Math.round(target.y),
                cz: Math.round(target.z),
                r: qualitySettings.renderDistance,
                quality: currentQuality
            });

            const r = await api('GET', '/api/scene?' + params.toString());
            if (!r.ok) return;

            // Очистка старых объектов
            for (const mesh of Object.values(sceneObjs)) {
                scene.remove(mesh);
                // sharedMesh (см. loadRealMeshGeometry/_buildGeometryFromParsed)
                // — одна геометрия по MeshId переиспользуется сразу несколькими
                // частями через _meshGeometryCache; dispose() тут убил бы её
                // для ВСЕХ, включая части, которые продолжают жить дальше.
                if (mesh.geometry && !mesh.geometry.userData.sharedMesh) mesh.geometry.dispose();
                if (mesh.material) {
                    if (Array.isArray(mesh.material)) {
                        mesh.material.forEach(m => {
                            if (m.map) m.map.dispose();
                            m.dispose();
                        });
                    } else {
                        if (mesh.material.map) mesh.material.map.dispose();
                        mesh.material.dispose();
                    }
                }
            }
            sceneObjs = {};

            // Сбрасываем кеш raycasting
            raycasterCache.objects = [];
            raycasterCache.lastUpdate = 0;

            if (window._selBox) {
                scene.remove(window._selBox);
                window._selBox = null;
            }

            // Кеши геометрий и материалов
            const geoCache = {};
            const matCache = {};

            let objects = r.objects;
            let totalAvailable = r.total || objects.length;

            // Применяем лимиты качества
            if (qualitySettings.maxObjects && objects.length > qualitySettings.maxObjects) {
                if (currentQuality === 'high') {
                    const maxHighObjects = Math.min(objects.length, 10000);
                    objects = objects.slice(0, maxHighObjects);
                } else {
                    objects = objects.slice(0, qualitySettings.maxObjects);
                }
            }

            for (const o of objects) {
                // Импортированные 3D-аватары — не обычные Part/MeshPart,
                // которые сервер умеет описывать через props (Size/Color
                // и т.п.) — геометрия целиком живёт только в браузере
                // (см. importAvatarIntoScene). Поэтому вместо обычной
                // пересборки меша из свойств инстанса переиспользуем уже
                // готовый THREE.Group из кэша — иначе аватар превращался
                // бы обратно в обычный кубик при каждом reloadScene()
                // (а его вызывает даже простое движение камеры).
                const cached = window._avatarMeshCache && window._avatarMeshCache[o.ref];
                const mesh = cached ? cached.object : buildMeshFromObj(o, geoCache, matCache);
                if (cached) {
                    // Геометрия закэширована и не перестраивается, но
                    // Position/Rotation инстанса могли поменяться (правка в
                    // панели свойств) — без этого синка аватар навсегда
                    // оставался бы в точке первого импорта, несмотря на
                    // сохранённые на сервере новые координаты.
                    mesh.position.set(o.px || 0, o.py || 0, o.pz || 0);
                    if (o.rot && o.rot.length >= 9) {
                        const rm = new THREE.Matrix4();
                        rm.set(
                            o.rot[0], o.rot[1], o.rot[2], 0,
                            o.rot[3], o.rot[4], o.rot[5], 0,
                            o.rot[6], o.rot[7], o.rot[8], 0,
                            0, 0, 0, 1
                        );
                        mesh.quaternion.setFromRotationMatrix(rm);
                    }
                    mesh.userData.ref = o.ref;
                }
                scene.add(mesh);
                sceneObjs[o.ref] = mesh;
            }

            // Чистим кэш от аватаров, чьи Instance удалили через обычный
            // Explorer/Delete — сервер уже не пришлёт такой ref в objects.
            if (window._avatarMeshCache) {
                const liveRefs = new Set(objects.map(o => o.ref));
                for (const ref of Object.keys(window._avatarMeshCache)) {
                    if (!liveRefs.has(Number(ref))) {
                        const entry = window._avatarMeshCache[ref];
                        entry.object.traverse(n => {
                            if (n.isMesh) {
                                if (n.geometry) n.geometry.dispose();
                                const mats = Array.isArray(n.material) ? n.material : [n.material];
                                mats.forEach(m => { if (m) { if (m.map) m.map.dispose(); m.dispose(); } });
                            }
                        });
                        delete window._avatarMeshCache[ref];
                    }
                }
            }

            const shown = Object.keys(sceneObjs).length;
            notify(t('notify_scene_loaded', { n: shown }) + (totalAvailable > shown ? t('notify_scene_of', { total: totalAvailable }) : ''));
            updateInventoryCount();

            // Обновляем выделение если было
            if (selectedRef && sceneObjs[selectedRef]) {
                highlightSelected(selectedRef);
            }
        }

        function highlightSelected(ref) {
            for (const [r, mesh] of Object.entries(sceneObjs)) {
                // ФИКС: импортированные 3D-аватары (importAvatarIntoScene)
                // хранятся в sceneObjs как THREE.Group (результат
                // OBJLoader.parse), а не как одиночный THREE.Mesh — у
                // Group нет своего .material, поэтому обращение к
                // mesh.material.emissive кидало TypeError и обрывало
                // выполнение всей функции. Так как highlightSelected()
                // вызывается при КАЖДОМ выборе объекта, эта ошибка ломала
                // выбор вообще любого объекта в сцене, как только в ней
                // был хотя бы один импортированный аватар. Подсвечиваем
                // рекурсивно все дочерние меши группы вместо прямого
                // обращения к несуществующему mesh.material.
                const isSelected = parseInt(r) === ref;
                const applyEmissive = (m) => {
                    if (!m || !m.material) return;
                    const mats = Array.isArray(m.material) ? m.material : [m.material];
                    mats.forEach(mat => {
                        if (!mat) return;
                        mat.emissive = new THREE.Color(isSelected ? 0xff6600 : 0);
                        mat.emissiveIntensity = isSelected ? 0.4 : 0;
                    });
                };
                if (mesh.isMesh) {
                    applyEmissive(mesh);
                } else if (typeof mesh.traverse === 'function') {
                    mesh.traverse(n => { if (n.isMesh) applyEmissive(n); });
                }
            }
            if (window._selBox) {
                scene.remove(window._selBox);
                window._selBox = null;
            }
            if (ref && sceneObjs[ref]) {
                const box = new THREE.BoxHelper(sceneObjs[ref], 0xff6600);
                scene.add(box);
                window._selBox = box;
            }
        }

        // ============ PLAY-РЕЖИМ (ФИЗИКА + ПЕРСОНАЖ) ============
        let isPlaying = false;
        let prevFogFar = null; // scene.fog.far на момент старта Play — восстанавливается в stopPlay()
        let physicsWorld = null;
        let physicsBodies = {};   // ref -> CANNON.Body
        let playSnapshot = {};    // ref -> THREE.Matrix4 до запуска
        let playOnlyRefs = new Set(); // ref-ы мешей, подгруженных только для Play
        // Позиция каждого загруженного (в Play) объекта — независимо от
        // того, есть ли у него физ-тело. Вся геометрия статична (mass=0,
        // см. addPhysicsBodyForObj), так что позиция не меняется после
        // добавления — читать её из physicsBodies[ref].position раньше
        // работало только для объектов С физикой; с разделением
        // рендер/физика визуальным мешам физ-тела вообще нет, так что
        // дистанцию для них берём отсюда.
        let loadedObjPos = {}; // ref -> {x,y,z}
        let charBody = null;
        let charMesh = null; // куб для вида от третьего лица, см. toggleThirdPerson

        function updateCharMeshVisibility() {
            if (charMesh) charMesh.visible = isPlaying && thirdPerson;
        }
        let jumpQueued = false;
        let canJump = false;
        let prevCameraState = null;
        const GRAVITY_STUDS = -196.2; // workspace.Gravity в настоящем Roblox
        const CHAR_RADIUS = 1.4;      // примерный радиус капсулы персонажа
        // (было 2.2 — со стандартным Roblox-персонажем шириной ~2 стада
        // это ощутимо толще самого перса; на стыках чанкованной геометрии
        // и в узких проходах такая толщина иногда утапливала камеру
        // (она сидит в центре сферы, см. followCharacterCamera) прямо в
        // стену — оттуда сплошная серая заливка вблизи + чёрная пустота
        // за ней, вместо нормального вида).
        const CHAR_SPEED = 16;        // стадов/сек — дефолтный Humanoid.WalkSpeed
        const STEP_HEIGHT = 3.2;      // студов — низкий бордюр перешагиваем автоматически
        const JUMP_VELOCITY = 50;
        const EYE_HEIGHT = CHAR_RADIUS + 3;
        // Физику считаем не для всей загруженной сцены (при Quality=High это
        // могут быть тысячи объектов и телефон не тянет), а только для тех,
        // что ближе всего к точке спавна — это отдельный от рендер-LOD лимит.
        //
        // Раньше этот потолок был константой (1600), одинаковой для всех
        // Quality — то есть даже на Low телефон всё равно получал те же
        // ~1600 отдельных мешей во время Play (каждое физ-тело = свой
        // draw call), и именно это "проседание FPS" со временем и было:
        // Low ограничивает объекты редактора (maxObjects), но не то, что
        // догружается по ходу Play. Теперь лимит берётся из качества.
        //
        // Раньше у запроса к серверу (limit) был отдельный, чуть больший
        // потолок, чем у клиентской обрезки (streamCap) — "с запасом".
        // На деле это давало обратный эффект: сервер каждый раз честно
        // возвращал тот же самый избыток сверх streamCap, клиент тут же
        // обрезал его назад — а на плотной карте у спавна (замок) это
        // означало пересоздание физ-тел и мешей каждые 600мс даже стоя на
        // месте. Запрашиваем сразу ровно streamCap — избытка просто нет.
        function maxStreamedBodies() { return qualitySettings.playBodies; }
        function maxVisualBodies() { return qualitySettings.visualBodies || qualitySettings.playBodies; }
        // Раньше геометрия для физики запрашивалась ОДИН раз при старте
        // Play, вокруг точки спавна — стоило отойти достаточно далеко, и
        // под ногами/вокруг просто не оставалось ни одного тела: пол
        // исчезал, "raycast" переставал что-либо находить не потому что
        // сломан, а потому что физически нечего было проверять. Теперь
        // догружаем и выгружаем геометрию по ходу движения персонажа.
        let lastStreamPos = { x: null, y: null, z: null };
        let streamInFlight = false;
        let fallingSinceMs = null; // когда персонаж начал падать без опоры под ногами
        const STREAM_REFRESH_DIST = 20;   // студов сместились — пора подгрузить ещё
        const STREAM_REFRESH_MS = 600;    // не чаще этого, даже если стоим на месте
        const STREAM_PRUNE_DIST = 5000;    // общий "дальний" предел (fog/начальный вид) — НЕ радиус подгрузки, см. qualitySettings.loadRadius
        const UNLOAD_MARGIN = 150;   // студов сверх loadRadius — гистерезис, чтобы объект
        // на самой границе загрузки/выгрузки не мигал каждый refresh-цикл
        // от малейшего дрожания позиции (стандартный приём в chunk-based
        // стриминге: unload-радиус чуть больше load-радиуса).
        // За пределами этой дистанции меш всё ещё физически существует
        // (тело нужно, чтобы пол/стены не исчезали резко под ногами), но
        // рендерить его смысла нет — он и так почти не виден и просто ест
        // draw call'ы.
        //
        // ВАЖНО: не может быть больше qualitySettings.visualRadius — иначе
        // мы пытаемся рендерить дальше, чем вообще грузим геометрию (даже
        // визуально, без физики), и разница становится мёртвой зоной,
        // которая никогда не заполнится (там просто нет мешей, чтобы их
        // рендерить), сколько её ни "включай". Именно visualRadius, а не
        // loadRadius — тот теперь только про физику (playBodies), рендер
        // может честно уходить дальше него без коллайдеров. Вычитаем
        // небольшой запас (loadMargin) — иначе рендер догоняет загрузку
        // впритык, и геометрия появляется буквально в кадре шага ходьбы,
        // а не заранее.
        function playRenderCutoff() {
            const loadMargin = 100;
            const visualRadius = qualitySettings.visualRadius || qualitySettings.loadRadius || 350;
            return Math.min(qualitySettings.renderDistance, STREAM_PRUNE_DIST * 0.6, visualRadius - loadMargin);
        }

        function togglePlay() {
            if (isPlaying) stopPlay(); else startPlay();
        }

        // Раньше спавн искался среди уже подгруженных в редакторе мешей —
        // если сцена была открыта на Low-качестве или камера стояла далеко
        // от SpawnLocation, объект просто не был загружен, и Play спавнил
        // персонажа в воздухе без единой опоры под ногами ("падение в
        // пустоту"). Теперь спавн и ближайшая геометрия запрашиваются с
        // бэкенда напрямую, независимо от того, что сейчас на экране.
        async function findSpawnPoint() {
            const r = await api('GET', '/api/spawn');
            if (r && r.ok) {
                return { x: r.x, y: r.y + CHAR_RADIUS + 1, z: r.z };
            }
            notify(t('notify_spawn_not_found'), 'warn');
            return { x: target.x, y: target.y + 10, z: target.z };
        }

        // Кэши геометрии/материалов для мешей, которые Play подгружает по
        // ходу (объекты, которых не было в текущем виде редактора) — общие
        // на весь сеанс Play, не пересоздаём при каждой подгрузке.
        let playGeoCache = {}, playMatCache = {};

        function addPhysicsBodyForObj(o) {
            if (physicsBodies[o.ref]) return; // уже физически представлен
            let mesh = sceneObjs[o.ref];
            if (!mesh) {
                // Этого объекта не было в текущем виде редактора —
                // подгружаем именно для физики и добавляем в сцену.
                mesh = buildMeshFromObj(o, playGeoCache, playMatCache);
                scene.add(mesh);
                sceneObjs[o.ref] = mesh;
                playOnlyRefs.add(o.ref);
            }
            if (!(o.ref in playSnapshot)) {
                playSnapshot[o.ref] = mesh.matrix.clone();
            }
            loadedObjPos[o.ref] = { x: o.px, y: o.py, z: o.pz };

            const pos = new THREE.Vector3();
            const quat = new THREE.Quaternion();
            mesh.matrix.decompose(pos, quat, new THREE.Vector3());

            const shape = buildCannonShape(mesh);
            if (!shape) return;

            const canCollide = mesh.userData.cancollideFlag !== false;

            // По умолчанию вся загруженная геометрия статична (mass=0),
            // Anchored конкретной части игнорируется. На этой карте
            // большая часть Part вообще не заанкорена (обычный билд
            // без расчёта на реальную физику) — если честно уважать
            // Anchored=false, весь замок рядом со спавном рушится в
            // момент старта Play и заваливает/зажимает персонажа
            // обломками, из-за чего он не может двигаться. Двигается
            // по-настоящему только сам персонаж.
            const body = new CANNON.Body({
                mass: 0,
                shape: shape,
                position: new CANNON.Vec3(pos.x, pos.y, pos.z),
                quaternion: new CANNON.Quaternion(quat.x, quat.y, quat.z, quat.w),
                allowSleep: true,
            });

            if (!canCollide) {
                body.collisionFilterGroup = 2;
                body.collisionFilterMask = 0;
            }

            physicsWorld.addBody(body);
            physicsBodies[o.ref] = body;
            body.__ref = o.ref; // для Touched-события (см. beginContact ниже) — по-другому
            // из cannon.js колбэка контакта не узнать, какому игровому
            // объекту принадлежит столкнувшееся тело.
        }

        // Только меш, без CANNON.Body — для объектов, которые видно, но до
        // которых игрок физически не дойдёт в ближайшее время (не входят
        // в ближайшие playBodies по честной дистанции). GPU эту геометрию
