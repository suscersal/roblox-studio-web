<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Roblox Studio Mobile</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #111827;
            color: #fff;
            font-family: system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        #toolbar-top {
            background: #1f2937;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            height: 40px;
            flex-shrink: 0;
            border-bottom: 1px solid #374151;
            overflow-x: auto
        }

        #toolbar-top button {
            background: #374151;
            border: none;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap
        }

        #toolbar-top button:hover {
            background: #4b5563
        }

        #toolbar-top button.green {
            background: #065f46
        }

        #toolbar-top button.red {
            background: #7f1d1d
        }

        #toolbar-top button.blue {
            background: #1e3a8a
        }

        #toolbar-top button.purple {
            background: #7c3aed
        }

        #toolbar-top .sep {
            width: 1px;
            height: 24px;
            background: #374151;
            margin: 0 4px
        }

        #toolbar-top .title {
            font-weight: bold;
            margin-right: 8px;
            font-size: 14px;
            white-space: nowrap
        }

        @media (max-width: 700px) {
            #toolbar-top {
                flex-wrap: wrap;
                height: auto;
                overflow-x: visible;
                padding: 4px 6px
            }

            #toolbar-top .title {
                width: 100%;
                margin-bottom: 2px
            }

            #toolbar-top button {
                padding: 5px 7px;
                font-size: 12px
            }
        }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden
        }

        #explorer {
            width: 220px;
            min-width: 150px;
            max-width: 400px;
            flex-shrink: 0;
            background: #1f2937;
            display: flex;
            flex-direction: column;
            position: relative
        }

        .resizer {
            width: 5px;
            background: #374151;
            cursor: col-resize;
            flex-shrink: 0;
            transition: background 0.2s;
            position: relative;
            z-index: 10
        }

        .resizer:hover,
        .resizer.active {
            background: #3b82f6
        }

        .resizer::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 30px;
            background: #6b7280;
            border-radius: 2px
        }

        .resizer:hover::after,
        .resizer.active::after {
            background: #fff
        }

        #explorer-header {
            background: #111827;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            color: #9ca3af;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        #explorer-header button {
            background: #374151;
            border: none;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px
        }

        #search-box {
            background: #374151;
            border: none;
            color: #fff;
            padding: 4px 8px;
            width: 100%;
            font-size: 12px;
            outline: none;
            flex-shrink: 0
        }

        #tree-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden
        }

        #tree {
            padding: 2px 0
        }

        .tree-node {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 1px 0;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            overflow: hidden;
            font-size: 12px
        }

        .tree-node:hover {
            background: #374151
        }

        .tree-node.selected {
            background: #1e3a5f
        }

        .tree-arrow {
            width: 14px;
            text-align: center;
            color: #6b7280;
            font-size: 10px;
            flex-shrink: 0
        }

        .tree-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
            flex-shrink: 0;
            background: white;
            border-radius: 2px
        }

        .tree-label {
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 2px
        }

        .tree-label mark {
            background: #854d0e;
            color: #fef08a;
            border-radius: 2px
        }

        #viewport {
            flex: 1;
            position: relative;
            background: #0f172a;
            overflow: hidden;
            min-width: 200px
        }

        #viewport canvas {
            display: block
        }

        #vp-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 11px;
            color: #9ca3af;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 10px;
            border-radius: 6px;
            line-height: 1.5;
            z-index: 5;
            backdrop-filter: blur(4px)
        }

        #fps-counter {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 11px;
            color: #22c55e;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 5;
            font-family: monospace
        }

        #speed-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 11px;
            color: #fbbf24;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 5;
            display: none
        }

        #quality-selector {
            position: absolute;
            top: 36px;
            right: 8px;
            z-index: 5;
            display: flex;
            gap: 2px
        }

        #quality-selector button {
            background: rgba(31, 41, 55, 0.9);
            border: 1px solid #4b5563;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            backdrop-filter: blur(4px)
        }

        #quality-selector button.active {
            background: #3b82f6;
            border-color: #60a5fa
        }

        #rightpanel {
            width: 260px;
            min-width: 200px;
            max-width: 500px;
            flex-shrink: 0;
            min-height: 0;
            background: #1f2937;
            display: flex;
            flex-direction: column
        }

        #tabs {
            display: flex;
            background: #111827;
            flex-shrink: 0
        }

        .tab {
            flex: 1;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            color: #6b7280;
            border-bottom: 2px solid transparent
        }

        .tab.active {
            color: #fff;
            border-bottom: 2px solid #3b82f6
        }

        #tab-props {
            flex: 1;
            overflow-y: auto;
            padding: 4px
        }

        #tab-script {
            flex: 1;
            min-height: 0;
            display: none;
            flex-direction: column
        }

        #script-name {
            padding: 4px 6px;
            font-size: 11px;
            color: #6b7280;
            flex-shrink: 0;
            background: #111827
        }

        #script-editor-container {
            flex: 1;
            min-height: 0;
            position: relative
        }

        .CodeMirror {
            height: 100% !important;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px
        }

        .CodeMirror-scroll {
            overflow: auto !important;
            touch-action: pan-x pan-y !important;
        }

        .CodeMirror-vscrollbar,
        .CodeMirror-hscrollbar {
            display: block !important;
        }

        #script-save-btn {
            background: #065f46;
            border: none;
            color: #fff;
            padding: 6px;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0
        }

        .prop-header {
            padding: 4px 6px;
            background: #111827;
            border-radius: 4px;
            margin-bottom: 4px
        }

        .prop-cls {
            font-weight: bold;
            font-size: 13px
        }

        .prop-ref {
            font-size: 10px;
            color: #6b7280
        }

        .prop-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 1px 2px;
            min-height: 24px
        }

        .prop-name {
            width: 110px;
            flex-shrink: 0;
            font-size: 11px;
            color: #9ca3af;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .prop-val {
            flex: 1;
            background: #374151;
            border: none;
            color: #fff;
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 3px;
            width: 100%;
            outline: none
        }

        .prop-val:focus {
            background: #4b5563
        }

        .prop-bool {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #3b82f6
        }

        .prop-color-preview {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            border: 1px solid #4b5563;
            flex-shrink: 0;
            cursor: pointer
        }

        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100
        }

        #modal-overlay.show {
            display: flex
        }

        .modal {
            background: #1f2937;
            border-radius: 8px;
            padding: 16px;
            min-width: 320px;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .modal h3 {
            font-size: 15px;
            font-weight: bold
        }

        .modal input,
        .modal select {
            background: #374151;
            border: 1px solid #4b5563;
            color: #fff;
            padding: 6px 8px;
            border-radius: 4px;
            width: 100%;
            font-size: 13px;
            outline: none
        }

        .modal button {
            background: #374151;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px
        }

        .modal button:hover {
            background: #4b5563
        }

        .modal-row {
            display: flex;
            gap: 6px
        }

        .modal-row button {
            flex: 1
        }

        #fb-path {
            font-size: 11px;
            color: #9ca3af;
            padding: 4px 0;
            word-break: break-all
        }

        #fb-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #374151;
            border-radius: 4px;
            min-height: 200px;
            max-height: 40vh
        }

        .fb-entry {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 12px
        }

        .fb-entry:hover {
            background: #374151
        }

        .fb-entry.file-rbxl {
            color: #86efac
        }

        .fb-entry.file-json {
            color: #fcd34d
        }

        .fb-entry.dir {
            color: #fde68a
        }

        .fb-size {
            margin-left: auto;
            color: #6b7280;
            font-size: 10px
        }

        ::-webkit-scrollbar {
            width: 4px
        }

        ::-webkit-scrollbar-track {
            background: #1f2937
        }

        ::-webkit-scrollbar-thumb {
            background: #374151
        }

        #notify {
            position: fixed;
            bottom: 50px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 200
        }

        .notif {
            background: #065f46;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            animation: fadein .2s ease
        }

        .notif.err {
            background: #7f1d1d
        }

        .notif.warn {
            background: #78350f
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        #mobile-pad {
            position: absolute;
            bottom: 56px;
            left: 16px;
            display: none;
            align-items: flex-end;
            gap: 14px;
            z-index: 10;
            pointer-events: none
        }

        @media(pointer:coarse) {
            #mobile-pad {
                display: flex
            }
        }

        #joy-base {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: rgba(31, 41, 55, 0.55);
            border: 1px solid #4b5563;
            position: relative;
            pointer-events: all;
            touch-action: none;
        }

        #joy-thumb {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.85);
            border: 1px solid #93c5fd;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .pad-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            pointer-events: all
        }

        .pad-btn {
            width: 52px;
            height: 52px;
            background: rgba(31, 41, 55, 0.85);
            border: 1px solid #4b5563;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .pad-btn.active {
            background: rgba(59, 130, 246, 0.7)
        }
    </style>
</head>

<body>
    <div id="toolbar-top">
        <span class="title">🎮 RbxStudio</span>
        <div class="sep"></div>
        <button onclick="openFileBrowser('open')" data-i18n-title="tb_open_title" title="Open file (Ctrl+O)"><span data-i18n="tb_open">📂 Open</span></button>
        <button class="green" onclick="saveFile()" data-i18n-title="tb_save_title" title="Save (Ctrl+S)"><span data-i18n="tb_save">💾 Save</span></button>
        <button onclick="openFileBrowser('save')" data-i18n-title="tb_saveas_title" title="Save as"><span data-i18n="tb_saveas">💾 As...</span></button>
        <div class="sep"></div>
        <button onclick="showAddDialog()" data-i18n-title="tb_addobj_title" title="Add object"><span data-i18n="tb_add">➕ Add</span></button>
        <button class="red" onclick="deleteSelected()" data-i18n-title="tb_delete_title" title="Delete (Delete)"><span data-i18n="tb_delete">🗑 Delete</span></button>
        <div class="sep"></div>
        <button onclick="reloadScene()" data-i18n-title="tb_refresh_title" title="Refresh scene (F5)"><span data-i18n="tb_refresh">🔄 Refresh</span></button>
        <button class="blue" onclick="showPublishDialog()" data-i18n-title="tb_publish_title" title="Publish"><span data-i18n="tb_publish">☁ Publish</span></button>
        <button class="purple" id="avatar3d-btn" onclick="showAvatar3dDialog()" title="Скачать 3D-аватар по Roblox User ID">🧍 Avatar</button>
        <div class="sep"></div>
        <button class="green" id="play-btn" onclick="togglePlay()" data-i18n-title="tb_play_title" title="Run physics simulation"><span data-i18n="tb_play">▶ Play</span></button>
        <div class="sep"></div>
        <button onclick="resetCamera()" data-i18n-title="tb_resetcam_title" title="Reset camera"><span data-i18n="tb_resetcam">🏠 Reset</span></button>
        <button onclick="topView()" data-i18n-title="tb_topview_title" title="Top view"><span data-i18n="tb_topview">⬆ Top</span></button>
        <button onclick="frontView()" data-i18n-title="tb_frontview_title" title="Front view"><span data-i18n="tb_frontview">📷 Front</span></button>
        <button onclick="rightView()" data-i18n-title="tb_rightview_title" title="Right view"><span data-i18n="tb_rightview">➡ Right</span></button>
        <div class="sep"></div>
        <button onclick="toggleHelpers()" data-i18n-title="tb_helpers_title" title="Grid and axes">📏</button>
        <button onclick="resetLayout()" data-i18n-title="tb_resetlayout_title" title="Reset panel sizes">📐</button>
    </div>

    <div id="main">
        <div id="explorer">
            <div id="explorer-header">
                <span>Explorer</span>
                <div>
                    <button onclick="collapseAll()" data-i18n-title="exp_collapse_title" title="Collapse all">◢</button>
                    <button onclick="expandAllVisible()" data-i18n-title="exp_expand_title" title="Expand all">◣</button>
                </div>
            </div>
            <input id="search-box" data-i18n-placeholder="exp_search_ph" placeholder="🔍 Search..." oninput="onSearch(this.value)">
            <div id="tree-scroll">
                <div id="tree"></div>
            </div>
        </div>
        <div class="resizer" id="resizer-1"></div>
        <div id="viewport" tabindex="0">
            <div id="fps-counter">FPS: --</div>
            <div id="speed-indicator">🚀 x1.0</div>
            <div id="quality-selector">
                <button onclick="setQuality('low')" class="active" id="q-low">Low</button>
                <button onclick="setQuality('medium')" id="q-medium">Med</button>
                <button onclick="setQuality('high')" id="q-high">High</button>
            </div>
            <div id="vp-label" data-i18n-html="vp_hint">
                🖱️ LMB — rotate | 🖱️ RMB — pan | 🖱️ Wheel — render distance<br>
                ⌨️ WASD — move | F — focus | Esc — deselect
            </div>
            <div id="mobile-pad">
                <div id="joy-base">
                    <div id="joy-thumb"></div>
                </div>
                <div class="pad-col">
                    <button class="pad-btn" id="pad-e" data-key="e" data-i18n-title="pad_up_title" title="Up">⬆</button>
                    <button class="pad-btn" id="pad-q" data-key="q" data-i18n-title="pad_down_title" title="Down">⬇</button>
                </div>
            </div>
        </div>
        <div class="resizer" id="resizer-2"></div>
        <div id="rightpanel">
            <div id="tabs">
                <div class="tab active" onclick="switchTab('props')">Properties</div>
                <div class="tab" onclick="switchTab('script')">Script</div>
            </div>
            <div id="tab-props">
                <p style="color:#6b7280;font-size:12px;padding:8px" data-i18n="props_placeholder">← Select an object</p>
            </div>
            <div id="tab-script" style="display:none;flex:1;flex-direction:column">
                <div id="script-name" data-i18n="script_none_selected">No script selected</div>
                <div id="script-editor-container">
                    <textarea id="script-editor" spellcheck="false"></textarea>
                </div>
                <button id="script-save-btn" onclick="saveScript()" data-i18n="script_save_btn">💾 Save script</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content" class="modal"></div>
    </div>
    <div id="notify"></div>

    <script>
        // ============ I18N ============
        // Dictionary keyed by 2-letter language code. Add more languages
        // by adding a new key here (falls back to "en" for missing strings).

            en: {
                tb_open: '📂 Open', tb_open_title: 'Open file (Ctrl+O)',

                pad_up_title: 'Up',
                pad_down_title: 'Down',
                pad_jump_title: 'Jump',
                props_placeholder: '← Select an object',
                script_none_selected: 'No script selected',
                script_save_btn: '💾 Save script',
                notify_quality: '🎨 Quality: ',
                notify_layout_reset: '📐 Panel sizes reset',
                notify_camera_reset: '🏠 Camera reset',
                notify_topview: '⬆ Top view',
                notify_frontview: '📷 Front view',
                notify_rightview: '➡ Right view',
                notify_stop_play_first: 'Stop Play first, then refresh the scene',
                notify_scene_loaded: '🔄 Scene: {n} objects',
                notify_scene_of: ' (of {total})',
                notify_helpers_on: '📏 Grid and axes: ON',
                notify_helpers_off: '📏 Grid and axes: OFF',
                notify_spawn_not_found: 'SpawnLocation not found in file — spawning near current camera',
                notify_cannon_not_ready: "Cannon.js hasn't loaded yet, wait a second and try again",
                notify_no_geometry: 'No geometry near the spawn — nothing to run',
                notify_play_started: '▶ Play: {n} physics bodies',
                notify_stop: '⏹ Stop',
                notify_script_none: 'No script selected',
                notify_script_saved: '✅ Script saved',
                notify_focus: '🎯 Focused on object',
                notify_loaded_count: '✅ {n} objects',
                notify_error: 'Error',
                fb_saveas_title: '💾 Save as',
                fb_open_title: '📂 Open',
                fb_name_ph: 'file.rbxl',
                btn_save: 'Save',
                btn_cancel: 'Cancel',
                btn_publish: 'Publish',
                notify_saved_simple: '💾 Saved',
                notify_save_cancelled: 'Save cancelled or failed',
                notify_enter_name: 'Enter a name',
                add_name_ph: 'Name',
                add_parent_label: 'Parent:',
                btn_add: 'Add',
                notify_not_selected: 'Nothing selected',

        // Language auto-detection: browser language first (navigator.languages,
        // falling back to navigator.language), with an optional manual override
        // saved in localStorage (e.g. localStorage.setItem('rbxstudio-lang','ru')).
        // Unknown languages fall back to English.
        function detectLang() {
            try {
                const saved = localStorage.getItem('rbxstudio-lang');
                if (saved && I18N[saved]) return saved;
            } catch (e) { }
            const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
            for (const l of langs) {
                const short = (l || '').slice(0, 2).toLowerCase();
                if (I18N[short]) return short;
            }
            return 'en';
        }
        const LANG = detectLang();

        function t(key, vars) {
            let s = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : (I18N.en[key] != null ? I18N.en[key] : key);
            if (vars) {
                for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
            }
            return s;
        }

        function applyStaticI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.getAttribute('data-i18n-title')); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
            document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
            document.documentElement.lang = LANG;
        }
        applyStaticI18n();
    </script>

        // ============ РАЗДЕЛИТЕЛИ ПАНЕЛЕЙ ============
        function initResizers() {
            const resizers = document.querySelectorAll('.resizer');
            let currentResizer = null, startX = 0, startWidth = 0, startRightWidth = 0;

            resizers.forEach(resizer => {
                resizer.addEventListener('mousedown', (e) => {
                    currentResizer = resizer;
                    resizer.classList.add('active');
                    if (resizer.id === 'resizer-1') {
                        startWidth = document.getElementById('explorer').offsetWidth;
                        startX = e.clientX;
                    } else if (resizer.id === 'resizer-2') {
                        startRightWidth = document.getElementById('rightpanel').offsetWidth;
                        startX = e.clientX;
                    }
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                });
            });

            document.addEventListener('mousemove', (e) => {
                if (!currentResizer) return;
                if (currentResizer.id === 'resizer-1') {
                    let w = Math.max(150, Math.min(400, startWidth + e.clientX - startX));
                    document.getElementById('explorer').style.width = w + 'px';
                } else if (currentResizer.id === 'resizer-2') {
                    let w = Math.max(200, Math.min(500, startRightWidth + startX - e.clientX));
                    document.getElementById('rightpanel').style.width = w + 'px';
                }
                refreshCM();
                resize();
            });

            document.addEventListener('mouseup', () => {
                if (currentResizer) {
                    currentResizer.classList.remove('active');
                    currentResizer = null;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    saveLayout();
                }
            });

            // Touch support
            resizers.forEach(resizer => {
                resizer.addEventListener('touchstart', (e) => {
                    currentResizer = resizer;
                    resizer.classList.add('active');
                    if (resizer.id === 'resizer-1') {
                        startWidth = document.getElementById('explorer').offsetWidth;
                        startX = e.touches[0].clientX;
                    } else if (resizer.id === 'resizer-2') {
                        startRightWidth = document.getElementById('rightpanel').offsetWidth;
                        startX = e.touches[0].clientX;
                    }
                    document.body.style.userSelect = 'none';
                });
            });

            document.addEventListener('touchmove', (e) => {
                if (!currentResizer) return;
                if (currentResizer.id === 'resizer-1') {
                    let w = Math.max(150, Math.min(400, startWidth + e.touches[0].clientX - startX));
                    document.getElementById('explorer').style.width = w + 'px';
                } else if (currentResizer.id === 'resizer-2') {
                    let w = Math.max(200, Math.min(500, startRightWidth + startX - e.touches[0].clientX));
                    document.getElementById('rightpanel').style.width = w + 'px';

        // ============ THREE.JS ПЕРЕМЕННЫЕ ============

        let keysPressed = {};
        let joyVector = { x: 0, y: 0 }; // аналоговый стик: x — влево/вправо, y — вперёд/назад

        let fpsFrames = 0;

        // Раньше подгрузка триггерилась только WASD-движением, да ещё с
        // условием "только если объектов уже больше 500" — то есть ровно
        // тогда, когда объектов мало и нужна дозагрузка, она НЕ срабатывала.
        // Радиус теперь фиксирован (не зависит от зума), так что зум/поворот
        // сам по себе дозагрузку не требует — важно только реальное
        // смещение точки обзора (WASD-полёт, панорама ПКМ).
        function maybeReloadNearby(now) {
            if (isPlaying) return; // у Play своя отдельная подгрузка вокруг персонажа
            if (now - lastCameraUpdate < CAMERA_UPDATE_INTERVAL) return;
            const moved = lastReloadTarget.x === null
                ? Infinity
                : Math.hypot(target.x - lastReloadTarget.x, target.y - lastReloadTarget.y, target.z - lastReloadTarget.z);
            const threshold = (qualitySettings.renderDistance || 300) * 0.25;
            if (moved < threshold) return;
            reloadScene();

                    btn.addEventListener(ev, e => {

        function initJoystick() {
            const base = document.getElementById('joy-base');
            const thumb = document.getElementById('joy-thumb');
            if (!base || !thumb) return;
            const maxR = 34; // px, максимальный вылет ручки стика
            let touchId = null;

            function setThumb(dx, dy) {
                thumb.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
            }

            function handleMove(clientX, clientY) {
                const rect = base.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = clientX - cx;
                let dy = clientY - cy;
                const dist = Math.hypot(dx, dy);
                if (dist > maxR) {
                    dx = dx / dist * maxR;
                    dy = dy / dist * maxR;
                }
                setThumb(dx, dy);
                joyVector.x = dx / maxR;
                joyVector.y = -dy / maxR; // тянем вверх по экрану — едем вперёд
            }

            function resetJoy() {
                touchId = null;
                joyVector.x = 0;
                joyVector.y = 0;
                setThumb(0, 0);
            }

            base.addEventListener('touchstart', e => {
                e.preventDefault();
                e.stopPropagation();
                const t = e.changedTouches[0];
                touchId = t.identifier;
                handleMove(t.clientX, t.clientY);
            }, { passive: false });

            base.addEventListener('touchmove', e => {
                e.preventDefault();
                e.stopPropagation();
                for (const t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        handleMove(t.clientX, t.clientY);
                        break;
                    }
                }
            }, { passive: false });

            ['touchend', 'touchcancel'].forEach(ev => base.addEventListener(ev, e => {
                for (const t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        resetJoy();
                        break;
                    }
                }
            }));
        }

        function updateHelpers() {
            if (window._gridHelper) {
                scene.remove(window._gridHelper);
                window._gridHelper = null;
            }
            if (window._axesHelper) {
                scene.remove(window._axesHelper);
                window._axesHelper = null;
            }
            if (qualitySettings.helpers) {
                window._gridHelper = new THREE.GridHelper(200, 40, 0x374151, 0x1f2937);
                window._axesHelper = new THREE.AxesHelper(5);
                scene.add(window._gridHelper);
                scene.add(window._axesHelper);

            qualitySettings.helpers = !qualitySettings.helpers;
